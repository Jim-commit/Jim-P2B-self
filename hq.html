<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>总代仓储装车与财务中台</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans p-4">
  <div class="max-w-4xl mx-auto space-y-4">
    <!-- 头部：多租户与路线选择 -->
    <header class="bg-indigo-800 text-white p-4 rounded-xl shadow flex justify-between items-center">
      <div>
        <div class="flex items-center gap-2">
          <h1 class="text-lg font-bold">超级总代 · 仓配波次与对账中台</h1>
          <span class="inline-flex items-center gap-1 bg-emerald-500/20 text-emerald-300 text-[10px] px-2 py-0.5 rounded-full border border-emerald-400/30">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
            Realtime 实时监听中
          </span>
        </div>
        <div class="flex items-center gap-2 mt-1">
          <span class="text-xs text-indigo-200">当前归属总代：</span>
          <select id="tenant-switcher" onchange="switchTenant(this.value)" class="bg-indigo-900 border border-indigo-600 text-white text-xs px-2 py-0.5 rounded font-bold outline-none cursor-pointer">
            <option value="BJ_HQ">北京顺达商贸 (BJ_HQ)</option>
            <option value="SH_HQ">上海乐购供应链 (SH_HQ)</option>
          </select>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <select id="route-select" onchange="loadWaveData()" class="bg-indigo-900 border border-indigo-700 text-white text-xs px-3 py-1.5 rounded-lg outline-none">
          <option value="城东A线">城东A线</option>
          <option value="城西B线">城西B线</option>
          <option value="浦东特快线">浦东特快线</option>
        </select>
        <button onclick="loadWaveData()" class="bg-white text-indigo-800 text-xs px-3 py-1.5 rounded-lg font-bold shadow-sm hover:bg-slate-50">
          生成装车总单
        </button>
      </div>
    </header>

    <!-- 仓库波次装车汇总表 (带堆叠防损指引、发车推送、导出) -->
    <div class="bg-white p-4 rounded-xl shadow border border-slate-200">
      <div class="flex justify-between items-center mb-3">
        <div>
          <h2 class="text-sm font-bold text-slate-800">📦 仓库总拣货汇总表 (波次装车单)</h2>
          <span class="text-[11px] text-slate-400">已内置「重货底层承重、轻抛上层轻放」装载指引</span>
        </div>
        <div class="flex gap-2">
          <!-- 核心新增：确认发车并自动通知 -->
          <button id="dispatch-btn" onclick="confirmDispatch()" class="text-xs bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white font-bold px-3 py-1 rounded shadow-sm flex items-center gap-1 transition">
            <span>🚚</span> 确认发车并通知
          </button>
          <button onclick="exportWaveCSV()" class="text-xs text-emerald-700 font-bold border border-emerald-200 px-2.5 py-1 rounded hover:bg-emerald-50">
            📥 导出装车 CSV
          </button>
          <button onclick="window.print()" class="text-xs text-indigo-600 font-bold border border-indigo-200 px-2.5 py-1 rounded hover:bg-indigo-50">
            🖨️ 打印拣货单
          </button>
        </div>
      </div>
      <table class="w-full text-left text-xs">
        <thead class="bg-slate-50 border-b border-slate-200">
          <tr>
            <th class="p-2.5">堆叠指引</th>
            <th class="p-2.5">条形码</th>
            <th class="p-2.5">商品名称</th>
            <th class="p-2.5">包装规格</th>
            <th class="p-2.5 text-right">装车总数</th>
          </tr>
        </thead>
        <tbody id="wave-table-body" class="divide-y divide-slate-100">
          <tr><td colspan="5" class="p-4 text-center text-slate-400">点击右上角“生成装车总单”刷新数据</td></tr>
        </tbody>
      </table>
    </div>

    <!-- 门店授信与欠款监管表 -->
    <div class="bg-white p-4 rounded-xl shadow border border-slate-200">
      <h2 class="text-sm font-bold text-slate-800 mb-3">💰 辖区门店欠款与授信红线监控</h2>
      <div id="store-debt-list" class="divide-y divide-slate-100 text-xs">
        <div class="p-4 text-center text-slate-400">数据加载中...</div>
      </div>
    </div>

    <!-- 司机现场实收与财务对账流水 -->
    <div class="bg-white p-4 rounded-xl shadow border border-slate-200">
      <div class="flex justify-between items-center mb-3">
        <h2 class="text-sm font-bold text-slate-800">📑 司机现场收款对账流水 (实时记账凭证)</h2>
        <button onclick="loadPaymentLogs()" class="text-xs text-indigo-600 font-bold border border-indigo-200 px-2 py-0.5 rounded hover:bg-indigo-50">刷新流水</button>
      </div>
      <table class="w-full text-left text-xs">
        <thead class="bg-slate-50 border-b">
          <tr>
            <th class="p-2">时间</th>
            <th class="p-2">门店</th>
            <th class="p-2">方式</th>
            <th class="p-2">实收金额</th>
            <th class="p-2">经手人</th>
            <th class="p-2">备注/电子签名</th>
          </tr>
        </thead>
        <tbody id="payment-logs-body" class="divide-y divide-slate-100">
          <tr><td colspan="6" class="p-4 text-center text-slate-400">加载流水记录中...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script type="module">
    import { supabase } from './src/lib/supabase.js';
    import { sendWechatNotice } from './src/lib/notify.js';

    let currentWaveData = [];
    const urlParams = new URLSearchParams(window.location.search);
    const currentTenant = urlParams.get('tenant') || 'BJ_HQ';
    const switcher = document.getElementById('tenant-switcher');
    if (switcher) switcher.value = currentTenant;

    window.switchTenant = function(newTenant) {
      urlParams.set('tenant', newTenant);
      window.location.search = urlParams.toString();
    };

    function getStackBadge(name) {
      if (name.includes('油') || name.includes('水') || name.includes('饮料')) {
        return '<span class="bg-blue-100 text-blue-700 px-1.5 py-0.5 rounded text-[10px] font-bold">⬇️ 底层重货</span>';
      }
      return '<span class="bg-amber-100 text-amber-700 px-1.5 py-0.5 rounded text-[10px] font-bold">⬆️ 上层轻放</span>';
    }

    // 1. 加载波次装车数据
    window.loadWaveData = async function() {
      const route = document.getElementById('route-select').value;
      const { data, error } = await supabase.rpc('get_route_wave_summary', { p_route_name: route });
      const tbody = document.getElementById('wave-table-body');
      
      currentWaveData = data || [];
      if (!data || data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="p-4 text-center text-slate-400">该路线当前暂无待装车订单</td></tr>';
        return;
      }
      tbody.innerHTML = data.map(it => `
        <tr>
          <td class="p-2.5">${getStackBadge(it.product_name)}</td>
          <td class="p-2.5 font-mono text-[11px] text-slate-500">${it.barcode}</td>
          <td class="p-2.5 font-bold text-slate-800">${it.product_name}</td>
          <td class="p-2.5 text-slate-500">${it.unit}</td>
          <td class="p-2.5 text-right font-bold text-indigo-700 text-sm">${it.total_qty}</td>
        </tr>
      `).join('');
    };

    // 2. 确认发车并全员通知
    window.confirmDispatch = async function() {
      const route = document.getElementById('route-select').value;
      if (!currentWaveData || currentWaveData.length === 0) {
        return alert('当前线路无待装车货物，无需发车！');
      }

      const totalBoxes = currentWaveData.reduce((sum, it) => sum + parseInt(it.total_qty || 0), 0);
      const confirmRun = confirm(`确认对【${route}】执行发车吗？\n共装载 ${totalBoxes} 箱，将同步更新所有订单为“配送中”并发送微信通知。`);
      if (!confirmRun) return;

      const btn = document.getElementById('dispatch-btn');
      btn.disabled = true;
      btn.innerText = '正在发车通知...';

      try {
        // 变更数据库状态为配送中
        const { data, error } = await supabase.rpc('dispatch_route_orders', { p_route_name: route });
        
        if (error) {
          alert('发车失败: ' + error.message);
        } else {
          const tenantName = currentTenant === 'BJ_HQ' ? '北京顺达商贸' : '上海乐购供应链';
          const title = `🚚【发车通知】${tenantName} · ${route}`;
          const desp = `### 总代车队已装车发货\n- **配送线路**：${route}\n- **装车总件数**：**${totalBoxes}** 箱\n- **配送覆盖门店**：${data.store_count || '多'} 家\n- **发车时间**：${new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}\n- **接车指引**：司机正沿指定干线配送，请各便利店预留收货通道与交接人。\n\n[👉 点击打开司机配送随车端](https://goods-lucky.vercel.app/driver.html?tenant=${currentTenant})`;

          // 触发个人微信卡片通知
          sendWechatNotice(title, desp);

          // 复制微信群播报格式文案
          const groupCopyText = `【总代发车播报】\n线路：${route}\n总数：${totalBoxes} 箱已装车发运\n预计送达：次日上午\n请沿线小店老板注意查收！`;
          if (navigator.clipboard) {
            navigator.clipboard.writeText(groupCopyText);
          }

          alert(`发车成功！已更新 ${data.order_count || 0} 笔订单为配送中。\n\n微信群播报文案已自动复制到剪贴板，可直接粘贴！`);
          window.loadWaveData();
        }
      } catch (e) {
        alert('处理异常，请重试');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<span>🚚</span> 确认发车并通知';
      }
    };

    // 3. 导出 CSV
    window.exportWaveCSV = function() {
      if (!currentWaveData || currentWaveData.length === 0) {
        return alert('暂无装车数据可导出！');
      }
      const route = document.getElementById('route-select').value;
      let csvContent = '\uFEFF堆叠要求,条形码,商品名称,包装规格,装车总数\n';
      currentWaveData.forEach(row => {
        const stack = (row.product_name.includes('油') || row.product_name.includes('水')) ? '底层重货' : '上层轻放';
        csvContent += `"${stack}","${row.barcode}","${row.product_name}","${row.unit}",${row.total_qty}\n`;
      });
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `波次装车清单_${route}_${new Date().toLocaleDateString().replace(/\//g,'-')}.csv`;
      link.click();
    };

    // 4. 门店欠款监管
    window.loadStores = async function() {
      const { data: stores } = await supabase.from('store').select('*');
      const container = document.getElementById('store-debt-list');
      if (!stores || stores.length === 0) {
        container.innerHTML = '<div class="p-4 text-center text-slate-400">暂无门店</div>';
        return;
      }
      container.innerHTML = stores.map(s => `
        <div class="py-2.5 flex justify-between items-center">
          <div>
            <div class="font-bold text-slate-800">${s.name} <span class="text-slate-400 font-normal">(${s.contact_name || '老板'})</span></div>
            <div class="text-[11px] text-slate-400 mt-0.5">${s.route_name} | 电话: ${s.phone}</div>
          </div>
          <div class="text-right">
            <div class="font-bold ${s.current_debt > (s.credit_limit * 0.8) ? 'text-red-600' : 'text-slate-700'}">
              欠款: ¥${s.current_debt}
            </div>
            <div class="text-[10px] text-slate-400">授信额度: ¥${s.credit_limit}</div>
          </div>
        </div>
      `).join('');
    };

    // 5. 司机对账流水
    window.loadPaymentLogs = async function() {
      const { data: logs } = await supabase
        .from('payment_record')
        .select('*, store(name)')
        .order('id', { ascending: false })
        .limit(20);

      const tbody = document.getElementById('payment-logs-body');
      if (!logs || logs.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="p-4 text-center text-slate-400">暂无实收对账流水</td></tr>';
        return;
      }

      tbody.innerHTML = logs.map(l => `
        <tr>
          <td class="p-2 text-slate-400 text-[11px]">${new Date(l.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</td>
          <td class="p-2 font-bold">${l.store ? l.store.name : '未知小店'}</td>
          <td class="p-2"><span class="px-1.5 py-0.5 rounded text-[10px] ${l.pay_method === 'CASH' ? 'bg-emerald-100 text-emerald-700' : 'bg-teal-100 text-teal-700'}">${l.pay_method === 'CASH' ? '现金' : '微信'}</span></td>
          <td class="p-2 font-bold text-emerald-600 text-sm">¥${l.amount}</td>
          <td class="p-2 text-slate-500">${l.operator || '司机'}</td>
          <td class="p-2 text-slate-400 text-[11px]">${l.remark || '--'}</td>
        </tr>
      `).join('');
    };

    // 6. Realtime 实时大屏监听
    function setupRealtimeListener() {
      supabase
        .channel('hq-dashboard-live')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'orders' }, () => {
          window.loadWaveData();
          window.loadStores();
        })
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'payment_record' }, () => {
          window.loadPaymentLogs();
          window.loadStores();
        })
        .subscribe();
    }

    window.loadWaveData();
    window.loadStores();
    window.loadPaymentLogs();
    setupRealtimeListener();
  </script>
</body>
</html>
