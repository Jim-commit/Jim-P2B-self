<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>百工商道 · 廠商實名資質入駐與進度查詢</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 1. 引入免費純前端真實 OCR 引擎 (Tesseract.js) -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <!-- 2. 引入免費純前端二維碼解碼庫 (掃描執照右上角官方公示系統碼) -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-[#18181b] text-stone-200 font-sans min-h-screen p-4 md:p-8 flex flex-col items-center justify-center">

  <div class="w-full max-w-2xl bg-[#27272a] border border-stone-700/80 rounded-3xl p-6 md:p-8 shadow-2xl space-y-6">
    
    <!-- 頂部抬頭 -->
    <header class="text-center space-y-2 border-b border-stone-700 pb-5">
      <div class="w-14 h-14 bg-amber-500/10 border border-amber-500/30 text-amber-400 rounded-2xl flex items-center justify-center text-3xl mx-auto shadow-inner">
        🏛️
      </div>
      <h1 class="text-xl font-bold text-white tracking-wide">百工商道 · 廠商實名資質入駐中心</h1>
      <p class="text-xs text-stone-400">
        執照後六位即預設安家密鑰 · 商號代號即下游認領碼 · 光學驗真秒開席
      </p>
    </header>

    <!-- 雙模式導航切換標籤 -->
    <nav class="flex bg-stone-900 p-1.5 rounded-2xl border border-stone-800 text-xs font-bold gap-2">
      <button type="button" id="tab-btn-apply" onclick="window.switchJoinTab('apply')" class="flex-1 py-2.5 rounded-xl bg-amber-500 text-stone-950 transition shadow">
        📝 廠商入駐立約 / 補件重提
      </button>
      <button type="button" id="tab-btn-query" onclick="window.switchJoinTab('query')" class="flex-1 py-2.5 rounded-xl text-stone-400 hover:text-white transition">
        🔍 查詢審核結果與開席信物
      </button>
    </nav>

    <!-- ===================================================================== -->
    <!-- 視圖 1：廠商入駐表單（支援首次立約 + 退回補件修正） -->
    <!-- ===================================================================== -->
    <form id="join-vendor-form" onsubmit="window.handleVendorRegister(event)" class="space-y-4 text-xs">
      
      <!-- 補件模式提示橫幅 -->
      <div id="resubmit-banner" class="hidden bg-amber-950/60 border border-amber-500/50 p-3.5 rounded-2xl flex items-center justify-between gap-2 text-amber-200">
        <div>
          <b class="text-amber-400 block">🔄 當前處於【退回補件修正模式】</b>
          <span class="text-[11px]">請根據平台批示意見重新拍攝清晰營業執照原件，修改無誤後再次遞交覆核。</span>
        </div>
        <button type="button" onclick="window.cancelResubmitMode()" class="text-[11px] bg-stone-800 px-2.5 py-1 rounded-lg text-stone-300 hover:text-white shrink-0">
          退出補件
        </button>
      </div>
      <input type="hidden" id="resubmit-app-id" value="">

      <!-- 執照上傳與交互式質檢區 -->
      <div class="bg-[#202023] p-4 rounded-2xl border border-stone-700/80 space-y-3">
        <div class="flex justify-between items-center">
          <label class="text-stone-300 font-bold">1. 營業執照正本 / 副本實拍照 (拍照後自動即時核驗) *：</label>
          <span id="btn-reupload" onclick="document.getElementById('license-file-input').click()" class="hidden text-amber-400 hover:text-amber-300 underline cursor-pointer font-bold">
            🔄 重新拍攝/更換照片
          </span>
        </div>
        
        <div id="upload-dropzone" class="flex flex-col items-center justify-center border-2 border-dashed border-stone-600 hover:border-amber-500/60 rounded-2xl p-4 transition bg-stone-900/60 cursor-pointer relative" onclick="document.getElementById('license-file-input').click()">
          <input type="file" id="license-file-input" accept="image/*" class="hidden" onchange="window.handleImageUpload(event)">
          
          <img id="license-preview-img" src="" class="hidden max-h-52 object-contain rounded-xl mb-2 shadow">
          
          <div id="upload-placeholder" class="text-center space-y-1.5 py-5">
            <span class="text-3xl block">📷</span>
            <span class="text-stone-200 font-bold block text-sm">點擊拍攝或上傳營業執照原件</span>
            <span class="text-[11px] text-stone-400 block">系統將自動識別信用代碼，並以【代碼後六位】作為預設安家密鑰</span>
          </div>
        </div>

        <!-- 掃描動態進度條 -->
        <div id="ocr-progress-box" class="hidden bg-stone-900 p-3 rounded-xl border border-stone-800 space-y-2">
          <div class="flex justify-between items-center text-[11px]">
            <span class="text-amber-400 font-mono flex items-center gap-1.5" id="ocr-status-text">
              <span class="inline-block w-2 h-2 rounded-full bg-amber-400 animate-ping"></span>
              正在進行三維度光學防偽掃描...
            </span>
            <span class="text-stone-400 font-mono" id="ocr-progress-pct">0%</span>
          </div>
          <div class="w-full bg-stone-800 rounded-full h-1.5 overflow-hidden">
            <div id="ocr-progress-bar" class="bg-amber-400 h-full w-0 transition-all duration-300"></div>
          </div>
        </div>

        <!-- 交互式診斷與人工兜底提示框 -->
        <div id="audit-feedback-box" class="hidden p-3.5 rounded-2xl border space-y-2 transition-all">
          <div class="flex items-center justify-between">
            <b id="audit-feedback-title" class="text-xs flex items-center gap-1.5"></b>
            <button type="button" id="audit-retry-btn" onclick="document.getElementById('license-file-input').click()" class="hidden bg-rose-600 hover:bg-rose-500 text-white text-[11px] font-bold px-3 py-1 rounded-lg shadow active:scale-95 transition">
              📷 立即重新拍攝
            </button>
          </div>
          <ul id="audit-feedback-list" class="text-[11px] space-y-1 list-disc list-inside leading-relaxed"></ul>
        </div>
      </div>

      <!-- 基本信息錄入 -->
      <div class="bg-[#202023] p-4 rounded-2xl border border-stone-700/80 space-y-3">
        <label class="block text-stone-300 font-bold">2. 商號主體登記信息：</label>
        
        <div>
          <label class="block text-stone-400 mb-1">主體執照全稱 (與執照一致) *：</label>
          <input type="text" id="v-company-name" required placeholder="上傳清晰執照自動提取或手動核對填寫" class="w-full bg-stone-900 border border-stone-700 rounded-xl p-2.5 text-stone-200 font-bold outline-none focus:border-amber-500">
        </div>

        <div>
          <label class="block text-stone-400 mb-1">統一社會信用代碼 (18位國標校驗 · 後6位即為預設密鑰) *：</label>
          <input type="text" id="v-credit-code" required maxlength="18" oninput="window.syncAccessKeyFromCreditCode(this.value)" placeholder="系統自動提取或手動核對填寫 18 位代碼" class="w-full bg-stone-900 border border-stone-700 rounded-xl p-2.5 font-mono uppercase text-amber-400 font-bold outline-none focus:border-amber-500">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-stone-400 mb-1">商號代號 (即下游認領碼) *：</label>
            <input type="text" id="v-tenant-id" required placeholder="如：NY-FUNIU" class="w-full bg-stone-900 border border-stone-700 rounded-xl p-2.5 font-mono uppercase font-bold text-amber-400 outline-none focus:border-amber-500">
          </div>
          <div>
            <label class="block text-stone-400 mb-1">行當類型 *：</label>
            <select id="v-business-type" class="w-full bg-stone-900 border border-stone-700 rounded-xl p-2.5 text-stone-200 font-bold outline-none focus:border-amber-500">
              <option value="factory">🏭 品牌工坊 (源頭生產)</option>
              <option value="dealer">🏢 區域總經銷 (渠道大代)</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-stone-400 mb-1">大當家負責人稱呼 *：</label>
            <input type="text" id="v-contact-person" required placeholder="如：王掌櫃" class="w-full bg-stone-900 border border-stone-700 rounded-xl p-2.5 text-stone-200 outline-none focus:border-amber-500">
          </div>
          <div>
            <label class="block text-stone-400 mb-1">聯絡電話 (查詢進度憑證) *：</label>
            <input type="tel" id="v-contact-phone" required placeholder="11位手機號碼" class="w-full bg-stone-900 border border-stone-700 rounded-xl p-2.5 font-mono text-stone-200 outline-none focus:border-amber-500">
          </div>
        </div>

        <div>
          <label class="block text-stone-400 mb-1">預設安家密鑰 (自動同步執照代碼後 6 位，登入後可自改) *：</label>
          <input type="text" id="v-access-key" required placeholder="識別信用代碼後自動填入後六位" class="w-full bg-stone-900 border border-stone-700 rounded-xl p-2.5 font-mono uppercase font-bold text-emerald-400 outline-none focus:border-amber-500">
        </div>
      </div>

      <!-- 提交按鈕 -->
      <button type="submit" id="btn-submit-join" disabled class="w-full py-3.5 bg-stone-700 text-stone-400 cursor-not-allowed font-bold rounded-2xl transition shadow-lg text-sm flex items-center justify-center gap-2">
        <span>🔒</span> 請先上傳營業執照進行光學驗真
      </button>
    </form>

    <!-- ===================================================================== -->
    <!-- 視圖 2：審核進度查詢（憑手機號 + 營業執照後 6 位雙重核身查詢） -->
    <!-- ===================================================================== -->
    <section id="query-status-section" class="hidden space-y-4 text-xs">
      <div class="bg-[#202023] p-5 rounded-2xl border border-stone-700/80 space-y-3">
        <label class="block text-stone-300 font-bold text-sm">🔍 查詢入駐審核批示與開席信物</label>
        <p class="text-[11px] text-stone-400">請輸入登記時的「聯絡手機號碼」及「營業執照信用代碼後 6 位」進行核身查詢：</p>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-2.5">
          <input type="tel" id="q-search-phone" placeholder="1. 輸入 11 位聯絡手機號碼" class="bg-stone-900 border border-stone-700 rounded-xl px-3.5 py-2.5 font-mono text-white outline-none focus:border-amber-500">
          <input type="text" id="q-search-last6" maxlength="6" placeholder="2. 輸入營業執照代碼後 6 位" class="bg-stone-900 border border-stone-700 rounded-xl px-3.5 py-2.5 font-mono uppercase text-amber-400 font-bold outline-none focus:border-amber-500">
        </div>

        <button type="button" onclick="window.queryApplicationStatus()" class="w-full bg-amber-500 hover:bg-amber-400 text-stone-950 font-bold py-2.5 rounded-xl active:scale-95 transition shadow">
          核驗查詢進度
        </button>
      </div>

      <!-- 查詢結果渲染容器 -->
      <div id="query-result-container" class="space-y-3"></div>
    </section>

    <div class="text-center pt-2 border-t border-stone-800">
      <a href="platform.html" class="text-stone-500 hover:text-stone-300 text-[11px] underline">返回平台運營總控中樞</a>
    </div>

  </div>

  <script type="module">
    import { supabase } from './src/lib/supabase.js';

    let currentCompressedBase64 = null;
    let isLicenseVerified = false;
    let isManualFallbackMode = false;
    let failedAttemptsCount = 0;
    let verifiedAuditSummary = '';
    let lastQueriedApps = [];

    // 實時連動：當統一社會信用代碼變化時，自動提取後 6 位作為預設安家密鑰
    window.syncAccessKeyFromCreditCode = function(codeVal) {
      const clean = (codeVal || '').trim().toUpperCase();
      if (clean.length >= 6) {
        document.getElementById('v-access-key').value = clean.slice(-6);
      }
    };

    window.switchJoinTab = function(tab) {
      const formEl = document.getElementById('join-vendor-form');
      const queryEl = document.getElementById('query-status-section');
      const btnApply = document.getElementById('tab-btn-apply');
      const btnQuery = document.getElementById('tab-btn-query');

      if (tab === 'apply') {
        formEl.classList.remove('hidden');
        queryEl.classList.add('hidden');
        btnApply.className = "flex-1 py-2.5 rounded-xl bg-amber-500 text-stone-950 transition shadow";
        btnQuery.className = "flex-1 py-2.5 rounded-xl text-stone-400 hover:text-white transition";
      } else {
        formEl.classList.add('hidden');
        queryEl.classList.remove('hidden');
        btnQuery.className = "flex-1 py-2.5 rounded-xl bg-amber-500 text-stone-950 transition shadow";
        btnApply.className = "flex-1 py-2.5 rounded-xl text-stone-400 hover:text-white transition";
      }
    };

    // 1. 國標 GB 32100-2015 統一社會信用代碼嚴格數學驗真
    function verifyCreditCodeGB32100(code) {
      if (!code || code.length !== 18) return false;
      const regex = /^[0-9A-HJ-NPQRTUWXY]{2}[0-9]{6}[0-9A-HJ-NPQRTUWXY]{10}$/;
      if (!regex.test(code)) return false;

      const charMap = "0123456789ABCDEFGHJKLMNPQRTUWXY";
      const weights = [1, 3, 9, 27, 19, 26, 16, 17, 20, 29, 25, 13, 8, 24, 10, 30, 28];
      let sum = 0;

      for (let i = 0; i < 17; i++) {
        const val = charMap.indexOf(code[i]);
        if (val === -1) return false;
        sum += val * weights[i];
      }

      const remainder = sum % 31;
      const checkIndex = remainder === 0 ? 0 : 31 - remainder;
      return code[17] === charMap[checkIndex];
    }

    // 2. 掃描執照右上角官方二維碼
    function scanOfficialLicenseQR(imgElement) {
      try {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        const scale = Math.min(1, 1400 / Math.max(imgElement.naturalWidth, imgElement.naturalHeight));
        canvas.width = imgElement.naturalWidth * scale;
        canvas.height = imgElement.naturalHeight * scale;
        ctx.drawImage(imgElement, 0, 0, canvas.width, canvas.height);
        
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const qrResult = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: "attemptBoth" });

        if (qrResult && qrResult.data) {
          const url = qrResult.data;
          const codeInUrl = url.match(/[0-9A-HJ-NPQRTUWXY]{18}/);
          const isGov = url.includes('gsxt.gov.cn') || url.includes('uniscid') || !!codeInUrl;
          return {
            found: true,
            isOfficial: isGov,
            extractedCode: codeInUrl ? codeInUrl[0] : '',
            rawUrl: url
          };
        }
      } catch (e) {}
      return { found: false, isOfficial: false, extractedCode: '', rawUrl: '' };
    }

    // 3. 壓縮圖片供資料庫留檔
    function compressImageForStorage(imgElement) {
      const canvas = document.createElement('canvas');
      const maxDim = 1000;
      const scale = Math.min(1, maxDim / Math.max(imgElement.naturalWidth, imgElement.naturalHeight));
      canvas.width = imgElement.naturalWidth * scale;
      canvas.height = imgElement.naturalHeight * scale;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(imgElement, 0, 0, canvas.width, canvas.height);
      return canvas.toDataURL('image/jpeg', 0.78);
    }

    window.handleImageUpload = function(e) {
      const file = e.target.files[0];
      if (!file) return;

      isLicenseVerified = false;
      updateSubmitButtonState(false, false);

      const reader = new FileReader();
      reader.onload = function(evt) {
        const rawBase64 = evt.target.result;
        const img = document.getElementById('license-preview-img');
        
        img.onload = async function() {
          currentCompressedBase64 = compressImageForStorage(img);
          await runInteractiveLicenseCheck(img, rawBase64);
        };

        img.src = rawBase64;
        img.classList.remove('hidden');
        document.getElementById('upload-placeholder').classList.add('hidden');
        document.getElementById('btn-reupload').classList.remove('hidden');
      };
      reader.readAsDataURL(file);
    };

    async function runInteractiveLicenseCheck(imgElement, base64Data) {
      const progressBox = document.getElementById('ocr-progress-box');
      const statusText = document.getElementById('ocr-status-text');
      const pctText = document.getElementById('ocr-progress-pct');
      const progressBar = document.getElementById('ocr-progress-bar');
      const feedbackBox = document.getElementById('audit-feedback-box');

      feedbackBox.classList.add('hidden');
      progressBox.classList.remove('hidden');
      statusText.innerText = '正在檢測執照右上角官方二維碼...';
      pctText.innerText = '15%';
      progressBar.style.width = '15%';

      const qrScan = scanOfficialLicenseQR(imgElement);

      // 第二關：啟動本地光學文字識別 (OCR)，並加上 12 秒超時熔斷保護
      let recognizedText = '';
      let isOcrTimeout = false;

      try {
        const ocrPromise = (async () => {
          const worker = await Tesseract.createWorker('chi_sim', 1, {
            logger: m => {
              if (m.status === 'recognizing text') {
                const p = Math.min(95, 20 + Math.floor(m.progress * 75));
                statusText.innerText = `正在逐行校對執照文字與代碼 (${p}%)...`;
                pctText.innerText = `${p}%`;
                progressBar.style.width = `${p}%`;
              }
            }
          });
          const ret = await worker.recognize(base64Data);
          await worker.terminate();
          return ret.data.text.replace(/\s+/g, '');
        })();

        const timeoutPromise = new Promise((_, reject) =>
          setTimeout(() => reject(new Error('OCR_TIMEOUT')), 12000)
        );

        recognizedText = await Promise.race([ocrPromise, timeoutPromise]);
      } catch (err) {
        isOcrTimeout = true;
      }

      progressBox.classList.add('hidden');

      if (isOcrTimeout) {
        failedAttemptsCount = 2;
        renderInteractiveFeedback(false, [], ['⚠️ 當前網路較慢或設備光學識別超時，已自動為您轉入人工快速核驗通道。'], '');
        return;
      }

      const issues = [];
      const successes = [];

      const keywords = ['营业执照', '统一社会信用代码', '法定代表人', '登记机关', '住所', '有限责任公司', '经营范围'];
      const hitKeywords = keywords.filter(kw => recognizedText.includes(kw));
      
      if (hitKeywords.length >= 2) {
        successes.push(`✅ <b>版面特徵合法</b>：識別到「${hitKeywords.slice(0, 3).join('、')}」等法定字段。`);
      } else {
        issues.push('❌ <b>未識別到營業執照版面文字</b>：請確保上傳的是營業執照原件，光線充足無嚴重模糊。');
      }

      let finalCreditCode = qrScan.extractedCode;
      if (!finalCreditCode) {
        const match18 = recognizedText.match(/[0-9A-HJ-NPQRTUWXY]{18}/);
        if (match18) finalCreditCode = match18[0];
      }

      const isCodeChecksumPass = verifyCreditCodeGB32100(finalCreditCode);

      if (qrScan.isOfficial) {
        successes.push(`✅ <b>官方二維碼驗真通過</b>：成功解碼國家公示系統防偽碼。`);
      } else {
        issues.push('⚠️ <b>右上角官方二維碼未掃出</b>：可能存在反光或摺痕，建議對準右上角重拍。');
      }

      if (finalCreditCode && isCodeChecksumPass) {
        successes.push(`✅ <b>國標 18 位代碼校驗合格</b>：<code>${finalCreditCode}</code>（已同步後 6 位為預設安家密鑰）。`);
      } else if (finalCreditCode) {
        issues.push(`❌ <b>信用代碼讀取有誤（${finalCreditCode}）</b>：校驗位不符，請拉近對焦重拍。`);
      } else {
        issues.push('❌ <b>未提取到 18 位統一社會信用代碼</b>：請確保代碼區域完整入鏡。');
      }

      const nameMatch = recognizedText.match(/名称[:：]?([\u4e00-\u9fa5()（）]{4,30}(?:公司|厂|店|社|中心))/);
      if (nameMatch && nameMatch[1] && !document.getElementById('v-company-name').value) {
        document.getElementById('v-company-name').value = nameMatch[1];
      }

      const canPass = (hitKeywords.length >= 2) && (qrScan.isOfficial || isCodeChecksumPass);
      renderInteractiveFeedback(canPass, successes, issues, finalCreditCode);
    }

    function renderInteractiveFeedback(passed, successes, issues, creditCode) {
      const box = document.getElementById('audit-feedback-box');
      const title = document.getElementById('audit-feedback-title');
      const list = document.getElementById('audit-feedback-list');
      const retryBtn = document.getElementById('audit-retry-btn');

      box.classList.remove('hidden');

      if (passed) {
        isLicenseVerified = true;
        isManualFallbackMode = false;
        box.className = 'p-4 rounded-2xl border border-emerald-500/40 bg-emerald-950/30 text-emerald-200 space-y-2';
        title.innerHTML = '🎉 營業執照三維度光學驗真通過！已解鎖簽約開席';
        retryBtn.classList.add('hidden');
        
        list.innerHTML = successes.map(s => `<li>${s}</li>`).join('');
        
        if (creditCode) {
          document.getElementById('v-credit-code').value = creditCode;
          window.syncAccessKeyFromCreditCode(creditCode);
        }
        if (!document.getElementById('v-tenant-id').value) {
          document.getElementById('v-tenant-id').value = 'T-' + Math.random().toString(36).substring(2, 7).toUpperCase();
        }

        verifiedAuditSummary = successes.join(' | ').replace(/<[^>]+>/g, '');
        updateSubmitButtonState(true, false);

      } else {
        failedAttemptsCount++;
        isLicenseVerified = false;

        if (failedAttemptsCount >= 2) {
          isManualFallbackMode = true;
          box.className = 'p-4 rounded-2xl border border-amber-500/50 bg-amber-950/30 text-amber-200 space-y-2';
          title.innerHTML = '🛡️ 已為您開啟【人工綠色覆核通道】';
          retryBtn.classList.remove('hidden');
          retryBtn.innerText = '📷 再試一次清晰拍攝';

          list.innerHTML = [
            '<li>系統檢測到當前照片可能存在<b>鏡面反光、舊版執照或設備兼容限制</b>。</li>',
            '<li>請在下方核對填寫您的<b>18位統一社會信用代碼</b>（系統將自動取後6位為預設密鑰），提交後直接轉交平台大當家人工覆核。</li>'
          ].join('');

          if (!document.getElementById('v-tenant-id').value) {
            document.getElementById('v-tenant-id').value = 'T-' + Math.random().toString(36).substring(2, 7).toUpperCase();
          }

          verifiedAuditSummary = '【觸發人工兜底通道】前端光學多次未達標，已附原件轉入後台人工覆核。';
          updateSubmitButtonState(true, true);
        } else {
          isManualFallbackMode = false;
          box.className = 'p-4 rounded-2xl border border-rose-500/50 bg-rose-950/30 text-rose-200 space-y-2';
          title.innerHTML = '⚠️ 照片清晰度或防偽特徵未達標，請按提示重拍（第 1 次提醒）：';
          retryBtn.classList.remove('hidden');

          const allItems = [...issues, ...successes];
          list.innerHTML = allItems.map(item => `<li>${item}</li>`).join('');
          updateSubmitButtonState(false, false);
        }
      }
    }

    function updateSubmitButtonState(enabled, isManual = false) {
      const btn = document.getElementById('btn-submit-join');
      const isResubmit = !!document.getElementById('resubmit-app-id').value;

      if (enabled && !isManual) {
        btn.disabled = false;
        btn.className = 'w-full py-3.5 bg-amber-500 hover:bg-amber-400 text-stone-950 font-bold rounded-2xl active:scale-95 transition shadow-lg text-sm flex items-center justify-center gap-2 cursor-pointer';
        btn.innerHTML = isResubmit ? '<span>🔄</span> 資質已驗真 · 立即重新遞交覆核' : '<span>📜</span> 資質已驗真 · 立即簽約開席（免費體驗7天）';
      } else if (enabled && isManual) {
        btn.disabled = false;
        btn.className = 'w-full py-3.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-2xl active:scale-95 transition shadow-lg text-sm flex items-center justify-center gap-2 cursor-pointer';
        btn.innerHTML = isResubmit ? '<span>📨</span> 重新提交補件資料 · 轉人工覆核' : '<span>📨</span> 提交資料 · 轉入平台人工綠色審核';
      } else {
        btn.disabled = true;
        btn.className = 'w-full py-3.5 bg-stone-700 text-stone-400 cursor-not-allowed font-bold rounded-2xl transition shadow-lg text-sm flex items-center justify-center gap-2';
        btn.innerHTML = '<span>🔒</span> 請先完成營業執照光學驗真以解鎖提交';
      }
    }

    // 提交開席或補件更新
    window.handleVendorRegister = async function(e) {
      e.preventDefault();
      if (!isLicenseVerified && !isManualFallbackMode) {
        return alert('請先上傳營業執照並完成系統驗真！');
      }

      const resubmitId = document.getElementById('resubmit-app-id').value;
      const companyName = document.getElementById('v-company-name').value.trim();
      const creditCode = document.getElementById('v-credit-code').value.trim().toUpperCase();
      const tenantId = document.getElementById('v-tenant-id').value.trim().toUpperCase();
      const businessType = document.getElementById('v-business-type').value;
      const contactPerson = document.getElementById('v-contact-person').value.trim();
      const contactPhone = document.getElementById('v-contact-phone').value.trim();

      if (creditCode.length < 6) {
        return alert('請完整填寫統一社會信用代碼（至少需包含後 6 位用於核身與預設密鑰）！');
      }

      // 規則落地：預設安家密鑰 = 執照後 6 位；下游認領碼 = 商號代號 (tenantId)
      const defaultLast6Key = creditCode.slice(-6);
      const accessKey = document.getElementById('v-access-key').value.trim().toUpperCase() || defaultLast6Key;
      const inviteCode = tenantId;

      const btn = document.getElementById('btn-submit-join');
      btn.disabled = true;
      btn.innerHTML = '正在核對唯一性並簽發商契...';

      try {
        // 防重複與商號撞名檢查
        if (!resubmitId) {
          const { data: existingApps } = await supabase
            .from('tenant_application')
            .select('id, tenant_id, contact_phone')
            .or(`contact_phone.eq.${contactPhone},tenant_id.eq.${tenantId}`);

          if (existingApps && existingApps.length > 0) {
            const isSamePhone = existingApps.some(x => x.contact_phone === contactPhone);
            if (isSamePhone) {
              alert('ℹ️ 檢測到該手機號已有入駐申請記錄！\n已為您自動跳轉至進度查詢頁查看最新批示。');
              document.getElementById('q-search-phone').value = contactPhone;
              document.getElementById('q-search-last6').value = defaultLast6Key;
              window.switchJoinTab('query');
              window.queryApplicationStatus();
              btn.disabled = false;
              updateSubmitButtonState(true, isManualFallbackMode);
              return;
            } else {
              alert(`⚠️ 商號代號【${tenantId}】已被其他廠家佔用，請在後方加上數字（如 ${tenantId}01）後重新提交！`);
              btn.disabled = false;
              updateSubmitButtonState(true, isManualFallbackMode);
              return;
            }
          }
        }

        const appStatus = isManualFallbackMode ? 'pending_review' : 'approved_by_ai';
        const auditScore = isManualFallbackMode ? 65 : 98;

        if (resubmitId) {
          const { error: updErr } = await supabase.from('tenant_application').update({
            company_name: companyName,
            credit_code: creditCode,
            contact_person: contactPerson,
            contact_phone: contactPhone,
            business_type: businessType,
            application_status: appStatus,
            ai_audit_score: auditScore,
            review_note: `【補件重提】${verifiedAuditSummary}`,
            invite_code: inviteCode,
            license_image_url: currentCompressedBase64
          }).eq('id', parseInt(resubmitId));

          if (updErr) throw new Error('補件更新失敗: ' + updErr.message);
        } else {
          const { error: appErr } = await supabase.from('tenant_application').insert([{
            tenant_id: tenantId,
            company_name: companyName,
            credit_code: creditCode,
            contact_person: contactPerson,
            contact_phone: contactPhone,
            business_type: businessType,
            service_mode: 'both',
            application_status: appStatus,
            ai_audit_score: auditScore,
            review_note: verifiedAuditSummary,
            invite_code: inviteCode,
            license_image_url: currentCompressedBase64
          }]);

          if (appErr) throw new Error('申請登記失敗: ' + appErr.message);
        }

        if (!isManualFallbackMode) {
          const trialEndDate = new Date();
          trialEndDate.setDate(trialEndDate.getDate() + 7);

          const { error: tenantErr } = await supabase.from('platform_tenant').upsert([{
            tenant_id: tenantId,
            company_name: companyName,
            credit_code: creditCode,
            business_type: businessType,
            service_mode: 'both',
            contact_person: contactPerson,
            contact_name: contactPerson,
            phone: contactPhone,
            access_key: accessKey,
            invite_code: inviteCode,
            membership_status: 'trial',
            is_active: true,
            permit_brick_and_mortar: true,
            permit_ecommerce: true,
            valid_until: trialEndDate.toISOString().slice(0, 10)
          }]);

          if (tenantErr) throw new Error('開席激活失敗: ' + tenantErr.message);

          alert(
            `🎉 資質驗真通過！已為您開通「🍃 嘗鮮體驗」7天全功能席位！\n\n` +
            `• 主體名稱：${companyName}\n` +
            `• 商號代號（即下游認領碼）：${inviteCode}\n` +
            `• 預設安家密鑰（執照後6位）：${accessKey}\n\n` +
            `後續憑「手機號 + 執照後6位」可隨時查詢進度！`
          );
        } else {
          alert(
            `📨 您的入駐資料與執照原件已成功遞交！\n\n` +
            `• 登記手機：${contactPhone}\n` +
            `• 執照代碼後 6 位（查詢與預設密碼）：${defaultLast6Key}\n` +
            `• 商號代號（下游認領碼）：${inviteCode}\n\n` +
            `平台大當家核對原件後將第一時間批示，您隨時可憑「手機號 + 執照後6位」查詢結果！`
          );
        }

        window.cancelResubmitMode();
        document.getElementById('q-search-phone').value = contactPhone;
        document.getElementById('q-search-last6').value = defaultLast6Key;
        window.switchJoinTab('query');
        window.queryApplicationStatus();

      } catch (err) {
        alert('❌ 提交處理失敗: ' + err.message);
        btn.disabled = false;
        updateSubmitButtonState(true, isManualFallbackMode);
      }
    };

    // =========================================================================
    // 視圖 2：憑「手機號 + 營業執照後 6 位」雙重核身查詢審核進度
    // =========================================================================
    window.queryApplicationStatus = async function() {
      const phone = document.getElementById('q-search-phone').value.trim();
      const last6 = document.getElementById('q-search-last6').value.trim().toUpperCase();
      const container = document.getElementById('query-result-container');

      if (!phone || last6.length !== 6) {
        return alert('請完整輸入登記時的「手機號碼」與「營業執照統一信用代碼後 6 位」！');
      }

      container.innerHTML = '<div class="text-center py-6 text-stone-400">正在核驗手機號與執照後六位...</div>';

      const { data, error } = await supabase
        .from('tenant_application')
        .select('*')
        .eq('contact_phone', phone)
        .order('id', { ascending: false });

      const matchedApps = (data || []).filter(app => {
        const code = (app.credit_code || '').trim().toUpperCase();
        return code.endsWith(last6);
      });

      if (error || matchedApps.length === 0) {
        container.innerHTML = `
          <div class="bg-[#202023] border border-stone-700/80 rounded-2xl p-6 text-center space-y-2">
            <span class="text-2xl block">🔐</span>
            <b class="text-stone-200 block">未查詢到匹配檔案（手機號或執照後 6 位不符）</b>
            <p class="text-[11px] text-stone-400">請核對手機號碼及營業執照統一社會信用代碼最後 6 位字元（注意區分數字 0 與字母 O）。</p>
          </div>
        `;
        return;
      }

      lastQueriedApps = matchedApps;
      container.innerHTML = matchedApps.map(app => {
        const status = app.application_status;
        const isApproved = status === 'approved' || status === 'approved_by_ai' || status === 'approved_manually';
        const isRejected = status === 'rejected';
        const codeLast6 = (app.credit_code || '').slice(-6);
        const claimCode = app.invite_code || app.tenant_id;

        if (isApproved) {
          return `
            <div class="bg-emerald-950/30 border border-emerald-500/40 rounded-2xl p-5 space-y-3">
              <div class="flex justify-between items-center border-b border-emerald-500/20 pb-2">
                <div>
                  <b class="text-sm text-white">${app.company_name}</b>
                  <span class="text-[10px] font-mono text-emerald-400 ml-2">${app.credit_code || ''}</span>
                </div>
                <span class="bg-emerald-500/20 text-emerald-300 border border-emerald-400/30 px-2.5 py-0.5 rounded-full font-bold text-[11px]">
                  ✅ 審核通過 · 已開席
                </span>
              </div>

              <div class="grid grid-cols-2 gap-2 bg-stone-900/80 p-3 rounded-xl border border-stone-800 font-mono">
                <div>
                  <span class="text-[10px] text-stone-400 block">商號標識 / 下游認領碼 (二合一)</span>
                  <b class="text-amber-400 text-base font-bold">${claimCode}</b>
                </div>
                <div>
                  <span class="text-[10px] text-stone-400 block">預設安家密鑰 (執照後 6 位)</span>
                  <b class="text-emerald-400 text-base font-bold">${codeLast6}</b>
                </div>
              </div>

              <p class="text-[11px] text-emerald-200/80">
                🎉 核驗成功！您可憑商號標識【<b>${app.tenant_id}</b>】與安家密鑰【<b>${codeLast6}</b>】登入廠家調度台；下游門店直接輸入認領碼【<b>${claimCode}</b>】即可綁定供貨關係。
              </p>
            </div>
          `;
        } else if (isRejected) {
          return `
            <div class="bg-rose-950/30 border border-rose-500/50 rounded-2xl p-5 space-y-3">
              <div class="flex justify-between items-center border-b border-rose-500/20 pb-2">
                <div>
                  <b class="text-sm text-white">${app.company_name}</b>
                  <span class="text-[10px] font-mono text-rose-300 ml-2">商號：${app.tenant_id}</span>
                </div>
                <span class="bg-rose-500/20 text-rose-300 border border-rose-400/30 px-2.5 py-0.5 rounded-full font-bold text-[11px]">
                  🚫 退回商榷 · 需補件修正
                </span>
              </div>
              <div class="bg-stone-900/90 p-3.5 rounded-xl border border-rose-500/30 space-y-1">
                <b class="text-rose-400 text-[11px] block">📋 平台審核批示意見（不通過原因）：</b>
                <p class="text-stone-200 text-xs leading-relaxed">${app.review_note || '營業執照圖片不夠清晰或信息不符，請重新上傳清晰原件照片。'}</p>
              </div>
              <div class="pt-1 flex justify-end">
                <button type="button" onclick="window.startResubmitCorrection(${app.id})" class="bg-amber-500 hover:bg-amber-400 text-stone-950 font-bold px-4 py-2 rounded-xl shadow active:scale-95 transition flex items-center gap-1.5">
                  <span>🔄</span> 立即改善並重新上傳執照
                </button>
              </div>
            </div>
          `;
        } else {
          return `
            <div class="bg-amber-950/20 border border-amber-500/40 rounded-2xl p-5 space-y-2.5">
              <div class="flex justify-between items-center border-b border-amber-500/20 pb-2">
                <div>
                  <b class="text-sm text-white">${app.company_name}</b>
                  <span class="text-[10px] font-mono text-amber-300 ml-2">商號：${app.tenant_id}</span>
                </div>
                <span class="bg-amber-500/20 text-amber-300 border border-amber-400/30 px-2.5 py-0.5 rounded-full font-bold text-[11px] animate-pulse">
                  ⏳ 人工綠色通道加急審核中
                </span>
              </div>
              <p class="text-[11px] text-stone-300 leading-relaxed">
                您的營業執照與申請資料已進入平台人工覆核隊列。大當家核對無誤後，您的商號【<b>${app.tenant_id}</b>】即為下游認領碼，執照後 6 位【<b>${codeLast6}</b>】即為預設安家密鑰。
              </p>
              <div class="text-[10px] text-stone-500 font-mono">
                提交時間：${new Date(app.created_at).toLocaleString()}
              </div>
            </div>
          `;
        }
      }).join('');
    };

    window.startResubmitCorrection = function(appId) {
      const app = lastQueriedApps.find(a => a.id === appId);
      if (!app) return;

      document.getElementById('resubmit-app-id').value = app.id;
      document.getElementById('resubmit-banner').classList.remove('hidden');

      document.getElementById('v-company-name').value = app.company_name || '';
      document.getElementById('v-credit-code').value = app.credit_code || '';
      window.syncAccessKeyFromCreditCode(app.credit_code || '');
      document.getElementById('v-tenant-id').value = app.tenant_id || '';
      document.getElementById('v-business-type').value = app.business_type || 'factory';
      document.getElementById('v-contact-person').value = app.contact_person || '';
      document.getElementById('v-contact-phone').value = app.contact_phone || '';

      currentCompressedBase64 = null;
      isLicenseVerified = false;
      isManualFallbackMode = false;
      failedAttemptsCount = 0;

      document.getElementById('license-preview-img').classList.add('hidden');
      document.getElementById('upload-placeholder').classList.remove('hidden');
      document.getElementById('audit-feedback-box').classList.add('hidden');
      updateSubmitButtonState(false, false);

      window.switchJoinTab('apply');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.cancelResubmitMode = function() {
      document.getElementById('resubmit-app-id').value = '';
      document.getElementById('resubmit-banner').classList.add('hidden');
      failedAttemptsCount = 0;
    };
  </script>
</body>
</html>
