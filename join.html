<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>百工商道 · 合作社与源头工坊实名入驻中心</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1b4332">
  <meta name="description" content="村社合作社、源头工坊与批发商行入驻通道，营业执照光学核验，零佣金直连合作门店与百工天街。">
  <meta property="og:type" content="website">
  <meta property="og:title" content="入驻百工百业数字协作平台 · 源头直供开席">
  <meta property="og:description" content="一照一码专属独立账本，支持合作门店直配与百工天街双轨供货，TOTP 双重安全守护。">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-[#18181b] text-stone-200 font-sans min-h-screen p-4 md:p-8 flex flex-col items-center justify-center">

  <div class="w-full max-w-2xl bg-[#27272a] border border-stone-700/80 rounded-3xl p-6 md:p-8 shadow-2xl space-y-6">
    
    <!-- 顶部抬头 -->
    <header class="text-center space-y-2 border-b border-stone-700 pb-5">
      <div class="w-14 h-14 bg-amber-500/10 border border-amber-500/30 text-amber-400 rounded-2xl flex items-center justify-center text-3xl mx-auto shadow-inner">
        🏛️
      </div>
      <h1 class="text-xl font-bold text-white tracking-wide">百工商道 · 合作社与工坊实名入驻中心</h1>
      <p class="text-xs text-stone-400">
        商号代号唯一标识 · 执照后六位即预设安家密钥 · 光学验真秒开席
      </p>
    </header>

    <!-- 双模式导航切换标签 -->
    <nav class="flex bg-stone-900 p-1.5 rounded-2xl border border-stone-800 text-xs font-bold gap-2">
      <button type="button" id="tab-btn-apply" onclick="window.switchJoinTab('apply')" class="flex-1 py-2.5 rounded-xl bg-amber-500 text-stone-950 transition shadow">
        📝 合作社 / 工坊入驻立约
      </button>
      <button type="button" id="tab-btn-query" onclick="window.switchJoinTab('query')" class="flex-1 py-2.5 rounded-xl text-stone-400 hover:text-white transition">
        🔍 查询审核结果与商号信物
      </button>
    </nav>

    <!-- 视图 1：主体入驻表单（支援首次立约 + 退回补件修正） -->
    <form id="join-vendor-form" onsubmit="window.handleVendorRegister(event)" class="space-y-4 text-xs">
      
      <div id="resubmit-banner" class="hidden bg-amber-950/60 border border-amber-500/50 p-3.5 rounded-2xl flex items-center justify-between gap-2 text-amber-200">
        <div>
          <b class="text-amber-400 block">🔄 当前处于【退回补件修正模式】</b>
          <span class="text-[11px]">请根据平台批示意见重新拍摄清晰营业执照原件，修改无误后再次递交复核。</span>
        </div>
        <button type="button" onclick="window.cancelResubmitMode()" class="text-[11px] bg-stone-800 px-2.5 py-1 rounded-lg text-stone-300 hover:text-white shrink-0">
          退出补件
        </button>
      </div>
      <input type="hidden" id="resubmit-app-id" value="">

      <!-- 执照上传与交互式质检区 -->
      <div class="bg-[#202023] p-4 rounded-2xl border border-stone-700/80 space-y-3">
        <div class="flex justify-between items-center">
          <label class="text-stone-300 font-bold">1. 营业执照正本 / 副本实拍照 (拍照后自动即时核验) *：</label>
          <span id="btn-reupload" onclick="document.getElementById('license-file-input').click()" class="hidden text-amber-400 hover:text-amber-300 underline cursor-pointer font-bold">
            🔄 重新拍摄/更换照片
          </span>
        </div>
        
        <div id="upload-dropzone" class="flex flex-col items-center justify-center border-2 border-dashed border-stone-600 hover:border-amber-500/60 rounded-2xl p-4 transition bg-stone-900/60 cursor-pointer relative" onclick="document.getElementById('license-file-input').click()">
          <input type="file" id="license-file-input" accept="image/*" class="hidden" onchange="window.handleImageUpload(event)">
          
          <img id="license-preview-img" src="" class="hidden max-h-52 object-contain rounded-xl mb-2 shadow">
          
          <div id="upload-placeholder" class="text-center space-y-1.5 py-5">
            <span class="text-3xl block">📷</span>
            <span class="text-stone-200 font-bold block text-sm">点击拍摄或上传营业执照原件</span>
            <span class="text-[11px] text-stone-400 block">系统将自动识别信用代码，并以【代码后六位】作为预设安家密钥</span>
          </div>
        </div>

        <!-- 扫描动态进度条 -->
        <div id="ocr-progress-box" class="hidden bg-stone-900 p-3 rounded-xl border border-stone-800 space-y-2">
          <div class="flex justify-between items-center text-[11px]">
            <span class="text-amber-400 font-mono flex items-center gap-1.5" id="ocr-status-text">
              <span class="inline-block w-2 h-2 rounded-full bg-amber-400 animate-ping"></span>
              正在进行三维度光学防伪扫描...
            </span>
            <span class="text-stone-400 font-mono" id="ocr-progress-pct">0%</span>
          </div>
          <div class="w-full bg-stone-800 rounded-full h-1.5 overflow-hidden">
            <div id="ocr-progress-bar" class="bg-amber-400 h-full w-0 transition-all duration-300"></div>
          </div>
        </div>

        <!-- 交互式诊断与人工兜底提示框 -->
        <div id="audit-feedback-box" class="hidden p-3.5 rounded-2xl border space-y-2 transition-all">
          <div class="flex items-center justify-between">
            <b id="audit-feedback-title" class="text-xs flex items-center gap-1.5"></b>
            <button type="button" id="audit-retry-btn" onclick="document.getElementById('license-file-input').click()" class="hidden bg-rose-600 hover:bg-rose-500 text-white text-[11px] font-bold px-3 py-1 rounded-lg shadow active:scale-95 transition">
              📷 立即重新拍摄
            </button>
          </div>
          <ul id="audit-feedback-list" class="text-[11px] space-y-1 list-disc list-inside leading-relaxed"></ul>
        </div>
      </div>

      <!-- 基本信息录入 -->
      <div class="bg-[#202023] p-4 rounded-2xl border border-stone-700/80 space-y-3">
        <label class="block text-stone-300 font-bold">2. 商号主体登记信息：</label>
        
        <div>
          <label class="block text-stone-400 mb-1">主体执照全称 (与执照一致) *：</label>
          <input type="text" id="v-company-name" required placeholder="上传清晰执照自动提取或手动核对填写" class="w-full bg-stone-900 border border-stone-700 rounded-xl p-2.5 text-stone-200 font-bold outline-none focus:border-amber-500">
        </div>

        <div>
          <label class="block text-stone-400 mb-1">统一社会信用代码 (18位国标校验 · 后6位即为预设密钥) *：</label>
          <input type="text" id="v-credit-code" required maxlength="18" oninput="window.syncAccessKeyFromCreditCode(this.value)" placeholder="系统自动提取或手动核对填写 18 位代码" class="w-full bg-stone-900 border border-stone-700 rounded-xl p-2.5 font-mono uppercase text-amber-400 font-bold outline-none focus:border-amber-500">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-stone-400 mb-1">商号代号 (全盘唯一商业标识) *：</label>
            <input type="text" id="v-tenant-id" required placeholder="如：NY-FUNIU" class="w-full bg-stone-900 border border-stone-700 rounded-xl p-2.5 font-mono uppercase font-bold text-amber-400 outline-none focus:border-amber-500">
          </div>
          <div>
            <label class="block text-stone-400 mb-1">经营主体身份 *：</label>
            <select id="v-business-type" class="w-full bg-stone-900 border border-stone-700 rounded-xl p-2.5 text-stone-200 font-bold outline-none focus:border-amber-500">
              <option value="coop">🌾 村社合作社 / 产区直供站</option>
              <option value="factory">🏭 源头工坊 / 生产制造厂</option>
              <option value="dealer">🏢 区域平准仓 / 集散商行</option>
              <option value="service">🛠️ 工料配件 / 综合服务商</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-stone-400 mb-1">当家负责人称呼 *：</label>
            <input type="text" id="v-contact-person" required placeholder="如：王理事长 / 王掌柜" class="w-full bg-stone-900 border border-stone-700 rounded-xl p-2.5 text-stone-200 outline-none focus:border-amber-500">
          </div>
          <div>
            <label class="block text-stone-400 mb-1">联络电话 (查询进度凭证) *：</label>
            <input type="tel" id="v-contact-phone" required placeholder="11位手机号码" class="w-full bg-stone-900 border border-stone-700 rounded-xl p-2.5 font-mono text-stone-200 outline-none focus:border-amber-500">
          </div>
        </div>

        <div>
          <label class="block text-stone-400 mb-1">预设安家密钥 (自动同步执照代码后 6 位，登录后可自改) *：</label>
          <input type="text" id="v-access-key" required placeholder="识别信用代码后自动填入后六位" class="w-full bg-stone-900 border border-stone-700 rounded-xl p-2.5 font-mono uppercase font-bold text-emerald-400 outline-none focus:border-amber-500">
        </div>
      </div>

      <!-- 提交按钮 -->
      <button type="submit" id="btn-submit-join" disabled class="w-full py-3.5 bg-stone-700 text-stone-400 cursor-not-allowed font-bold rounded-2xl transition shadow-lg text-sm flex items-center justify-center gap-2">
        <span>🔒</span> 请先上传营业执照进行光学验真
      </button>
    </form>

    <!-- 视图 2：审核进度查询（凭手机号 + 营业执照后 6 位双重核身查询） -->
    <section id="query-status-section" class="hidden space-y-4 text-xs">
      <div class="bg-[#202023] p-5 rounded-2xl border border-stone-700/80 space-y-3">
        <label class="block text-stone-300 font-bold text-sm">🔍 查询入驻审核批示与商号信物</label>
        <p class="text-[11px] text-stone-400">请输入登记时的「联络手机号码」及「营业执照信用代码后 6 位」进行核身查询：</p>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-2.5">
          <input type="tel" id="q-search-phone" placeholder="1. 输入 11 位联络手机号码" class="bg-stone-900 border border-stone-700 rounded-xl px-3.5 py-2.5 font-mono text-white outline-none focus:border-amber-500">
          <input type="text" id="q-search-last6" maxlength="6" placeholder="2. 输入营业执照代码后 6 位" class="bg-stone-900 border border-stone-700 rounded-xl px-3.5 py-2.5 font-mono uppercase text-amber-400 font-bold outline-none focus:border-amber-500">
        </div>

        <button type="button" onclick="window.queryApplicationStatus()" class="w-full bg-amber-500 hover:bg-amber-400 text-stone-950 font-bold py-2.5 rounded-xl active:scale-95 transition shadow">
          核验查询进度
        </button>
      </div>

      <div id="query-result-container" class="space-y-3"></div>
    </section>

    <div class="text-center pt-2 border-t border-stone-800 flex justify-center gap-4 text-[11px]">
      <a href="hq.html" class="text-amber-400 hover:text-amber-300 font-bold underline">前往平准调度中枢登录</a>
      <a href="mall.html" class="text-stone-400 hover:text-stone-200 underline">逛逛百工天街集市</a>
    </div>

  </div>

  <script type="module">
    import { initJoinController } from './src/modules/joinController.js';
    initJoinController();
  </script>
</body>
</html>
