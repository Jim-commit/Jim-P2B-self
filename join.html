<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>诚邀入驻 · 厂家与总代合作建档</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f7f5f0] text-stone-800 font-sans p-4 min-h-screen">
  <div class="max-w-lg mx-auto bg-white rounded-[2rem] shadow-xl p-6 space-y-4 border border-stone-200/80">
    <div class="border-b border-stone-100 pb-3 text-center">
      <span class="text-2xl">🤝</span>
      <h1 class="text-base font-bold text-stone-900 mt-1">源头厂商与总销商家入驻申请</h1>
      <p class="text-[11px] text-stone-400 mt-0.5">信义为先 · 专有独立账本 · 联通万千终端</p>
    </div>

    <form id="join-form" onsubmit="window.submitApplication(event)" class="space-y-3.5 text-xs">
      <div>
        <label class="block font-bold text-stone-700 mb-1">入驻主体类别 *：</label>
        <div class="grid grid-cols-2 gap-2">
          <label class="p-2.5 rounded-xl border border-stone-200 bg-stone-50 flex items-center gap-2 cursor-pointer hover:bg-stone-100">
            <input type="radio" name="business_type" value="dealer" checked class="text-emerald-800">
            <div>
              <b class="block text-stone-900 text-xs">🏢 区域总经销 (总代)</b>
              <span class="text-[9px] text-stone-400">统仓配发 · 随车深耕</span>
            </div>
          </label>
          <label class="p-2.5 rounded-xl border border-stone-200 bg-stone-50 flex items-center gap-2 cursor-pointer hover:bg-stone-100">
            <input type="radio" name="business_type" value="factory" class="text-emerald-800">
            <div>
              <b class="block text-stone-900 text-xs">🏭 品牌生产工厂</b>
              <span class="text-[9px] text-stone-400">源头直供 · 大宗批发</span>
            </div>
          </label>
        </div>
      </div>

      <div>
        <label class="block font-bold text-stone-700 mb-1">主要供货业务模式 *：</label>
        <select id="service-mode" class="w-full bg-stone-50 border border-stone-200 rounded-xl px-3 py-2 outline-none font-bold text-stone-800">
          <option value="offline">🏬 线下实体车销（重整箱包装、周转筐借还、师傅现场点验）</option>
          <option value="online">🌐 线上网销一件代发（重快递打包、云仓直发、长距流通）</option>
          <option value="both">🔄 线上线下双轨并举</option>
        </select>
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-stone-600 mb-1 font-medium">主体执照全称 *：</label>
          <input type="text" id="company-name" required placeholder="如：北京顺达商贸有限公司" class="w-full bg-stone-50 border border-stone-200 rounded-xl px-2.5 py-2 outline-none">
        </div>
        <div>
          <label class="block text-stone-600 mb-1 font-medium">期望商号代号 (拼音/英文) *：</label>
          <input type="text" id="tenant-id" required placeholder="如：BJ_SHUNDA" class="w-full bg-stone-50 border border-stone-200 rounded-xl px-2.5 py-2 font-mono font-bold outline-none uppercase">
        </div>
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-stone-600 mb-1 font-medium">负责人称呼 *：</label>
          <input type="text" id="contact-person" required placeholder="如：王掌柜 / 张经理" class="w-full bg-stone-50 border border-stone-200 rounded-xl px-2.5 py-2 outline-none">
        </div>
        <div>
          <label class="block text-stone-600 mb-1 font-medium">联系手机号 (登录凭证) *：</label>
          <input type="tel" id="contact-phone" required maxlength="11" placeholder="11位手机号码" class="w-full bg-stone-50 border border-stone-200 rounded-xl px-2.5 py-2 font-mono outline-none">
        </div>
      </div>

      <div class="p-3 bg-stone-50 border border-stone-200 rounded-2xl space-y-2">
        <label class="block font-bold text-stone-700 text-[11px]">营业执照 / 经营许可证资质实拍 *：</label>
        <div class="flex items-center gap-3">
          <div id="license-preview" class="w-16 h-16 rounded-xl bg-white border border-stone-200 flex items-center justify-center text-[10px] text-stone-400 overflow-hidden">
            暂无图
          </div>
          <label class="bg-stone-800 text-white font-bold text-xs px-3 py-2 rounded-xl cursor-pointer hover:bg-stone-900 active:scale-95 transition">
            📷 拍照 / 选取图片
            <input type="file" accept="image/*" onchange="window.handleLicenseUpload(event)" class="hidden">
          </label>
        </div>
      </div>

      <p class="text-[10px] text-stone-400 leading-relaxed text-center">
        提交后，平台运营主管将于 1 个工作日内核验资质。审核通过并按类别办理会费后，即可获授专属认领信码与后台登录凭证。
      </p>

      <button type="submit" id="btn-submit-apply" class="w-full bg-[#1b4332] hover:bg-[#143628] text-white font-bold py-3 rounded-2xl text-xs active:scale-95 transition shadow-sm">
        提交审核申请 · 结缘合作
      </button>
    </form>
  </div>

  <script type="module">
    import { supabase } from './src/lib/supabase.js';

    let uploadedLicenseBase64 = '';

    window.handleLicenseUpload = function(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const maxDim = 800;
          let width = img.width, height = img.height;
          if (width > height && width > maxDim) { height *= maxDim / width; width = maxDim; }
          else if (height > maxDim) { width *= maxDim / height; height = maxDim; }
          canvas.width = width; canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          uploadedLicenseBase64 = canvas.toDataURL('image/jpeg', 0.8);
          document.getElementById('license-preview').innerHTML = `<img src="${uploadedLicenseBase64}" class="w-full h-full object-cover">`;
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    };

    window.submitApplication = async function(e) {
      e.preventDefault();
      const company_name = document.getElementById('company-name').value.trim();
      const tenant_id = document.getElementById('tenant-id').value.trim().toUpperCase();
      const contact_person = document.getElementById('contact-person').value.trim();
      const contact_phone = document.getElementById('contact-phone').value.trim();
      const service_mode = document.getElementById('service-mode').value;
      const business_type = document.querySelector('input[name="business_type"]:checked').value;

      if (!uploadedLicenseBase64) return alert('请上传营业执照或经营资信实拍图！');

      const btn = document.getElementById('btn-submit-apply');
      btn.disabled = true;
      btn.innerText = '正在提交审核...';

      const { error } = await supabase.from('tenant_application').insert([{
        tenant_id,
        company_name,
        business_type,
        contact_person,
        contact_phone,
        service_mode,
        license_image_url: uploadedLicenseBase64,
        application_status: 'pending_review',
        payment_status: 'unpaid'
      }]);

      if (error) {
        alert('提交失败: ' + error.message);
        btn.disabled = false;
        btn.innerText = '提交审核申请 · 结缘合作';
      } else {
        alert(`🎉 入驻申请提交成功！\n请等待平台管理员核验资信，审核结果将短信通知负责人。`);
        window.location.reload();
      }
    };
  </script>
</body>
</html>
