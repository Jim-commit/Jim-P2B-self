<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>终端门店·采销互通中枢</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-stone-100 text-stone-800 font-sans pb-32 min-h-screen">
  
  <div class="max-w-md mx-auto min-h-screen flex flex-col bg-white shadow-xl relative">
    
    <!-- 顶栏：门店信息与账单面板 -->
    <header class="bg-[#064e3b] text-white p-4 pt-5 rounded-b-3xl shadow-md">
      <div class="flex justify-between items-start">
        <div>
          <div class="flex items-center gap-2">
            <h1 id="store-title" class="text-base font-bold">合作门店</h1>
            <button onclick="window.switchShopTypePrompt()" id="shop-type-badge" class="bg-amber-400 text-stone-900 text-[10px] px-2 py-0.5 rounded-full font-bold">
              社区超市 ▾
            </button>
          </div>
          <div class="text-[11px] text-emerald-200 mt-1 flex items-center gap-2">
            <span>负责人: <b id="store-boss" class="text-white">负责人</b></span>
            <span>总代: <b id="tenant-badge" class="font-mono text-emerald-100">BJ_SHUNDA</b></span>
          </div>
        </div>
        <div class="flex items-center gap-1.5">
          <button onclick="window.openReceiptsModal()" class="text-[11px] bg-amber-400 text-stone-900 font-bold px-2.5 py-1 rounded-xl shadow active:scale-95">
            📜 单据/收条
          </button>
          <button onclick="window.openModal('bind-agent-modal')" class="text-[11px] bg-white/10 hover:bg-white/20 text-emerald-100 border border-emerald-400/30 px-2.5 py-1 rounded-xl active:scale-95">
            换总代
          </button>
        </div>
      </div>

      <!-- 赊销额度与挂账看板 -->
      <div class="mt-3 bg-emerald-950/60 p-3 rounded-2xl border border-emerald-700/40 flex justify-between items-center text-xs">
        <div>
          <span class="text-emerald-300 text-[10px] block">可用赊销周转金</span>
          <b id="credit-avail" class="text-amber-300 font-mono text-base font-bold">¥2000.00</b>
        </div>
        <div class="text-center">
          <span class="text-emerald-300 text-[10px] block">借用空筐</span>
          <b id="store-basket-count" class="text-amber-200 font-mono text-sm font-bold">0 个</b>
        </div>
        <div class="text-right">
          <span class="text-emerald-300 text-[10px] block">随车挂账累计</span>
          <b id="credit-debt" class="text-white font-mono text-sm">¥0.00</b>
        </div>
      </div>
      <div class="text-[10px] text-emerald-200 mt-1.5 flex justify-between">
        <span>跟车服务人: <b id="store-driver" class="text-white">配送师傅</b></span>
        <span>随车卸货 · 钱货两清</span>
      </div>
    </header>

    <!-- 分类标签与卖点贴快筛 -->
    <div class="sticky top-0 z-10 bg-white border-b border-stone-100 p-2 space-y-1.5">
      <div id="category-bar" class="flex gap-2 overflow-x-auto no-scrollbar text-xs">
        <button onclick="window.filterCategory('全部')" class="cat-pill bg-[#064e3b] text-white px-3 py-1.5 rounded-xl font-bold whitespace-nowrap">
          全部现货
        </button>
      </div>
      <div id="quick-tag-pills" class="flex gap-1.5 overflow-x-auto no-scrollbar text-[11px] pt-1">
        <button onclick="window.filterBySpecialTag('全部')" class="tag-filter-chip bg-stone-800 text-white px-2 py-0.5 rounded-lg whitespace-nowrap font-bold">全部</button>
        <button onclick="window.filterBySpecialTag('🔥 街坊抢手')" class="tag-filter-chip bg-stone-100 text-stone-600 px-2 py-0.5 rounded-lg whitespace-nowrap">🔥 街坊抢手</button>
        <button onclick="window.filterBySpecialTag('⏳ 临期捡漏')" class="tag-filter-chip bg-stone-100 text-stone-600 px-2 py-0.5 rounded-lg whitespace-nowrap">⏳ 临期捡漏</button>
        <button onclick="window.filterBySpecialTag('💎 高毛利')" class="tag-filter-chip bg-stone-100 text-stone-600 px-2 py-0.5 rounded-lg whitespace-nowrap">💎 高毛利</button>
      </div>
    </div>

    <!-- 货品列表容器 -->
    <main id="product-container" class="p-3 divide-y divide-stone-100 flex-1">
      <div class="p-12 text-center text-stone-400 text-xs">正在调取在售货单...</div>
    </main>

    <!-- 底部常驻报单栏 -->
    <footer class="fixed bottom-0 max-w-md w-full bg-white/95 backdrop-blur-md border-t border-stone-200 p-3 space-y-2 z-20">
      <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5 text-[10px]">
        <span class="text-stone-400 whitespace-nowrap">随车附言:</span>
        <button onclick="window.appendDeliveryNote('赶早送达')" class="bg-stone-100 hover:bg-stone-200 text-stone-700 px-2 py-0.5 rounded-lg whitespace-nowrap">赶早送达</button>
        <button onclick="window.appendDeliveryNote('送入库房')" class="bg-stone-100 hover:bg-stone-200 text-stone-700 px-2 py-0.5 rounded-lg whitespace-nowrap">送入库房</button>
        <button onclick="window.appendDeliveryNote('备零钱找零')" class="bg-stone-100 hover:bg-stone-200 text-stone-700 px-2 py-0.5 rounded-lg whitespace-nowrap">备零钱</button>
        <button onclick="window.appendDeliveryNote('后厨验收')" class="bg-stone-100 hover:bg-stone-200 text-stone-700 px-2 py-0.5 rounded-lg whitespace-nowrap">后厨验收</button>
      </div>

      <div class="flex justify-between items-center">
        <div>
          <div class="text-[10px] text-stone-400">进货合计:</div>
          <div class="text-emerald-950 font-mono font-bold text-lg leading-tight">
            ¥<span id="cart-total-amount">0.00</span>
          </div>
        </div>
        <button onclick="window.submitB2BOrder()" id="btn-submit-order" class="bg-[#064e3b] hover:bg-[#043327] text-white text-xs font-bold px-6 py-2.5 rounded-xl shadow active:scale-95 transition flex items-center gap-2">
          <span>确认报单</span>
          <span id="cart-count-badge" class="bg-amber-400 text-stone-900 text-[10px] px-1.5 py-0.2 rounded-full font-mono font-bold">0</span>
        </button>
      </div>
    </footer>

  </div>

  <!-- 弹窗：单据历史与电子收条看板 -->
  <div id="receipts-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-3">
    <div class="bg-white w-full max-w-sm rounded-3xl p-5 space-y-3 text-stone-800 shadow-2xl max-h-[85vh] overflow-y-auto no-scrollbar">
      <div class="flex justify-between items-center pb-2 border-b border-stone-100">
        <h3 class="font-bold text-sm text-stone-800">📜 进货单据与付款收条</h3>
        <button onclick="window.closeModal('receipts-modal')" class="text-stone-400 text-lg">✕</button>
      </div>

      <div class="space-y-2">
        <b class="text-xs text-stone-700 block">🚚 进货报单记录 (含货物明细)</b>
        <div id="my-orders-list" class="space-y-2 text-xs"></div>
      </div>

      <div class="space-y-2 pt-2 border-t border-stone-100">
        <b class="text-xs text-stone-700 block">🧾 随车师傅收款电子收条</b>
        <div id="my-receipts-list" class="space-y-2 text-xs"></div>
      </div>
    </div>
  </div>

  <!-- 宣传单生成弹窗 -->
  <div id="flyer-modal" class="hidden fixed inset-0 bg-black/90 backdrop-blur-sm z-50 flex flex-col items-center justify-center p-4">
    <div class="bg-white w-full max-w-sm rounded-3xl p-4 text-center space-y-3">
      <div class="text-left">
        <h3 class="font-bold text-sm text-stone-800">宣传单已生成</h3>
        <p class="text-[10px] text-stone-400">长按图片直接发给微信群或老客户</p>
      </div>
      <div class="rounded-2xl overflow-hidden border border-stone-200">
        <img id="flyer-preview-img" src="" class="w-full object-cover">
      </div>
      <button onclick="window.closeModal('flyer-modal')" class="w-full bg-stone-100 text-stone-700 font-bold py-2 rounded-xl text-xs">
        返回
      </button>
    </div>
  </div>

  <!-- 绑定总代弹窗 -->
  <div id="bind-agent-modal" class="hidden fixed inset-0 bg-stone-900/80 backdrop-blur-sm z-50 flex items-center justify-center p-3">
    <div class="bg-white w-full max-w-sm rounded-3xl p-5 space-y-3 text-stone-800 shadow-2xl">
      <div class="flex justify-between items-center pb-2 border-b border-stone-100">
        <h3 class="font-bold text-sm text-stone-800">绑定供货总代</h3>
        <button onclick="window.closeModal('bind-agent-modal')" class="text-stone-400 text-lg">✕</button>
      </div>
      <div class="space-y-2 text-xs">
        <div>
          <label class="block text-stone-600 mb-1">总代 6 位认领码：</label>
          <div class="flex gap-2">
            <input type="text" id="bind-input-code" placeholder="输入 6 位认领码" maxlength="6" class="flex-1 bg-stone-50 border border-stone-200 rounded-xl px-3 py-1.5 font-mono text-center font-bold outline-none">
            <button onclick="window.bindByCode()" class="bg-[#064e3b] text-white font-bold px-3 py-1.5 rounded-xl">验证</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <canvas id="hidden-canvas" class="hidden"></canvas>

  <script type="module">
    import { supabase } from './src/lib/supabase.js';

    let currentAgent = localStorage.getItem('active_agent') || 'BJ_SHUNDA';
    let currentStore = null;
    let shopType = localStorage.getItem('active_shop_type') || '社区超市';
    let allProducts = [];
    let currentCategory = '全部';
    let currentTagFilter = '全部';
    const cart = {};
    let deliveryNote = '';

    window.openModal = id => document.getElementById(id).classList.remove('hidden');
    window.closeModal = id => document.getElementById(id).classList.add('hidden');

    window.switchShopTypePrompt = function() {
      const types = ['社区超市', '餐饮饭店', '精品商超', '便利门店', '批发副食'];
      const chosen = prompt(`选择门面类型：\n${types.map((t, i) => `${i + 1}. ${t}`).join('\n')}\n输入序号 (1-5)：`, '1');
      if (chosen && types[parseInt(chosen) - 1]) {
        shopType = types[parseInt(chosen) - 1];
        localStorage.setItem('active_shop_type', shopType);
        renderShopType();
      }
    };

    function renderShopType() {
      document.getElementById('shop-type-badge').innerText = `${shopType} ▾`;
    }

    window.appendDeliveryNote = function(txt) {
      deliveryNote = deliveryNote ? `${deliveryNote}；${txt}` : txt;
      alert(`已附加随车附言：${deliveryNote}`);
    };

    async function initTerminal() {
      renderShopType();
      document.getElementById('tenant-badge').innerText = currentAgent;

      const { data: stores } = await supabase.from('store').select('*').eq('tenant_id', currentAgent).limit(1);
      if (stores && stores.length > 0) {
        currentStore = stores[0];
        document.getElementById('store-title').innerText = currentStore.name || '合作门店';
        document.getElementById('store-boss').innerText = currentStore.contact || '负责人';
        document.getElementById('store-driver').innerText = currentStore.driver_name || '配送师傅';
        document.getElementById('store-basket-count').innerText = `${currentStore.basket_count || 0} 个`;
        
        const limit = parseFloat(currentStore.credit_limit || 2000);
        const debt = parseFloat(currentStore.current_debt || 0);
        document.getElementById('credit-avail').innerText = `¥${Math.max(0, limit - debt).toFixed(2)}`;
        document.getElementById('credit-debt').innerText = `¥${debt.toFixed(2)}`;
      }

      const { data: prods } = await supabase
        .from('product')
        .select('*')
        .eq('tenant_id', currentAgent)
        .neq('status', 'inactive')
        .order('id', { ascending: false });

      let rawProds = prods || [];
      if (currentStore && currentStore.visible_product_ids && currentStore.visible_product_ids.length > 0) {
        allProducts = rawProds.filter(p => currentStore.visible_product_ids.includes(p.id));
      } else {
        allProducts = rawProds;
      }

      renderCategoryTabs();
      renderProductList();
    }

    function renderCategoryTabs() {
      const categories = ['全部', ...new Set(allProducts.map(p => p.category_main).filter(Boolean))];
      document.getElementById('category-bar').innerHTML = categories.map(c => `
        <button onclick="window.filterCategory('${c}')" class="cat-pill ${c === currentCategory ? 'bg-[#064e3b] text-white' : 'bg-stone-100 text-stone-600'} px-3 py-1.5 rounded-xl font-bold whitespace-nowrap">
          ${c}
        </button>
      `).join('');
    }

    window.filterCategory = function(cat) {
      currentCategory = cat;
      renderCategoryTabs();
      renderProductList();
    };

    window.filterBySpecialTag = function(tag) {
      currentTagFilter = tag;
      document.querySelectorAll('.tag-filter-chip').forEach(b => {
        b.className = (b.innerText === tag) 
          ? 'tag-filter-chip bg-stone-800 text-white px-2 py-0.5 rounded-lg whitespace-nowrap font-bold'
          : 'tag-filter-chip bg-stone-100 text-stone-600 px-2 py-0.5 rounded-lg whitespace-nowrap';
      });
      renderProductList();
    };

    function renderProductList() {
      let filtered = (currentCategory === '全部') 
        ? allProducts 
        : allProducts.filter(p => p.category_main === currentCategory);

      if (currentTagFilter !== '全部') {
        filtered = filtered.filter(p => Array.isArray(p.tags) && p.tags.includes(currentTagFilter));
      }

      const container = document.getElementById('product-container');
      if (filtered.length === 0) {
        container.innerHTML = '<div class="p-8 text-center text-stone-400 text-xs">无符合条件的在售货品</div>';
        return;
      }

      container.innerHTML = filtered.map(p => {
        const imgHtml = p.image_url 
          ? `<img src="${p.image_url}" class="w-14 h-14 rounded-xl object-cover border border-stone-200">`
          : `<div class="w-14 h-14 rounded-xl bg-stone-100 border border-stone-200 flex items-center justify-center text-[10px] text-stone-400">无图</div>`;
        const tags = Array.isArray(p.tags) ? p.tags : [];
        const tagHtml = tags.map(t => `<span class="bg-amber-50 text-amber-900 border border-amber-200 text-[9px] px-1 py-0.2 rounded font-medium">${t}</span>`).join(' ');

        return `
          <div class="py-3 px-1 space-y-2">
            <div class="flex justify-between items-center gap-3">
              <div class="flex items-center gap-2.5">
                ${imgHtml}
                <div>
                  <div class="font-bold text-xs text-stone-800">${p.name}</div>
                  <div class="mt-0.5 space-x-1">${tagHtml}</div>
                  <div class="text-[11px] text-stone-400 mt-0.5 font-mono">${p.spec || '整箱'}</div>
                  <div class="text-xs font-bold text-emerald-800 font-mono mt-0.5">
                    ¥${p.tier_1_price} <span class="text-[10px] text-stone-400 font-normal">/${p.pack_unit || '箱'}</span>
                  </div>
                </div>
              </div>

              <div class="flex items-center gap-2">
                <button onclick="window.changeQty(${p.id}, -1)" class="w-7 h-7 rounded-lg bg-stone-100 font-bold text-stone-600 active:scale-95">-</button>
                <span id="qty-${p.id}" class="w-6 text-center font-bold text-xs font-mono">${cart[p.id] || 0}</span>
                <button onclick="window.changeQty(${p.id}, 1)" class="w-7 h-7 rounded-lg bg-emerald-50 text-emerald-800 font-bold active:scale-95">+</button>
              </div>
            </div>

            <div class="flex justify-end">
              <button onclick="window.generateFlyer(${p.id})" class="text-[10px] bg-stone-50 hover:bg-stone-100 text-stone-600 border border-stone-200 px-2 py-0.5 rounded-lg active:scale-95">
                做张宣传单
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    window.changeQty = function(id, delta) {
      cart[id] = (cart[id] || 0) + delta;
      if (cart[id] < 0) cart[id] = 0;
      const el = document.getElementById(`qty-${id}`);
      if (el) el.innerText = cart[id];
      updateCartSummary();
    };

    function updateCartSummary() {
      let totalAmount = 0, totalCount = 0;
      for (const [id, qty] of Object.entries(cart)) {
        if (qty > 0) {
          const prod = allProducts.find(x => x.id === parseInt(id));
          if (prod) { totalAmount += prod.tier_1_price * qty; totalCount += qty; }
        }
      }
      document.getElementById('cart-total-amount').innerText = totalAmount.toFixed(2);
      document.getElementById('cart-count-badge').innerText = totalCount;
    }

    window.generateFlyer = function(prodId) {
      const prod = allProducts.find(x => x.id === prodId);
      if (!prod) return;

      const shopName = currentStore ? currentStore.name : '合作门店';
      const canvas = document.getElementById('hidden-canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = 600; canvas.height = 760;

      ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, 600, 760);
      const headColor = (shopType === '餐饮饭店') ? '#78350f' : '#064e3b';
      ctx.fillStyle = headColor; ctx.fillRect(30, 30, 540, 80);
      
      ctx.fillStyle = '#ffffff'; ctx.font = 'bold 24px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(`${shopName} · 正品严选直供`, 300, 78);

      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = function() { ctx.drawImage(img, 120, 140, 360, 300); drawText(); };
      img.onerror = function() { ctx.fillStyle = '#f3f4f6'; ctx.fillRect(120, 140, 360, 300); drawText(); };
      img.src = prod.image_url || '';

      function drawText() {
        ctx.fillStyle = '#111827'; ctx.font = 'bold 26px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(prod.name, 300, 480);
        ctx.fillStyle = '#6b7280'; ctx.font = '16px sans-serif';
        ctx.fillText(`规格：${prod.spec || '整箱装'} · 正品直发`, 300, 515);
        ctx.fillStyle = '#b91c1c'; ctx.font = 'bold 36px sans-serif';
        ctx.fillText(shopType === '餐饮饭店' ? `明厨亮灶 · 良心选材` : `老客拼单价：¥${(prod.tier_1_price * 1.15).toFixed(1)}`, 300, 580);
        document.getElementById('flyer-preview-img').src = canvas.toDataURL('image/jpeg', 0.85);
        window.openModal('flyer-modal');
      }
    };

    window.submitB2BOrder = async function() {
      const totalAmount = parseFloat(document.getElementById('cart-total-amount').innerText);
      if (totalAmount <= 0) return alert('未选择货品件数！');

      const itemsPayload = [];
      for (const [id, qty] of Object.entries(cart)) {
        if (qty > 0) {
          const p = allProducts.find(x => x.id === parseInt(id));
          if (p) itemsPayload.push({ id: p.id, name: p.name, spec: p.spec, price: p.tier_1_price, qty });
        }
      }

      const btn = document.getElementById('btn-submit-order');
      btn.disabled = true;
      btn.innerText = '提交中...';

      try {
        if (currentStore) {
          await supabase.from('store_order').insert([{
            tenant_id: currentAgent,
            store_id: currentStore.id,
            store_name: currentStore.name,
            driver_name: currentStore.driver_name || '配送师傅',
            total_amount: totalAmount,
            pay_type: 'credit',
            pay_status: 'pending',
            delivery_status: 'ordered',
            note: deliveryNote,
            items: itemsPayload
          }]);

          const newDebt = parseFloat(currentStore.current_debt || 0) + totalAmount;
          await supabase.from('store').update({ current_debt: newDebt }).eq('id', currentStore.id);
        }

        alert(`报单成功！合计 ¥${totalAmount.toFixed(2)}\n跟车师傅已收到配货清单，正安排装车！`);
        for (const k of Object.keys(cart)) cart[k] = 0;
        deliveryNote = '';
        renderProductList();
        updateCartSummary();
        initTerminal();
      } catch (err) {
        alert(`报单失败: ${err.message}`);
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<span>确认报单</span> <span id="cart-count-badge" class="bg-amber-400 text-stone-900 text-[10px] px-1.5 py-0.2 rounded-full font-mono font-bold">0</span>`;
      }
    };

    window.openReceiptsModal = async function() {
      if (!currentStore) return alert('未绑定门店');
      window.openModal('receipts-modal');

      const { data: myOrders } = await supabase
        .from('store_order')
        .select('*')
        .eq('store_id', currentStore.id)
        .order('id', { ascending: false })
        .limit(10);

      document.getElementById('my-orders-list').innerHTML = (myOrders || []).map(o => {
        const items = Array.isArray(o.items) ? o.items : [];
        const itemsText = items.map(it => `${it.name} x ${it.qty}箱`).join('、');
        return `
          <div class="p-2.5 bg-stone-50 border border-stone-200 rounded-xl space-y-1">
            <div class="flex justify-between font-bold">
              <span>单号 #${o.id} · ¥${o.total_amount}</span>
              <span class="${o.delivery_status === 'delivered' ? 'text-emerald-700' : 'text-amber-700'}">
                ${o.delivery_status === 'delivered' ? '已送达平账' : '排单待送'}
              </span>
            </div>
            <div class="text-[10px] text-stone-500">品项: ${itemsText || '整批进货'}</div>
            <div class="text-[10px] text-stone-400">报单时间: ${new Date(o.created_at).toLocaleString()}</div>
          </div>
        `;
      }).join('') || '<div class="text-stone-400 text-center py-2">暂无报单</div>';

      const { data: myReceipts } = await supabase
        .from('driver_collection_log')
        .select('*')
        .eq('store_id', currentStore.id)
        .order('id', { ascending: false })
        .limit(10);

      document.getElementById('my-receipts-list').innerHTML = (myReceipts || []).map(r => `
        <div class="p-2.5 bg-emerald-50/60 border border-emerald-200 rounded-xl space-y-1">
          <div class="flex justify-between font-bold text-emerald-950">
            <span>经办跟车人: ${r.driver_name}</span>
            <span>实交: ¥${r.amount} (${r.pay_method})</span>
          </div>
          ${r.basket_return ? `<div class="text-[10px] text-amber-800">退还周转空筐: ${r.basket_return}个 (折抵 ¥${r.basket_deduct_amount})</div>` : ''}
          <div class="text-[10px] text-emerald-800">核销时间: ${new Date(r.created_at).toLocaleString()}</div>
        </div>
      `).join('') || '<div class="text-stone-400 text-center py-2">暂无交款凭证</div>';
    };

    window.bindByCode = function() {
      const code = document.getElementById('bind-input-code').value.trim();
      if (!code) return alert('请输入认领码！');
      if (code === '888001') currentAgent = 'BJ_SHUNDA';
      else if (code === '888002') currentAgent = 'SH_LEGOU';
      else return alert('无效认领码！');

      localStorage.setItem('active_agent', currentAgent);
      alert('绑定完成，货单已更新。');
      window.closeModal('bind-agent-modal');
      initTerminal();
    };

    initTerminal();
  </script>
</body>
</html>
