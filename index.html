<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f766e" />
  <title>商道相通 · 掌中宝随身作战舱</title>
  <style>
    :root {
      --bg-page: #f1f5f9;
      --bg-card: #ffffff;
      --bg-subtle: #f8fafc;
      --border-light: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #0f766e;
      --primary-light: #ccfbf1;
      --primary-dark: #115e59;
      --accent: #b45309;
      --accent-bg: #fef3c7;
      --danger: #be123c;
      --danger-bg: #ffe4e6;
      --success: #15803d;
      --success-bg: #dcfce7;
      --font-scale: 1;
    }

    body.elder-mode {
      --font-scale: 1.28;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
      background: var(--bg-page);
      color: var(--text-main);
      font-size: calc(15px * var(--font-scale));
      line-height: 1.45;
      padding-bottom: 84px; /* 留出底部拇指导航热区 */
    }

    /* 顶部状态微栏 */
    .m-header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: var(--primary-dark);
      color: #fff;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .m-header-title {
      font-weight: 700;
      font-size: calc(16px * var(--font-scale));
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .m-pill {
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: calc(12px * var(--font-scale));
      cursor: pointer;
    }

    /* 时辰自适应提示横幅 */
    .time-banner {
      background: #fffbeb;
      border-bottom: 1px solid #fde68a;
      color: #92400e;
      padding: 8px 14px;
      font-size: calc(13px * var(--font-scale));
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .container { padding: 12px; max-width: 600px; margin: 0 auto; }

    /* 卡片与指标 */
    .card {
      background: var(--bg-card);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 1px 4px rgba(15, 23, 42, 0.05);
      border: 1px solid var(--border-light);
    }
    .card-hd {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-weight: 700;
      font-size: calc(15px * var(--font-scale));
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }
    .kpi-box {
      background: #fff;
      border-radius: 12px;
      padding: 12px;
      border: 1px solid var(--border-light);
    }
    .kpi-label { font-size: calc(12px * var(--font-scale)); color: var(--text-muted); }
    .kpi-num { font-size: calc(20px * var(--font-scale)); font-weight: 800; color: var(--primary-dark); margin-top: 2px; }

    /* 大拇指友好按钮 */
    button, .btn {
      border: 1px solid var(--border-light);
      background: #fff;
      color: var(--text-main);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: calc(14px * var(--font-scale));
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    button:active { transform: scale(0.98); }
    button.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
    button.warn { background: var(--accent-bg); color: var(--accent); border-color: #fcd34d; }
    button.danger { background: var(--danger-bg); color: var(--danger); border-color: #fda4af; }
    button.block { width: 100%; }
    button.sm { padding: 6px 10px; font-size: calc(12px * var(--font-scale)); }

    input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border-light);
      border-radius: 10px;
      font-size: inherit;
      font-family: inherit;
      background: #fff;
      color: var(--text-main);
    }
    input:focus, select:focus { outline: none; border-color: var(--primary); }

    /* 语音与快捷指令胶囊 */
    .voice-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .voice-bar input { flex: 1; border-radius: 999px; padding-left: 16px; }

    /* 购物车条目 */
    .cart-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--bg-subtle);
      gap: 8px;
    }
    .qty-ctrl {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .qty-ctrl button { width: 32px; height: 32px; padding: 0; border-radius: 8px; }

    /* 底部固定单手拇指导航栏 */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 68px;
      background: #ffffff;
      border-top: 1px solid var(--border-light);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 40;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .tab-btn {
      flex: 1;
      height: 100%;
      border: none;
      background: transparent;
      border-radius: 0;
      flex-direction: column;
      gap: 2px;
      font-size: calc(11px * var(--font-scale));
      color: var(--text-muted);
      padding: 4px;
    }
    .tab-btn.active { color: var(--primary); font-weight: 800; }
    .tab-icon { font-size: calc(20px * var(--font-scale)); }

    /* 弹窗与锁屏层 */
    .modal-mask {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.7);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 100;
    }
    .modal-mask.show { display: flex; }
    .bottom-sheet {
      background: #fff;
      width: 100%;
      max-width: 600px;
      border-radius: 20px 20px 0 0;
      padding: 20px;
      max-height: 88vh;
      overflow-y: auto;
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: calc(11px * var(--font-scale));
      background: var(--bg-subtle);
      border: 1px solid var(--border-light);
    }
    .badge.warn { background: var(--accent-bg); color: var(--accent); border-color: #fde68a; }
    .badge.danger { background: var(--danger-bg); color: var(--danger); border-color: #fecdd3; }
    .badge.ok { background: var(--success-bg); color: var(--success); border-color: #bbf7d0; }
  </style>
</head>
<body>

  <!-- 顶部状态微栏（双击标题区一键防窥脱敏） -->
  <header class="m-header" id="mHeader">
    <div class="m-header-title">
      <span>🏮</span>
      <span id="mStoreName">本店</span>
    </div>
    <div style="display:flex; gap:6px; align-items:center;">
      <span class="m-pill" id="mCloudStatus" title="点击切换云端同步">☁️ 同步就绪</span>
      <span class="m-pill" id="mPrivacyBtn">👁️</span>
      <span class="m-pill" id="mAccBtn">👑 <span id="mAccName">掌柜</span></span>
    </div>
  </header>

  <!-- 练手模拟舱横幅 -->
  <div id="mSandboxBar" style="display:none; background:#fef3c7; color:#92400e; padding:8px 14px; font-size:13px; justify-content:space-between; align-items:center;">
    <span>🎓 <strong>练手模拟舱</strong>（不记入真账）</span>
    <button class="sm warn" id="btnMExitSandbox">退出</button>
  </div>

  <!-- 随营业时辰自适应提醒横幅 -->
  <div class="time-banner" id="timeContextBanner"></div>

  <!-- 主作战容器 -->
  <main class="container" id="mMainContainer"></main>

  <!-- 底部单手拇指导航热区 -->
  <nav class="bottom-nav" id="mBottomNav"></nav>

  <!-- 底部抽屉弹窗（收款码亮码 / 账号切换 / 相机扫码） -->
  <div class="modal-mask" id="mSheetMask">
    <div class="bottom-sheet" id="mSheetBody"></div>
  </div>

  <script type="module">
    import {
      StoreCoreEngine,
      INDUSTRY_GENES,
      roundMoney,
      generateId
    } from './src/modules/store/storeCoreEngine.js';

    // 保留并挂载原有云端联动适配器（断网本地优先，联网异步队列上报）
    const cloudSyncQueue = [];
    const engine = new StoreCoreEngine({
      cloudSyncAdapter: (state, eventType, detail) => {
        cloudSyncQueue.push({ ts: Date.now(), eventType, storeId: state.activeStoreId, detailId: detail?.id || '' });
        if (typeof window.onStoreCloudSync === 'function') {
          window.onStoreCloudSync(state, eventType, detail);
        }
        updateCloudBadge();
      }
    });

    let activeTab = 'cashier'; // cashier(收银) | goods(货品到货) | ledger(账本核决) | more(全能百宝箱)
    let mCart = [];
    let cameraStream = null;

    const $ = (id) => document.getElementById(id);

    function updateCloudBadge() {
      const el = $('mCloudStatus');
      if (!el) return;
      if (!engine.state.meta.cloudSyncEnabled) {
        el.textContent = '📴 纯本地';
      } else if (!navigator.onLine) {
        el.textContent = `⏳ 离线(${cloudSyncQueue.length})`;
      } else {
        el.textContent = '☁️ 云端已连';
      }
    }

    /* ========================================================================
     * 营业时辰感知器（晨间签收补货 / 日间极速收银 / 晚间打烊晴雨与周备份催备）
     * ======================================================================== */
    function getTimeContextHint(metrics) {
      const hour = new Date().getHours();
      const daysSinceBackup = engine.state.meta.lastBackupAt
        ? Math.floor((Date.now() - engine.state.meta.lastBackupAt) / 86400000)
        : 99;

      if (hour >= 5 && hour < 10) {
        return {
          text: `🌅 早安！晨间备货时段（低库存 ${metrics.lowStockSkus.length} 款）`,
          btnText: '去随车签收',
          action: () => { activeTab = 'goods'; renderMobile(); }
        };
      }
      if (hour >= 20 || hour < 5) {
        const needBackup = daysSinceBackup >= 7;
        return {
          text: needBackup
            ? `🌙 晚间打烊：已超 ${daysSinceBackup === 99 ? '7' : daysSinceBackup} 天未导出备份，建议发微信留底`
            : `🌙 晚间打烊：今日实收 ¥${metrics.todayRevenue.toFixed(2)}（${metrics.todayOrderCount}笔）`,
          btnText: needBackup ? '一键导出留底' : '打烊封账',
          action: () => {
            if (needBackup) exportMobileBackup();
            else { activeTab = 'ledger'; renderMobile(); }
          }
        };
      }
      return {
        text: `☀️ 营业中 · 今日已收 ¥${metrics.todayRevenue.toFixed(2)}（保本线 ${metrics.breakevenProgress}%）`,
        btnText: '亮收款码',
        action: () => openQrSheet()
      };
    }

    /* ========================================================================
     * 全局渲染调度
     * ======================================================================== */
    function renderMobile() {
      const store = engine.getActiveStore();
      const acc = engine.getCurrentAccount();
      const metrics = engine.getDashboardMetrics();

      document.body.classList.toggle('elder-mode', Boolean(engine.state.meta.elderLargeMode));
      $('mStoreName').textContent = store.name;
      $('mAccName').textContent = acc.name;
      $('mPrivacyBtn').textContent = engine.privacyShieldActive ? '🙈' : '👁️';
      $('mSandboxBar').style.display = engine.sandboxMode ? 'flex' : 'none';
      updateCloudBadge();

      if (engine.state.rbac.locked) {
        openAccountSheet(true);
      }

      // 渲染时辰横幅
      const ctx = getTimeContextHint(metrics);
      const banner = $('timeContextBanner');
      banner.innerHTML = `<span>${ctx.text}</span><button class="sm warn" id="btnTimeCtxAction">${ctx.btnText}</button>`;
      $('btnTimeCtxAction').onclick = ctx.action;

      // 渲染底部动态导航（受角色手电筒隔离）
      renderBottomNav(metrics);

      // 渲染主视图
      const container = $('mMainContainer');
      if (activeTab === 'cashier') {
        container.innerHTML = renderCashierTab(metrics);
        bindCashierTab();
      } else if (activeTab === 'goods') {
        container.innerHTML = renderGoodsTab(metrics);
        bindGoodsTab();
      } else if (activeTab === 'ledger') {
        container.innerHTML = renderLedgerTab(metrics);
        bindLedgerTab();
      } else {
        container.innerHTML = renderMoreTab();
        bindMoreTab();
      }
    }

    function renderBottomNav(metrics) {
      const tabs = [
        { id: 'cashier', icon: '🧾', label: '极速收银', allow: engine.canAccessModule('pos') },
        { id: 'goods',   icon: '📦', label: '货品签收', allow: engine.canAccessModule('catalog') || engine.canAccessModule('receiving') },
        { id: 'ledger',  icon: '💰', label: metrics.pendingApprovals.length > 0 ? `账本(${metrics.pendingApprovals.length})` : '账本核决', allow: engine.canAccessModule('finance') || engine.canAccessModule('reconcile') },
        { id: 'more',    icon: '🧭', label: '百宝箱',   allow: true }
      ].filter(t => t.allow);

      if (!tabs.some(t => t.id === activeTab) && tabs.length > 0) {
        activeTab = tabs[0].id;
      }

      const nav = $('mBottomNav');
      nav.innerHTML = tabs.map(t => `
        <button class="tab-btn ${activeTab === t.id ? 'active' : ''}" data-tab="${t.id}">
          <span class="tab-icon">${t.icon}</span>
          <span>${t.label}</span>
        </button>
      `).join('');

      nav.querySelectorAll('[data-tab]').forEach(btn => {
        btn.onclick = () => {
          activeTab = btn.dataset.tab;
          renderMobile();
        };
      });
    }

    /* ------------------------------------------------------------------------
     * 视图 1：极速收银 & 双向语音指令 & 亮码（单手拇指热区）
     * ------------------------------------------------------------------------ */
    function renderCashierTab(metrics) {
      const total = roundMoney(mCart.reduce((s, it) => s + it.qty * it.unitPrice, 0));
      const hint = engine.getCrossSellHint(mCart.map(i => i.skuId));

      return `
        <!-- 语音/快捷指令输入条 -->
        <div class="voice-bar">
          <input type="text" id="mVoiceInput" placeholder="点键盘麦克风说话：如“老王赊账48元”或输品名..." />
          <button class="primary" id="btnMVoiceGo">执行</button>
          <button id="btnMCameraScan" title="摄像头扫码">📷</button>
        </div>

        <div class="card">
          <div class="card-hd">
            <span>🛒 当前收银清单（数量可减至负数退货）</span>
            <button class="sm" id="btnMNoCatalog">+ 临时代收</button>
          </div>

          ${hint ? `<div class="badge ok" style="margin-bottom:8px; display:block; padding:6px 10px;" id="btnMCrossSell">💡 顺口带货：${hint.text}（点此加入）</div>` : ''}

          ${mCart.length === 0 ? `
            <div style="text-align:center; padding:26px 10px; color:var(--text-muted);">
              上方输入品名/条码，或点 📷 连续扫码开单
            </div>
          ` : mCart.map((it, idx) => `
            <div class="cart-row">
              <div style="flex:1;">
                <div style="font-weight:700;">${it.name}</div>
                <div style="font-size:12px; color:var(--text-muted);">单价 ¥${it.unitPrice.toFixed(2)} · 小计 ¥${roundMoney(it.qty * it.unitPrice).toFixed(2)}</div>
              </div>
              <div class="qty-ctrl">
                <button data-m-dec="${idx}">-</button>
                <strong style="min-width:26px; text-align:center;">${it.qty}</strong>
                <button data-m-inc="${idx}">+</button>
              </div>
            </div>
          `).join('')}

          <div style="margin-top:14px; padding-top:12px; border-top:1px solid var(--border-light);">
            <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:12px;">
              <span style="color:var(--text-muted);">本单应收净额：</span>
              <span style="font-size:28px; font-weight:800; color:var(--primary-dark);">¥${total.toFixed(2)}</span>
            </div>

            <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
              <button class="primary" id="btnMPayDigital">📱 亮码收款落账</button>
              <button id="btnMPayCash">💵 现金收款落账</button>
              <button class="warn" id="btnMPayCredit">📒 熟客记账(赊)</button>
              <button id="btnMShowQrOnly">🛡️ 仅展示收款码</button>
            </div>
          </div>
        </div>

        <!-- 快捷商品点选墙（常用前8款，单手点选零打字） -->
        <div class="card">
          <div class="card-hd"><span>⚡ 常用商品一键点选</span></div>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
            ${engine.state.catalog.slice(0, 8).map(s => `
              <button style="justify-content:space-between; font-weight:500;" data-m-quick-sku="${s.id}">
                <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${s.name}</span>
                <strong style="color:var(--primary);">¥${s.retailPrice}</strong>
              </button>
            `).join('') || '<span style="color:var(--text-muted); font-size:13px;">暂无商品，可点右上角“+ 临时代收”边卖边建</span>'}
          </div>
        </div>
      `;
    }

    function bindCashierTab() {
      const handleCommand = () => {
        const raw = $('mVoiceInput').value.trim();
        if (!raw) return;
        const cmd = engine.parseVoiceOrQuickCommand(raw);
        if (cmd.intent === 'FAMILY_DRAW' || cmd.intent === 'EXPENSE') {
          if (!cmd.amount) return alert('请说明具体金额，例如“家用拿走200元”');
          if (confirm(`确认记录【${cmd.label}】¥${cmd.amount} 吗？`)) {
            engine.commitVoucher({ type: cmd.intent, totalAmount: cmd.amount, payMethod: 'CASH', note: cmd.note });
            engine.speakFeedback(`已记录${cmd.amount}元`);
            $('mVoiceInput').value = '';
            renderMobile();
          }
        } else if (cmd.matchedSkus?.length > 0) {
          const sku = cmd.matchedSkus[0];
          const found = mCart.find(c => c.skuId === sku.id);
          if (found) found.qty += 1;
          else mCart.push({ skuId: sku.id, name: sku.name, qty: 1, unitPrice: sku.retailPrice, costPrice: sku.costPrice });
          $('mVoiceInput').value = '';
          renderMobile();
        } else {
          // 边卖边建
          const p = prompt(`未找到【${raw}】，输入售价（元）直接边卖边建档：`, '10');
          if (p !== null && !isNaN(Number(p))) {
            const price = roundMoney(p);
            const newSku = {
              id: generateId('SKU'),
              storeId: engine.state.activeStoreId,
              barcode: /^\d+$/.test(raw) ? raw : '',
              scaleCode: '',
              name: raw,
              category: engine.getActiveGene().quickTags[0] || '主营商品',
              unit: engine.getActiveGene().unitDefault,
              packUnit: engine.getActiveGene().packUnitDefault,
              packSize: 1,
              costPrice: 0,
              retailPrice: price,
              memberPrice: price,
              wholesalePrice: price,
              tierPrices: [],
              stock: 0,
              minStock: 5,
              maxStock: 100,
              supplierId: '',
              expiryDate: '',
              location: '',
              isBundle: false,
              bundleItems: [],
              updatedAt: Date.now()
            };
            engine.state.catalog.push(newSku);
            mCart.push({ skuId: newSku.id, name: newSku.name, qty: 1, unitPrice: price, costPrice: 0 });
            $('mVoiceInput').value = '';
            renderMobile();
          }
        }
      };

      $('btnMVoiceGo').onclick = handleCommand;
      $('mVoiceInput').onkeydown = (e) => { if (e.key === 'Enter') handleCommand(); };
      $('btnMCameraScan').onclick = () => openCameraScannerSheet();

      if ($('btnMNoCatalog')) {
        $('btnMNoCatalog').onclick = () => {
          const name = prompt('输入临时代收品名：', '散装百货');
          if (!name) return;
          const price = roundMoney(prompt('输入金额（负数代表退货/退桶）：', '10'));
          mCart.push({ skuId: '', name, qty: 1, unitPrice: price, costPrice: 0 });
          renderMobile();
        };
      }

      if ($('btnMCrossSell')) {
        $('btnMCrossSell').onclick = () => {
          const hint = engine.getCrossSellHint(mCart.map(i => i.skuId));
          if (hint) {
            mCart.push({ skuId: hint.sku.id, name: hint.sku.name, qty: 1, unitPrice: hint.sku.retailPrice, costPrice: hint.sku.costPrice });
            renderMobile();
          }
        };
      }

      document.querySelectorAll('[data-m-inc]').forEach(b => {
        b.onclick = () => { mCart[b.dataset.mInc].qty += 1; renderMobile(); };
      });
      document.querySelectorAll('[data-m-dec]').forEach(b => {
        b.onclick = () => {
          mCart[b.dataset.mDec].qty -= 1;
          if (mCart[b.dataset.mDec].qty === 0) mCart.splice(b.dataset.mDec, 1);
          renderMobile();
        };
      });
      document.querySelectorAll('[data-m-quick-sku]').forEach(b => {
        b.onclick = () => {
          const sku = engine.state.catalog.find(s => s.id === b.dataset.mQuickSku);
          if (!sku) return;
          const found = mCart.find(c => c.skuId === sku.id);
          if (found) found.qty += 1;
          else mCart.push({ skuId: sku.id, name: sku.name, qty: 1, unitPrice: sku.retailPrice, costPrice: sku.costPrice });
          renderMobile();
        };
      });

      const doMobileCheckout = (payMethod) => {
        if (mCart.length === 0) return alert('当前收银清单为空');
        let cusId = '';
        if (payMethod === 'CREDIT') {
          const cusName = prompt('输入赊账熟客姓名（自动建档或匹配）：', engine.state.customers[0]?.name || '');
          if (!cusName) return;
          let cus = engine.state.customers.find(c => c.name === cusName.trim());
          if (!cus) {
            cus = { id: generateId('CUS'), name: cusName.trim(), phone: '', creditLimit: 1000, receivableBalance: 0, points: 0, storedValue: 0, note: '', updatedAt: Date.now() };
            engine.state.customers.unshift(cus);
          }
          cusId = cus.id;
        }
        const total = roundMoney(mCart.reduce((s, it) => s + it.qty * it.unitPrice, 0));
        const res = engine.commitVoucher({
          type: 'SALE',
          typeName: '手机掌中宝收银单',
          items: mCart,
          totalAmount: total,
          payMethod,
          cashPaid: payMethod === 'CASH' ? total : 0,
          digitalPaid: payMethod === 'DIGITAL' ? total : 0,
          creditAmount: payMethod === 'CREDIT' ? total : 0,
          counterpartyId: cusId
        });
        if (res.ok) {
          mCart = [];
          engine.speakFeedback(`收款${total}元，已入账`);
          if (payMethod === 'DIGITAL') openQrSheet(total);
          else alert(`✅ 已落账 ¥${total.toFixed(2)}`);
        } else {
          alert(`⚠️ ${res.message}`);
        }
        renderMobile();
      };

      $('btnMPayDigital').onclick = () => doMobileCheckout('DIGITAL');
      $('btnMPayCash').onclick = () => doMobileCheckout('CASH');
      $('btnMPayCredit').onclick = () => doMobileCheckout('CREDIT');
      $('btnMShowQrOnly').onclick = () => openQrSheet();
    }

    /* ------------------------------------------------------------------------
     * 视图 2：货品库存 & 随车到货一键签收
     * ------------------------------------------------------------------------ */
    function renderGoodsTab(metrics) {
      const canCost = engine.hasPermission('viewCostAndProfit');
      return `
        <div class="card">
          <div class="card-hd">
            <span>🚚 随车到货快速签收</span>
            <button class="primary sm" id="btnMQuickAddSku">+ 新增商品</button>
          </div>
          <div style="display:flex; flex-direction:column; gap:8px;">
            <select id="mRcvSku">
              ${engine.state.catalog.map(s => `<option value="${s.id}">${s.name} (库存:${s.stock}${s.unit})</option>`).join('')}
            </select>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
              <input type="number" id="mRcvQty" placeholder="实收数量" value="10" />
              <input type="number" step="0.01" id="mRcvPrice" placeholder="本次进货单价" value="2" />
            </div>
            <button class="primary block" id="btnMConfirmRcv">✅ 确认签收入库</button>
          </div>
        </div>

        <div class="card">
          <div class="card-hd">
            <span>📦 在库商品清单（缺货预警 ${metrics.lowStockSkus.length} 款）</span>
          </div>
          ${engine.state.catalog.map(s => `
            <div class="cart-row">
              <div>
                <strong>${s.name}</strong>
                <div style="font-size:12px; color:var(--text-muted);">
                  售价 ¥${s.retailPrice} ${canCost ? `· 底价 ${engine.formatSensitiveMoney(s.costPrice)}` : ''}
                </div>
              </div>
              <span class="badge ${s.stock <= s.minStock ? 'danger' : 'ok'}">${s.stock} ${s.unit}</span>
            </div>
          `).join('') || '<div style="color:var(--text-muted); text-align:center; padding:16px;">暂无建档商品</div>'}
        </div>
      `;
    }

    function bindGoodsTab() {
      $('btnMQuickAddSku').onclick = () => {
        const name = prompt('输入新商品名称：');
        if (!name) return;
        const cost = roundMoney(prompt('输入单件进货底价（元）：', '1.5'));
        const retail = roundMoney(prompt('输入零售单价（元）：', '2.5'));
        const stock = Number(prompt('输入初始库存数量：', '24')) || 0;
        const gene = engine.getActiveGene();
        engine.state.catalog.unshift({
          id: generateId('SKU'),
          storeId: engine.state.activeStoreId,
          barcode: '',
          scaleCode: '',
          name: name.trim(),
          category: gene.quickTags[0] || '主营商品',
          unit: gene.unitDefault,
          packUnit: gene.packUnitDefault,
          packSize: 1,
          costPrice: cost,
          retailPrice: retail,
          memberPrice: retail,
          wholesalePrice: retail,
          tierPrices: [],
          stock,
          minStock: 5,
          maxStock: 100,
          supplierId: '',
          expiryDate: '',
          location: '',
          isBundle: false,
          bundleItems: [],
          updatedAt: Date.now()
        });
        engine._persist();
        renderMobile();
      };

      $('btnMConfirmRcv').onclick = () => {
        const sku = engine.state.catalog.find(s => s.id === $('mRcvSku')?.value);
        if (!sku) return alert('请先新增至少一款商品');
        const qty = Number($('mRcvQty').value) || 0;
        const unitPrice = roundMoney($('mRcvPrice').value);
        engine.commitVoucher({
          type: 'RECEIVE',
          items: [{ skuId: sku.id, name: sku.name, qty, bonusQty: 0, unitPrice, costPrice: unitPrice }],
          totalAmount: roundMoney(qty * unitPrice),
          payMethod: 'CREDIT',
          creditAmount: roundMoney(qty * unitPrice),
          note: '手机端随车签收'
        });
        engine.speakFeedback(`签收入库${qty}${sku.unit}`);
        alert(`✅ 已签收入库【${sku.name}】${qty}${sku.unit}`);
        renderMobile();
      };
    }

    /* ------------------------------------------------------------------------
     * 视图 3：三联总账 & AI 铁面稽核 & 掌柜最终核决台
     * ------------------------------------------------------------------------ */
    function renderLedgerTab(metrics) {
      const audit = engine.runIronAbacusAudit();
      return `
        <div class="kpi-grid">
          <div class="kpi-box">
            <div class="kpi-label">今日实收营业额</div>
            <div class="kpi-num">¥${metrics.todayRevenue.toFixed(2)}</div>
          </div>
          <div class="kpi-box">
            <div class="kpi-label">钱箱实有现金</div>
            <div class="kpi-num">¥${metrics.currentCash.toFixed(2)}</div>
          </div>
          <div class="kpi-box">
            <div class="kpi-label">熟客待收赊账</div>
            <div class="kpi-num" style="color:var(--accent);">¥${metrics.totalReceivable.toFixed(2)}</div>
          </div>
          <div class="kpi-box">
            <div class="kpi-label">今日真实毛利</div>
            <div class="kpi-num">${engine.formatSensitiveMoney(metrics.todayGrossProfit)}</div>
          </div>
        </div>

        <!-- 掌柜核决待办区 -->
        <div class="card">
          <div class="card-hd">
            <span>⚖️ 掌柜核决与 AI 铁面稽核</span>
            <span class="badge ${audit.passed ? 'ok' : 'danger'}">${audit.passed ? '四方吻合' : '有待核疑点'}</span>
          </div>
          ${metrics.pendingApprovals.map(item => `
            <div style="background:#fffbeb; border-left:4px solid var(--accent); padding:10px; border-radius:8px; margin-bottom:8px;">
              <strong>${item.title}</strong>
              <div style="font-size:12px; color:var(--text-muted); margin:4px 0;">${item.reason}</div>
              <div style="display:flex; gap:8px;">
                <button class="primary sm" data-m-approve="${item.id}">✅ 核准执行</button>
                <button class="sm" data-m-dismiss="${item.id}">放行归档</button>
              </div>
            </div>
          `).join('') || '<div style="color:var(--text-muted); font-size:13px;">当前无待拍板草案，账目清白稳健。</div>'}
        </div>

        <!-- 熟客欠款快速收款 -->
        <div class="card">
          <div class="card-hd"><span>📒 熟客往来欠款与还款核销</span></div>
          ${engine.state.customers.filter(c => c.receivableBalance > 0).map(c => `
            <div class="cart-row">
              <div><strong>${c.name}</strong><div style="font-size:12px; color:var(--accent);">待还：¥${c.receivableBalance.toFixed(2)}</div></div>
              <button class="sm primary" data-m-settle-cus="${c.id}">收款核销</button>
            </div>
          `).join('') || '<div style="color:var(--text-muted); font-size:13px;">当前无熟客挂账欠款</div>'}
        </div>
      `;
    }

    function bindLedgerTab() {
      document.querySelectorAll('[data-m-approve]').forEach(btn => {
        btn.onclick = () => {
          const res = engine.decideApprovalItem(btn.dataset.mApprove, 'APPROVED', '手机端掌柜核准');
          alert(res.message);
          renderMobile();
        };
      });
      document.querySelectorAll('[data-m-dismiss]').forEach(btn => {
        btn.onclick = () => {
          engine.decideApprovalItem(btn.dataset.mDismiss, 'DISMISSED', '掌柜放行');
          renderMobile();
        };
      });
      document.querySelectorAll('[data-m-settle-cus]').forEach(btn => {
        btn.onclick = () => {
          const cus = engine.state.customers.find(c => c.id === btn.dataset.mSettleCus);
          if (!cus) return;
          const amt = roundMoney(prompt(`【${cus.name}】当前欠款 ¥${cus.receivableBalance}，输入本次还款金额：`, cus.receivableBalance));
          if (amt > 0) {
            engine.commitVoucher({
              type: 'CREDIT_SETTLE',
              totalAmount: amt,
              payMethod: 'DIGITAL',
              digitalPaid: amt,
              counterpartyId: cus.id,
              counterpartyName: cus.name,
              note: `熟客【${cus.name}】还款入账`
            });
            engine.speakFeedback(`收到${cus.name}还款${amt}元`);
            renderMobile();
          }
        };
      });
    }

    /* ------------------------------------------------------------------------
     * 视图 4：全能百宝箱（桌面总控联动、群接龙、加密备份、长辈大字模式、家庭支取）
     * ------------------------------------------------------------------------ */
    function renderMoreTab() {
      return `
        <div class="card">
          <div class="card-hd"><span>🧭 跨端协同与主权百宝箱</span></div>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
            <button onclick="location.href='store.html'">🖥️ 切至电脑调度台</button>
            <button onclick="location.href='mall.html'">🛒 逛大集源头拼单</button>
            <button id="btnMShareJielong">💬 复制群接龙文案</button>
            <button id="btnMFamilyDraw">🏠 记一笔家庭支取</button>
            <button id="btnMExportBackup">📤 导出铁账备份包</button>
            <button id="btnMElderToggle">${engine.state.meta.elderLargeMode ? '✅ 已开大字版' : '👓 长辈大字模式'}</button>
            <button id="btnMSandbox">${engine.sandboxMode ? '退出模拟舱' : '🎓 练手模拟舱'}</button>
            <button class="danger" id="btnMLock">🔒 立即锁屏</button>
          </div>
        </div>
      `;
    }

    function bindMoreTab() {
      $('btnMShareJielong').onclick = () => {
        const skus = engine.state.catalog.slice(0, 6);
        const txt = `🏮【${engine.getActiveStore().name} · 街坊福利接龙】\n` +
          skus.map((s, i) => `${i + 1}. ${s.name} —— ¥${s.retailPrice}/${s.unit}`).join('\n') +
          `\n👉 群里直接回复“序号+数量”即可到店自提！`;
        navigator.clipboard?.writeText(txt);
        alert('群接龙文案已复制，可直接去微信群粘贴！');
      };
      $('btnMFamilyDraw').onclick = () => {
        const amt = roundMoney(prompt('输入老板私人/家庭支取现金金额（只扣钱箱，不污染经营利润）：', '100'));
        if (amt > 0) {
          engine.commitVoucher({ type: 'FAMILY_DRAW', totalAmount: amt, payMethod: 'CASH', note: '家庭日常支取' });
          alert(`已独立记录家庭支取 ¥${amt}`);
          renderMobile();
        }
      };
      $('btnMExportBackup').onclick = exportMobileBackup;
      $('btnMElderToggle').onclick = () => {
        engine.state.meta.elderLargeMode = !engine.state.meta.elderLargeMode;
        engine._persist();
        renderMobile();
      };
      $('btnMSandbox').onclick = () => {
        if (engine.sandboxMode) engine.exitSandbox();
        else engine.enterSandbox();
        renderMobile();
      };
      $('btnMLock').onclick = () => engine.lockScreen();
    }

    async function exportMobileBackup() {
      const pkg = await engine.exportIronBackup('');
      const blob = new Blob([JSON.stringify(pkg, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `掌中宝铁账备份_${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      alert('铁账备份包已导出，建议转发到微信“文件传输助手”永久留底！');
    }

    /* ========================================================================
     * 底部抽屉：亮收款码、账号切换与原生摄像头连续扫码
     * ======================================================================== */
    function openQrSheet(paidAmount = null) {
      const store = engine.getActiveStore();
      $('mSheetBody').innerHTML = `
        <div style="text-align:center;">
          <h3 style="margin-top:0;">🛡️ ${store.name} · 官方收款码</h3>
          ${paidAmount !== null ? `<div style="font-size:24px; font-weight:800; color:var(--primary); margin-bottom:10px;">本单应收：¥${paidAmount.toFixed(2)}</div>` : ''}
          ${store.paymentQrUrl
            ? `<img src="${store.paymentQrUrl}" style="max-width:240px; border-radius:12px; border:1px solid var(--border-light);" />`
            : `<div style="padding:30px; background:var(--bg-subtle); border-radius:12px; color:var(--text-muted);">尚未上传收款码（掌柜可在电脑端或设置中上传锁定）</div>`
          }
          <button class="primary block" style="margin-top:16px;" id="btnCloseSheet">完成并关闭</button>
        </div>
      `;
      $('mSheetMask').classList.add('show');
      $('btnCloseSheet').onclick = closeSheet;
    }

    function openAccountSheet(isLocked = false) {
      $('mSheetBody').innerHTML = `
        <div>
          <h3 style="margin-top:0;">🔐 切换值班岗位</h3>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:14px 0;">
            ${engine.state.rbac.accounts.filter(a => a.active).map(acc => `
              <button style="flex-direction:column; padding:14px;" data-m-acc="${acc.id}">
                <span style="font-size:26px;">${acc.avatar}</span>
                <span>${acc.name}</span>
              </button>
            `).join('')}
          </div>
          ${!isLocked ? `<button class="block" id="btnCloseSheet">取消</button>` : ''}
        </div>
      `;
      $('mSheetMask').classList.add('show');
      if ($('btnCloseSheet')) $('btnCloseSheet').onclick = closeSheet;

      $('mSheetBody').querySelectorAll('[data-m-acc]').forEach(btn => {
        btn.onclick = async () => {
          const accId = btn.dataset.mAcc;
          let res = await engine.switchAccount(accId, '');
          if (res.needPin) {
            const pin = prompt(res.message, '');
            if (pin !== null) res = await engine.switchAccount(accId, pin);
          }
          if (res.ok) {
            closeSheet();
            renderMobile();
          } else {
            alert(res.message);
          }
        };
      });
    }

    async function openCameraScannerSheet() {
      $('mSheetBody').innerHTML = `
        <div style="text-align:center;">
          <h3 style="margin-top:0;">📷 连续扫码收银</h3>
          <video id="mScanVideo" autoplay playsinline style="width:100%; max-height:260px; background:#000; border-radius:12px;"></video>
          <p id="mScanHint" style="font-size:13px; color:var(--text-muted);">请将商品条码对准取景框...</p>
          <button class="block" id="btnCloseScan">结束扫码</button>
        </div>
      `;
      $('mSheetMask').classList.add('show');
      $('btnCloseScan').onclick = closeSheet;

      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
        const video = $('mScanVideo');
        video.srcObject = cameraStream;
        if ('BarcodeDetector' in window) {
          const detector = new BarcodeDetector();
          let lastCode = '';
          let lastTs = 0;
          const loop = async () => {
            if (!cameraStream) return;
            try {
              const codes = await detector.detect(video);
              if (codes.length > 0) {
                const code = codes[0].rawValue;
                if (code && (code !== lastCode || Date.now() - lastTs > 2000)) {
                  lastCode = code;
                  lastTs = Date.now();
                  const matches = engine.searchCatalog(code);
                  if (matches.length > 0) {
                    const sku = matches[0];
                    const found = mCart.find(c => c.skuId === sku.id);
                    if (found) found.qty += 1;
                    else mCart.push({ skuId: sku.id, name: sku.name, qty: 1, unitPrice: sku.retailPrice, costPrice: sku.costPrice });
                    engine.speakFeedback(sku.name);
                    $('mScanHint').textContent = `✅ 已扫入：${sku.name} (¥${sku.retailPrice})`;
                    renderMobile();
                  } else {
                    $('mScanHint').textContent = `识别到新条码 ${code}，请关闭相机后直接建档`;
                  }
                }
              }
            } catch (_) {}
            requestAnimationFrame(loop);
          };
          requestAnimationFrame(loop);
        } else {
          $('mScanHint').textContent = '当前浏览器不支持原生连续解码，可使用外部扫码枪或直接输入条码';
        }
      } catch (err) {
        $('mScanHint').textContent = '无法调起摄像头，请检查浏览器相机权限';
      }
    }

    function closeSheet() {
      if (cameraStream) {
        cameraStream.getTracks().forEach(t => t.stop());
        cameraStream = null;
      }
      $('mSheetMask').classList.remove('show');
    }

    $('mPrivacyBtn').onclick = () => { engine.togglePrivacyShield(); renderMobile(); };
    $('mHeader').ondblclick = () => { engine.togglePrivacyShield(); renderMobile(); };
    $('mAccBtn').onclick = () => openAccountSheet(false);
    $('mCloudStatus').onclick = () => {
      engine.state.meta.cloudSyncEnabled = !engine.state.meta.cloudSyncEnabled;
      engine._persist();
      updateCloudBadge();
    };
    $('btnMExitSandbox').onclick = () => { engine.exitSandbox(); renderMobile(); };

    window.addEventListener('online', updateCloudBadge);
    window.addEventListener('offline', updateCloudBadge);

    engine.subscribe(() => renderMobile());
    renderMobile();
  </script>
</body>
