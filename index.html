<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>终端门店·采销互通中枢</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-stone-100 text-stone-800 font-sans pb-32 min-h-screen">
  
  <div class="max-w-md mx-auto min-h-screen flex flex-col bg-white shadow-2xl relative">
    
    <!-- 顶栏 -->
    <header class="bg-gradient-to-br from-[#064e3b] to-[#043327] text-white p-4 pt-4 rounded-b-[2rem] shadow-lg space-y-3">
      <div class="flex justify-between items-center pb-2 border-b border-emerald-700/40 text-xs">
        <button onclick="window.openMarketingCenter()" class="bg-amber-400/20 hover:bg-amber-400/30 text-amber-300 border border-amber-400/40 px-3 py-1.5 rounded-xl font-bold flex items-center gap-1.5 shadow-sm active:scale-95 transition">
          <span>📢 社区营销·自选海报</span>
        </button>
        <button onclick="window.openToolboxModal()" class="bg-white/10 hover:bg-white/20 text-emerald-100 border border-emerald-400/30 px-3 py-1.5 rounded-xl font-bold flex items-center gap-1.5 shadow-sm active:scale-95 transition">
          <span>🧰 常规百宝箱 ▾</span>
        </button>
      </div>

      <div class="flex justify-between items-start">
        <div class="space-y-1">
          <div class="flex items-center gap-2">
            <h1 id="store-title" class="text-base font-bold tracking-tight">合作便民老店</h1>
            <button onclick="window.openShopTypeModal()" id="shop-type-badge" class="bg-amber-400 text-stone-900 text-[10px] px-2.5 py-0.5 rounded-full font-bold flex items-center gap-1 shadow-sm active:scale-95 transition">
              <span>🏪 社区超市</span> ▾
            </button>
          </div>
          <div class="text-[11px] text-emerald-200 flex items-center gap-2 font-mono">
            <span>掌柜: <b id="store-boss" class="text-white">负责人</b></span>
            <span>供货总代: <b id="tenant-badge" class="text-emerald-100">BJ_SHUNDA</b></span>
          </div>
        </div>

        <button onclick="window.openReceiptsModal()" class="text-[11px] bg-emerald-800 hover:bg-emerald-700 text-emerald-100 border border-emerald-600/50 font-bold px-2.5 py-1.5 rounded-xl shadow-sm active:scale-95 transition">
          📜 单据/收条
        </button>
      </div>

      <div class="bg-emerald-950/60 p-3 rounded-2xl border border-emerald-700/40 space-y-1.5">
        <div class="flex justify-between items-center text-xs">
          <div>
            <span class="text-emerald-300 text-[10px] block font-medium">🤝 信任赊销周转金 (免息)</span>
            <b id="credit-avail" class="text-amber-300 font-mono text-base font-bold">¥2000.00</b>
          </div>
          <div class="text-center">
            <span class="text-emerald-300 text-[10px] block font-medium">借用周转筐</span>
            <b id="store-basket-count" class="text-amber-200 font-mono text-sm font-bold">0 个</b>
          </div>
          <div class="text-right">
            <span class="text-emerald-300 text-[10px] block font-medium">随车挂账总额</span>
            <b id="credit-debt" class="text-white font-mono text-sm font-bold">¥0.00</b>
          </div>
        </div>

        <div class="text-[10px] text-emerald-200/80 pt-1 border-t border-emerald-800/60 flex justify-between items-center">
          <span>跟车配送员: <b id="store-driver" class="text-white">老张师傅</b></span>
          <span class="text-amber-200">当面卸货清点 · 钱货两清</span>
        </div>
      </div>
    </header>

    <!-- 分类与卖点贴快筛 -->
    <div class="sticky top-0 z-10 bg-white border-b border-stone-100 p-2.5 space-y-1.5 shadow-sm">
      <div id="category-bar" class="flex gap-2 overflow-x-auto no-scrollbar text-xs"></div>
      <div id="quick-tag-pills" class="flex gap-1.5 overflow-x-auto no-scrollbar text-[11px] pt-0.5">
        <button onclick="window.filterBySpecialTag('全部')" class="tag-filter-chip bg-stone-800 text-white px-2.5 py-0.5 rounded-lg whitespace-nowrap font-bold">全部卖点</button>
        <button onclick="window.filterBySpecialTag('🔥 街坊抢手')" class="tag-filter-chip bg-stone-100 text-stone-600 px-2.5 py-0.5 rounded-lg whitespace-nowrap">🔥 街坊抢手</button>
        <button onclick="window.filterBySpecialTag('⏳ 临期捡漏')" class="tag-filter-chip bg-stone-100 text-stone-600 px-2.5 py-0.5 rounded-lg whitespace-nowrap">⏳ 临期捡漏</button>
        <button onclick="window.filterBySpecialTag('💎 高毛利')" class="tag-filter-chip bg-stone-100 text-stone-600 px-2.5 py-0.5 rounded-lg whitespace-nowrap">💎 高毛利</button>
        <button onclick="window.filterBySpecialTag('❄️ 需冷藏')" class="tag-filter-chip bg-stone-100 text-stone-600 px-2.5 py-0.5 rounded-lg whitespace-nowrap">❄️ 需冷藏</button>
      </div>
    </div>

    <!-- 货品列表 -->
    <main id="product-container" class="p-3 divide-y divide-stone-100 flex-1">
      <div class="p-12 text-center text-stone-400 text-xs">正在调取在售货单...</div>
    </main>

    <!-- 底部报单栏 -->
    <footer class="fixed bottom-0 max-w-md w-full bg-white/95 backdrop-blur-md border-t border-stone-200 p-3 space-y-2 z-20">
      <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5 text-[10px]">
        <span class="text-stone-400 whitespace-nowrap font-medium">📝 捎句话:</span>
        <div id="dynamic-notes-box" class="flex gap-1.5"></div>
      </div>

      <div class="flex justify-between items-center">
        <div>
          <div class="text-[10px] text-stone-400">进货合计:</div>
          <div class="text-emerald-950 font-mono font-bold text-xl leading-tight">
            ¥<span id="cart-total-amount">0.00</span>
          </div>
        </div>
        <button onclick="window.submitB2BOrder()" id="btn-submit-order" class="bg-[#064e3b] hover:bg-[#043327] text-white text-xs font-bold px-6 py-2.5 rounded-2xl shadow active:scale-95 transition flex items-center gap-2">
          <span>🚚 交代师父排单装车</span>
          <span id="cart-count-badge" class="bg-amber-400 text-stone-900 text-[10px] px-1.5 py-0.2 rounded-full font-mono font-bold">0</span>
        </button>
      </div>
    </footer>

  </div>

  <!-- 营销海报自定义定制弹窗（彻底解决点开无内容的问题） -->
  <div id="marketing-modal" class="hidden fixed inset-0 bg-black/85 backdrop-blur-sm z-50 flex items-center justify-center p-3">
    <div class="bg-white w-full max-w-sm rounded-3xl p-5 space-y-3.5 text-stone-800 shadow-2xl max-h-[90vh] overflow-y-auto no-scrollbar">
      <div class="flex justify-between items-center pb-2 border-b border-stone-100">
        <div>
          <h3 class="font-bold text-sm text-stone-800">🎨 自选海报风格与文案</h3>
          <p class="text-[10px] text-stone-400" id="flyer-prod-name">商品海报</p>
        </div>
        <button onclick="window.closeModal('marketing-modal')" class="text-stone-400 hover:text-stone-600 text-xl font-bold">✕</button>
      </div>

      <!-- 风格选择 -->
      <div class="space-y-1.5">
        <label class="text-[11px] font-bold text-stone-700 block">① 挑选海报风格模板：</label>
        <div id="style-selector-box" class="flex flex-wrap gap-1.5"></div>
      </div>

      <!-- 标题与价格自定义 -->
      <div class="grid grid-cols-2 gap-2 text-xs">
        <div>
          <label class="text-[10px] text-stone-500 block mb-1">自定义主标题：</label>
          <input type="text" id="flyer-title-input" oninput="window.renderLiveFlyerPreview()" class="w-full bg-stone-50 border border-stone-200 rounded-xl px-2.5 py-1.5 outline-none font-bold text-stone-800">
        </div>
        <div>
          <label class="text-[10px] text-stone-500 block mb-1">拼单参考价 (元)：</label>
          <input type="number" step="0.1" id="flyer-price-input" oninput="window.renderLiveFlyerPreview()" class="w-full bg-stone-50 border border-stone-200 rounded-xl px-2.5 py-1.5 outline-none font-mono font-bold text-rose-700">
        </div>
      </div>

      <!-- 海报实时预览区 -->
      <div class="rounded-2xl overflow-hidden border border-stone-200 shadow-sm">
        <img id="flyer-preview-img" src="" class="w-full object-cover">
      </div>

      <p class="text-[10px] text-stone-400 text-center">长按上方图片即可「发送给朋友」或保存至相册发圈</p>

      <button onclick="window.closeModal('marketing-modal')" class="w-full bg-[#064e3b] text-white font-bold py-2.5 rounded-xl text-xs active:scale-95 transition">
        做妥完成 · 返回货单
      </button>
    </div>
  </div>

  <!-- 店型点选 -->
  <div id="shop-type-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-3">
    <div class="bg-white w-full max-w-sm rounded-3xl p-5 space-y-3.5 text-stone-800 shadow-2xl">
      <div class="flex justify-between items-center pb-2 border-b border-stone-100">
        <h3 class="font-bold text-sm text-stone-800">🏪 点选本店经营形态</h3>
        <button onclick="window.closeModal('shop-type-modal')" class="text-stone-400 text-lg">✕</button>
      </div>
      <div class="grid grid-cols-2 gap-2 text-xs">
        <button onclick="window.selectShopType('社区超市')" class="p-3 rounded-2xl border border-stone-200 hover:border-emerald-600 hover:bg-emerald-50 text-left">
          <span class="text-xl">🏪</span><b class="block text-stone-800">社区超市</b><span class="text-[10px] text-stone-400">整箱走量·邻里拼单</span>
        </button>
        <button onclick="window.selectShopType('餐饮饭店')" class="p-3 rounded-2xl border border-stone-200 hover:border-amber-600 hover:bg-amber-50 text-left">
          <span class="text-xl">🍳</span><b class="block text-stone-800">餐饮饭店</b><span class="text-[10px] text-stone-400">大客优惠·良心食材</span>
        </button>
        <button onclick="window.selectShopType('精品商超')" class="p-3 rounded-2xl border border-stone-200 hover:border-emerald-600 hover:bg-emerald-50 text-left">
          <span class="text-xl">🏬</span><b class="block text-stone-800">精品商超</b><span class="text-[10px] text-stone-400">品牌直供·保真高毛利</span>
        </button>
        <button onclick="window.selectShopType('便利小铺')" class="p-3 rounded-2xl border border-stone-200 hover:border-emerald-600 hover:bg-emerald-50 text-left">
          <span class="text-xl">🏮</span><b class="block text-stone-800">便利小铺</b><span class="text-[10px] text-stone-400">拆件快销·避峰配送</span>
        </button>
      </div>
    </div>
  </div>

  <!-- 百宝箱 -->
  <div id="toolbox-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-3">
    <div class="bg-white w-full max-w-sm rounded-3xl p-5 space-y-4 text-stone-800 shadow-2xl">
      <div class="flex justify-between items-center pb-2 border-b border-stone-100">
        <h3 class="font-bold text-sm text-stone-800">🧰 掌柜常规百宝箱</h3>
        <button onclick="window.closeModal('toolbox-modal')" class="text-stone-400 text-lg">✕</button>
      </div>
      <div class="grid grid-cols-2 gap-2.5 text-xs">
        <button onclick="window.openReturnModal()" class="p-3 rounded-2xl bg-amber-50 hover:bg-amber-100 border border-amber-200 flex flex-col items-center gap-1 text-amber-900 active:scale-95">
          <span class="text-2xl">🔄</span><b class="text-xs">破损/调换货申报</b><span class="text-[9px] text-amber-700">坏包漏液·随车退减</span>
        </button>
        <button onclick="window.openModal('bind-agent-modal'); window.closeModal('toolbox-modal');" class="p-3 rounded-2xl bg-stone-50 hover:bg-stone-100 border border-stone-200 flex flex-col items-center gap-1 text-stone-800 active:scale-95">
          <span class="text-2xl">🏢</span><b class="text-xs">更换供货总代</b><span class="text-[9px] text-stone-400">切换认领码/手机号</span>
        </button>
        <button onclick="window.openReceiptsModal(); window.closeModal('toolbox-modal');" class="p-3 rounded-2xl bg-stone-50 hover:bg-stone-100 border border-stone-200 flex flex-col items-center gap-1 text-stone-800 active:scale-95">
          <span class="text-2xl">📜</span><b class="text-xs">单据与电子收条</b><span class="text-[9px] text-stone-400">历史报单·师傅已收款</span>
        </button>
        <button onclick="window.callDriver()" class="p-3 rounded-2xl bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 flex flex-col items-center gap-1 text-emerald-950 active:scale-95">
          <span class="text-2xl">📞</span><b class="text-xs">致电跟车师傅</b><span class="text-[9px] text-emerald-700">查问车次到店时间</span>
        </button>
      </div>
    </div>
  </div>

  <!-- 调换货 -->
  <div id="return-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-3">
    <div class="bg-white w-full max-w-sm rounded-3xl p-5 space-y-3.5 text-stone-800 shadow-2xl">
      <div class="flex justify-between items-center pb-2 border-b border-stone-100">
        <h3 class="font-bold text-sm text-stone-800">🔄 随车破损 / 调换货申报</h3>
        <button onclick="window.closeModal('return-modal')" class="text-stone-400 text-lg">✕</button>
      </div>
      <div class="space-y-2.5 text-xs">
        <div>
          <label class="block text-stone-600 font-bold mb-1">申报调换商品全名 *：</label>
          <input type="text" id="return-prod-name" placeholder="例：金龙鱼调和油 5L (漏油)" class="w-full bg-stone-50 border border-stone-200 rounded-xl px-3 py-2 outline-none">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-stone-500 mb-1">数量 (箱/件) *：</label>
            <input type="number" id="return-qty" value="1" min="1" class="w-full bg-stone-50 border border-stone-200 rounded-xl px-2.5 py-1.5 font-mono outline-none">
          </div>
          <div>
            <label class="block text-stone-500 mb-1">问题原因：</label>
            <select id="return-reason" class="w-full bg-stone-50 border border-stone-200 rounded-xl px-2.5 py-1.5 outline-none">
              <option value="外箱破损/漏液">外箱破损/漏液</option>
              <option value="临期变质/生虫">临期变质/生虫</option>
              <option value="送错货品">送错货品</option>
            </select>
          </div>
        </div>
        <div>
          <label class="block text-stone-500 mb-1">情况备注：</label>
          <input type="text" id="return-remark" placeholder="例：原箱封条完好，请师傅带回" class="w-full bg-stone-50 border border-stone-200 rounded-xl px-3 py-1.5 outline-none">
        </div>
      </div>
      <div class="flex gap-2 pt-2 border-t border-stone-100">
        <button onclick="window.submitReturnRequest()" class="flex-1 bg-amber-600 hover:bg-amber-700 text-white font-bold py-2.5 rounded-2xl text-xs shadow active:scale-95 transition">
          登记通知师傅核退
        </button>
        <button onclick="window.closeModal('return-modal')" class="bg-stone-100 text-stone-600 font-bold px-4 py-2.5 rounded-2xl text-xs">
          取消
        </button>
      </div>
    </div>
  </div>

  <!-- 单据收条 -->
  <div id="receipts-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-3">
    <div class="bg-white w-full max-w-sm rounded-3xl p-5 space-y-3.5 text-stone-800 shadow-2xl max-h-[85vh] overflow-y-auto no-scrollbar">
      <div class="flex justify-between items-center pb-2 border-b border-stone-100">
        <h3 class="font-bold text-sm text-stone-800">📜 进货单据与付款收条</h3>
        <button onclick="window.closeModal('receipts-modal')" class="text-stone-400 text-lg">✕</button>
      </div>
      <div class="space-y-2">
        <b class="text-xs text-stone-700 block">🚚 进货报单记录</b>
        <div id="my-orders-list" class="space-y-2 text-xs"></div>
      </div>
      <div class="space-y-2 pt-2 border-t border-stone-100">
        <b class="text-xs text-stone-700 block">🧾 师傅收款电子收条</b>
        <div id="my-receipts-list" class="space-y-2 text-xs"></div>
      </div>
    </div>
  </div>

  <!-- 绑定总代 -->
  <div id="bind-agent-modal" class="hidden fixed inset-0 bg-stone-900/80 backdrop-blur-sm z-50 flex items-center justify-center p-3">
    <div class="bg-white w-full max-w-sm rounded-3xl p-5 space-y-3 text-stone-800 shadow-2xl">
      <div class="flex justify-between items-center pb-2 border-b border-stone-100">
        <h3 class="font-bold text-sm text-stone-800">🏪 绑定供货总代</h3>
        <button onclick="window.closeModal('bind-agent-modal')" class="text-stone-400 text-lg">✕</button>
      </div>
      <div class="space-y-3 text-xs">
        <div class="p-3 bg-stone-50 border border-stone-200 rounded-2xl space-y-1.5">
          <label class="block font-bold text-stone-700 text-xs">方式 1：输入总代 6 位认领码</label>
          <div class="flex gap-2">
            <input type="text" id="bind-input-code" placeholder="如 888001" maxlength="6" class="flex-1 bg-white border border-stone-200 rounded-xl px-3 py-1.5 font-mono text-center font-bold text-emerald-800 outline-none">
            <button onclick="window.bindByCode()" class="bg-[#064e3b] text-white font-bold px-3 py-1.5 rounded-xl">验证</button>
          </div>
        </div>
        <div class="p-3 bg-stone-50 border border-stone-200 rounded-2xl space-y-1.5">
          <label class="block font-bold text-stone-700 text-xs">方式 2：输入建档手机号</label>
          <div class="flex gap-2">
            <input type="tel" id="bind-input-phone" placeholder="输入 11 位手机号" maxlength="11" class="flex-1 bg-white border border-stone-200 rounded-xl px-3 py-1.5 font-mono text-xs outline-none">
            <button onclick="window.bindByPhone()" class="bg-amber-600 text-white font-bold px-3 py-1.5 rounded-xl">认领</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <canvas id="hidden-canvas" class="hidden"></canvas>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
