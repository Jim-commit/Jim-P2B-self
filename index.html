<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>便利店掌櫃進貨與社群帶貨終端</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;900&display=swap" rel="stylesheet">
  <style>
    .font-serif-sc { font-family: 'Noto Serif SC', serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-stone-100 text-stone-800 font-sans pb-28 min-h-screen">
  
  <div class="max-w-md mx-auto min-h-screen flex flex-col bg-white shadow-xl relative">
    
    <!-- 頂部店鋪牌匾與總代狀態 -->
    <header class="bg-[#064e3b] text-white p-4 pt-5 rounded-b-3xl shadow-md">
      <div class="flex justify-between items-start">
        <div>
          <div class="flex items-center gap-2">
            <h1 id="store-title" class="text-base font-bold tracking-tight">利民平價便利店</h1>
            <span id="tenant-badge" class="bg-white/20 text-white text-[10px] px-2 py-0.5 rounded-full font-mono">
              BJ_SHUNDA
            </span>
          </div>
          <div class="text-[11px] text-emerald-200 mt-1 flex items-center gap-2">
            <span>掌櫃: <b id="store-boss">王掌櫃</b></span>
            <span>跟車師傅: <b id="store-driver">老張師傅</b></span>
          </div>
        </div>
        <button onclick="window.openModal('bind-agent-modal')" class="text-[10px] bg-white/10 hover:bg-white/20 text-emerald-100 border border-emerald-400/30 px-2.5 py-1 rounded-xl">
          換供貨總代
        </button>
      </div>

      <!-- 免息周轉金看板 -->
      <div class="mt-4 bg-emerald-950/40 p-3 rounded-2xl flex justify-between items-center text-xs border border-emerald-700/30">
        <div>
          <span class="text-emerald-300 text-[10px] block">可用免息周轉金 (賒銷賬期)</span>
          <b id="credit-avail" class="text-amber-300 font-mono text-base">¥2000.00</b>
        </div>
        <div class="text-right">
          <span class="text-emerald-300 text-[10px] block">累計已掛賬 (隨車結清)</span>
          <b id="credit-debt" class="text-white font-mono">¥0.00</b>
        </div>
      </div>
    </header>

    <!-- 分類水平滑動欄 -->
    <div id="category-bar" class="flex gap-2 p-3 overflow-x-auto no-scrollbar border-b border-stone-100 bg-white sticky top-0 z-10 text-xs">
      <button onclick="window.filterCategory('全部')" class="cat-pill bg-[#064e3b] text-white px-3 py-1.5 rounded-xl font-bold whitespace-nowrap">
        全部現貨
      </button>
      <!-- 動態載入分類 -->
    </div>

    <!-- 商品列表容器 -->
    <main id="product-container" class="p-3 divide-y divide-stone-100 flex-1">
      <div class="p-8 text-center text-stone-400 text-xs">
        正在查驗總代在庫現貨...
      </div>
    </main>

    <!-- 底部常駐下單報單條 -->
    <footer class="fixed bottom-0 max-w-md w-full bg-white/95 backdrop-blur-md border-t border-stone-200 p-3 flex justify-between items-center z-20">
      <div>
        <div class="text-[10px] text-stone-400">進貨合計:</div>
        <div class="text-emerald-900 font-mono font-bold text-lg">
          ¥<span id="cart-total-amount">0.00</span>
        </div>
      </div>
      <button onclick="window.submitB2BOrder()" id="btn-submit-order" class="bg-[#064e3b] text-white text-xs font-bold px-5 py-3 rounded-2xl shadow active:scale-95 transition flex items-center gap-1.5">
        <span>🚚 給跟車師傅報單</span>
        <span id="cart-count-badge" class="bg-amber-400 text-stone-900 text-[10px] px-1.5 py-0.2 rounded-full font-mono">0</span>
      </button>
    </footer>

  </div>

  <!-- 彈窗 1：街坊宣傳單生成預覽彈窗 -->
  <div id="flyer-modal" class="hidden fixed inset-0 bg-black/90 backdrop-blur-sm z-50 flex flex-col items-center justify-center p-4">
    <div class="bg-white w-full max-w-sm rounded-3xl p-4 text-center space-y-3">
      <h3 class="font-bold text-sm text-stone-800">📲 街坊宣傳單已做妥！</h3>
      <p class="text-[11px] text-stone-500">長按圖片直接「發送給朋友」或保存轉發小區業主群</p>
      
      <div class="rounded-2xl overflow-hidden border border-stone-200 shadow-md">
        <img id="flyer-preview-img" src="" class="w-full object-cover">
      </div>

      <button onclick="window.closeModal('flyer-modal')" class="w-full bg-stone-100 hover:bg-stone-200 text-stone-700 font-bold py-2 rounded-xl text-xs">
        關閉返回
      </button>
    </div>
  </div>

  <!-- 彈窗 2：綁定供貨商 -->
  <div id="bind-agent-modal" class="hidden fixed inset-0 bg-stone-900/80 backdrop-blur-sm z-50 flex items-center justify-center p-3">
    <div class="bg-white w-full max-w-sm rounded-3xl p-5 space-y-4 text-stone-800 shadow-2xl">
      <div class="flex justify-between items-center pb-2 border-b border-stone-100">
        <div>
          <h3 class="font-bold text-sm text-stone-800">🏪 綁定供貨總代</h3>
          <p class="text-[10px] text-stone-400">認准專屬總代，享受特約進貨價與賬期</p>
        </div>
        <button onclick="window.closeModal('bind-agent-modal')" class="text-stone-400 hover:text-stone-600 text-lg">✕</button>
      </div>

      <div class="space-y-3 text-xs">
        <div class="p-3 bg-stone-50 border border-stone-200 rounded-2xl space-y-1.5">
          <label class="block font-bold text-stone-700 text-xs">方式 1：輸入總代 6 位認領碼</label>
          <div class="flex gap-2">
            <input type="text" id="bind-input-code" placeholder="如 888001" maxlength="6" class="flex-1 bg-white border border-stone-200 rounded-xl px-3 py-1.5 font-mono text-center font-bold tracking-widest text-emerald-800 outline-none">
            <button onclick="window.bindByCode()" class="bg-[#064e3b] text-white text-xs font-bold px-3 py-1.5 rounded-xl active:scale-95">認證</button>
          </div>
        </div>

        <div class="p-3 bg-stone-50 border border-stone-200 rounded-2xl space-y-1.5">
          <label class="block font-bold text-stone-700 text-xs">方式 2：輸入掌櫃登記手機號</label>
          <div class="flex gap-2">
            <input type="tel" id="bind-input-phone" placeholder="輸入手機號一鍵認領小店" maxlength="11" class="flex-1 bg-white border border-stone-200 rounded-xl px-3 py-1.5 font-mono text-xs outline-none">
            <button onclick="window.bindByPhone()" class="bg-amber-600 text-white text-xs font-bold px-3 py-1.5 rounded-xl active:scale-95">認領</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <canvas id="hidden-canvas" class="hidden"></canvas>

  <script type="module">
    import { supabase } from './src/lib/supabase.js';

    let currentAgent = localStorage.getItem('active_agent') || 'BJ_SHUNDA';
    let currentStore = null;
    let allProducts = [];
    let currentCategory = '全部';
    const cart = {};

    window.openModal = id => document.getElementById(id).classList.remove('hidden');
    window.closeModal = id => document.getElementById(id).classList.add('hidden');

    async function initTerminal() {
      const urlParams = new URLSearchParams(window.location.search);
      const urlAgent = urlParams.get('agent') || urlParams.get('tenant');
      if (urlAgent) {
        currentAgent = urlAgent;
        localStorage.setItem('active_agent', currentAgent);
      }

      document.getElementById('tenant-badge').innerText = currentAgent;

      // 抓小店數據
      const { data: stores } = await supabase.from('store').select('*').eq('tenant_id', currentAgent).limit(1);
      if (stores && stores.length > 0) {
        currentStore = stores[0];
        document.getElementById('store-title').innerText = currentStore.name || '合作便利店';
        document.getElementById('store-boss').innerText = currentStore.contact || '掌櫃';
        document.getElementById('store-driver').innerText = currentStore.driver_name || '送貨師傅';
        
        const limit = parseFloat(currentStore.credit_limit || 2000);
        const debt = parseFloat(currentStore.current_debt || 0);
        document.getElementById('credit-avail').innerText = `¥${Math.max(0, limit - debt).toFixed(2)}`;
        document.getElementById('credit-debt').innerText = `¥${debt.toFixed(2)}`;
      }

      // 抓總代在庫在售商品
      const { data: prods } = await supabase
        .from('product')
        .select('*')
        .eq('tenant_id', currentAgent)
        .neq('status', 'inactive')
        .order('id', { ascending: false });

      let rawProds = prods || [];

      // 進貨特權過濾
      if (currentStore && currentStore.visible_product_ids && Array.isArray(currentStore.visible_product_ids) && currentStore.visible_product_ids.length > 0) {
        allProducts = rawProds.filter(p => currentStore.visible_product_ids.includes(p.id));
      } else {
        allProducts = rawProds;
      }

      renderCategoryTabs();
      renderProductList();
    }

    function renderCategoryTabs() {
      const categories = ['全部', ...new Set(allProducts.map(p => p.category_main).filter(Boolean))];
      const bar = document.getElementById('category-bar');
      bar.innerHTML = categories.map(c => `
        <button onclick="window.filterCategory('${c}')" class="cat-pill ${c === currentCategory ? 'bg-[#064e3b] text-white' : 'bg-stone-100 text-stone-600'} px-3 py-1.5 rounded-xl font-bold whitespace-nowrap transition">
          ${c === '全部' ? '全部現貨' : c}
        </button>
      `).join('');
    }

    window.filterCategory = function(cat) {
      currentCategory = cat;
      renderCategoryTabs();
      renderProductList();
    };

    function renderProductList() {
      const filtered = currentCategory === '全部' 
        ? allProducts 
        : allProducts.filter(p => p.category_main === currentCategory);

      const container = document.getElementById('product-container');
      if (filtered.length === 0) {
        container.innerHTML = '<div class="p-8 text-center text-stone-400 text-xs">總代暫無此類別在供商品</div>';
        return;
      }

      container.innerHTML = filtered.map(p => {
        const imgHtml = p.image_url 
          ? `<img src="${p.image_url}" class="w-14 h-14 rounded-2xl object-cover border border-stone-200 shadow-sm">`
          : `<div class="w-14 h-14 rounded-2xl bg-stone-100 border border-stone-200 flex items-center justify-center text-[10px] text-stone-400">無圖</div>`;

        const tags = Array.isArray(p.tags) ? p.tags : [];
        const tagHtml = tags.map(t => `<span class="bg-amber-50 text-amber-900 border border-amber-200 text-[9px] px-1.5 py-0.2 rounded font-medium">${t}</span>`).join(' ');

        return `
          <div class="py-3 px-1 space-y-2">
            <div class="flex justify-between items-center gap-3">
              <div class="flex items-center gap-3">
                ${imgHtml}
                <div>
                  <div class="flex items-center gap-1.5">
                    <span class="font-bold text-xs text-stone-800">${p.name}</span>
                  </div>
                  <div class="mt-0.5 space-x-1">${tagHtml}</div>
                  <div class="text-[11px] text-stone-400 mt-0.5 font-mono">
                    ${p.spec || '整箱'}
                  </div>
                  <div class="text-xs font-bold text-emerald-800 mt-0.5 font-mono">
                    ¥${p.tier_1_price} <span class="text-[10px] text-stone-400 font-normal">/${p.pack_unit || '箱'}</span>
                  </div>
                </div>
              </div>

              <!-- 加減件 -->
              <div class="flex items-center gap-2">
                <button onclick="window.changeQty(${p.id}, -1)" class="w-7 h-7 rounded-xl bg-stone-100 active:scale-95 font-bold text-stone-600 flex items-center justify-center text-sm">-</button>
                <span id="qty-${p.id}" class="w-6 text-center font-bold text-xs font-mono">${cart[p.id] || 0}</span>
                <button onclick="window.changeQty(${p.id}, 1)" class="w-7 h-7 rounded-xl bg-emerald-50 text-emerald-800 active:scale-95 font-bold flex items-center justify-center text-sm">+</button>
              </div>
            </div>

            <!-- 掌櫃帶貨工具按鈕 (做張街坊宣傳單) -->
            <div class="flex justify-end pt-1">
              <button onclick="window.generateFlyer(${p.id})" class="text-[10px] bg-emerald-50 hover:bg-emerald-100 text-emerald-900 border border-emerald-200 px-2.5 py-1 rounded-xl font-bold flex items-center gap-1 active:scale-95 transition">
                📲 做張街坊宣傳單 (老鄰居拼單)
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    window.changeQty = function(id, delta) {
      cart[id] = (cart[id] || 0) + delta;
      if (cart[id] < 0) cart[id] = 0;
      const el = document.getElementById(`qty-${id}`);
      if (el) el.innerText = cart[id];
      updateCartSummary();
    };

    function updateCartSummary() {
      let totalAmount = 0;
      let totalCount = 0;
      for (const [id, qty] of Object.entries(cart)) {
        if (qty > 0) {
          const prod = allProducts.find(x => x.id === parseInt(id));
          if (prod) {
            totalAmount += prod.tier_1_price * qty;
            totalCount += qty;
          }
        }
      }
      document.getElementById('cart-total-amount').innerText = totalAmount.toFixed(2);
      document.getElementById('cart-count-badge').innerText = totalCount;
    }

    // 核心亮點：前端一鍵生成【街坊宣傳單 / 老鄰居拼單圖】
    window.generateFlyer = function(prodId) {
      const prod = allProducts.find(x => x.id === prodId);
      if (!prod) return;

      const shopName = currentStore ? currentStore.name : '小區便利店';
      const canvas = document.getElementById('hidden-canvas');
      const ctx = canvas.getContext('2d');

      canvas.width = 600;
      canvas.height = 800;

      // 1. 溫暖復古底色
      ctx.fillStyle = '#fefdfa';
      ctx.fillRect(0, 0, 600, 800);

      // 2. 頂部店名牌匾
      ctx.fillStyle = '#064e3b';
      ctx.fillRect(30, 30, 540, 100);
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 28px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(`【${shopName}】街坊好貨通告`, 300, 75);
      ctx.font = '16px sans-serif';
      ctx.fillStyle = '#a7f3d0';
      ctx.fillText('實體老店誠信背書 · 正品保證 · 隨時到店取貨', 300, 108);

      // 3. 商品主圖繪製
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = function() {
        ctx.drawImage(img, 100, 160, 400, 320);
        drawFlyerText();
      };
      img.onerror = function() {
        ctx.fillStyle = '#e5e7eb';
        ctx.fillRect(100, 160, 400, 320);
        ctx.fillStyle = '#9ca3af';
        ctx.font = '24px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('實物好貨實拍', 300, 320);
        drawFlyerText();
      };
      img.src = prod.image_url || '';

      function drawFlyerText() {
        // 商品名稱
        ctx.fillStyle = '#1c1917';
        ctx.font = 'bold 28px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(prod.name, 300, 520);

        // 規格與特色
        ctx.fillStyle = '#78716c';
        ctx.font = '18px sans-serif';
        ctx.fillText(`規格：${prod.spec || '整箱'} · 廠家直通平價直供`, 300, 555);

        // 街坊拼單價
        ctx.fillStyle = '#991b1b';
        ctx.font = 'bold 40px sans-serif';
        ctx.fillText(`老鄰居拼單價：¥${(prod.tier_1_price * 1.15).toFixed(1)}`, 300, 620);

        // 底部掌櫃承諾框
        ctx.fillStyle = '#fef3c7';
        ctx.fillRect(50, 660, 500, 90);
        ctx.strokeStyle = '#f59e0b';
        ctx.lineWidth = 2;
        ctx.strokeRect(50, 660, 500, 90);

        ctx.fillStyle = '#92400e';
        ctx.font = 'bold 18px sans-serif';
        ctx.fillText('💬 掌櫃交代：好貨不多，先到先得！', 300, 700);
        ctx.font = '14px sans-serif';
        ctx.fillStyle = '#b45309';
        ctx.fillText('在小區群裡直接回覆「我要1件」即可留貨！', 300, 728);

        document.getElementById('flyer-preview-img').src = canvas.toDataURL('image/jpeg', 0.85);
        window.openModal('flyer-modal');
      }
    };

    window.submitB2BOrder = async function() {
      const totalAmount = parseFloat(document.getElementById('cart-total-amount').innerText);
      if (totalAmount <= 0) return alert('請先添加進貨商品件數！');

      const btn = document.getElementById('btn-submit-order');
      btn.disabled = true;
      btn.innerText = '正在轉告跟車師傅...';

      try {
        if (currentStore) {
          const newDebt = parseFloat(currentStore.current_debt || 0) + totalAmount;
          await supabase.from('store').update({ current_debt: newDebt }).eq('id', currentStore.id);
        }

        alert(`🎉 報單成功！合計 ¥${totalAmount.toFixed(2)}。\n已成功發送給隨車師傅【${document.getElementById('store-driver').innerText}】，庫房排單裝車中！`);
        for (const k of Object.keys(cart)) cart[k] = 0;
        renderProductList();
        updateCartSummary();
        initTerminal();
      } catch (err) {
        alert('報單失敗：' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<span>🚚 給跟車師傅報單</span> <span id="cart-count-badge" class="bg-amber-400 text-stone-900 text-[10px] px-1.5 py-0.2 rounded-full font-mono">0</span>`;
      }
    };

    window.bindByCode = function() {
      const code = document.getElementById('bind-input-code').value.trim();
      if (code === '888001') {
        currentAgent = 'BJ_SHUNDA';
      } else if (code === '888002') {
        currentAgent = 'SH_LEGOU';
      } else {
        return alert('認領碼無效！');
      }
      localStorage.setItem('active_agent', currentAgent);
      alert('已成功綁定專屬總代！');
      window.closeModal('bind-agent-modal');
      initTerminal();
    };

    window.bindByPhone = async function() {
      const phone = document.getElementById('bind-input-phone').value.trim();
      if (!phone || phone.length < 11) return alert('請輸入有效 11 位掌櫃手機號！');

      const { data: stores } = await supabase.from('store').select('*').eq('phone', phone).limit(1);
      if (stores && stores.length > 0) {
        currentAgent = stores[0].tenant_id || 'BJ_SHUNDA';
        localStorage.setItem('active_agent', currentAgent);
        alert(`🎉 認領成功！歡迎【${stores[0].name}】掌櫃！`);
        window.closeModal('bind-agent-modal');
        initTerminal();
      } else {
        alert('未在總代名冊中查到該手機號，請交由隨車師傅在中台開立名冊。');
      }
    };

    initTerminal();
  </script>
</body>
</html>
