<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>商道相通 · 门店掌中宝</title>
  <link rel="stylesheet" href="./src/styles/sdxtUnifiedTheme.css" />
  <style>
    body.sdxt-large-font { font-size: 16.5px; }
    body.sdxt-large-font .sdxt-input,
    body.sdxt-large-font .sdxt-btn,
    body.sdxt-large-font .sdxt-pill { font-size: 15px; }
    body.sdxt-large-font .sdxt-kpi-val { font-size: 21px; }
    .h-scroll { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
    .h-scroll::-webkit-scrollbar { display: none; }
  </style>
</head>
<body>

  <main class="sdxt-container">
    <!-- 墨玉深森林绿手机驾驶舱（掌中宝单手指挥舱） -->
    <header class="sdxt-forest-cockpit">
      <div class="sdxt-cockpit-row">
        <button type="button" class="sdxt-gold-pill" id="btn-store-switcher">
          <span>🏪</span>
          <span id="ui-store-name">门店掌中宝</span>
          <span id="ui-store-caret" class="hidden">▼</span>
        </button>
        <div style="display:flex;align-items:center;gap:5px;flex-wrap:wrap;">
          <button type="button" class="sdxt-forest-pill" id="btn-toggle-large-font">🔍 大字</button>
          <a href="./store.html" class="sdxt-forest-pill" style="text-decoration:none;">🖥️ 全面版</a>
          <button type="button" class="sdxt-forest-pill" id="btn-boss-lock">🔒 锁屏</button>
          <button type="button" class="sdxt-forest-pill" id="btn-quick-guide">💡 指引</button>
        </div>
      </div>

      <div class="sdxt-cockpit-meta">
        <span>当值执事：<strong id="ui-staff-name" style="color:#ffffff;">掌柜(本人)</strong></span>
        <div style="display:flex;align-items:center;gap:8px;">
          <a href="javascript:void(0)" id="btn-quick-backup-link" style="color:#fbbf24;text-decoration:none;font-weight:700;">💾 快捷备份</a>
          <span>门店：<strong id="ui-store-code" style="color:#fde68a;">STORE_1</strong></span>
        </div>
      </div>

      <div class="sdxt-role-bar">
        <span style="font-size:12px;font-weight:700;color:#fde68a;white-space:nowrap;">👑 掌柜切换视角：</span>
        <select id="select-staff-role" class="sdxt-role-select"></select>
      </div>
    </header>

    <!-- 防丢备份提醒条 -->
    <div id="ui-backup-toast" class="sdxt-status-banner warn hidden" style="margin-bottom:12px;">
      <span>💾 账本已有新流水，1秒发微信文件传输助手防丢</span>
      <button type="button" class="sdxt-btn sdxt-btn-gold" style="padding:5px 12px;font-size:12px;" id="btn-quick-share-backup">立即备份</button>
    </div>

    <!-- 跨端凑单开产横幅挂载点 -->
    <div id="co-production-banner-slot"></div>

    <!-- ==================== 视图 0：掌中宝移动指挥舱首页 ==================== -->
    <section id="view-palm">
      <div class="sdxt-kpi-trio">
        <div class="sdxt-kpi-box">
          <div class="sdxt-kpi-label" id="kpi-lbl-stock">在架商品货值</div>
          <div class="sdxt-kpi-val" id="kpi-val-stock">¥0</div>
        </div>
        <div class="sdxt-kpi-box pink">
          <div class="sdxt-kpi-label" id="kpi-lbl-debt">熟客在账赊欠</div>
          <div class="sdxt-kpi-val" id="kpi-val-debt">¥0</div>
        </div>
        <div class="sdxt-kpi-box mint">
          <div class="sdxt-kpi-label">今日已交割实收</div>
          <div class="sdxt-kpi-val" id="kpi-val-sales">¥0</div>
        </div>
      </div>

      <div class="sdxt-card">
        <div class="sdxt-card-title">
          <span>⚡ 掌柜掌上快捷收银与定价</span>
          <button type="button" class="sdxt-pill" style="padding:3px 9px;font-size:11px;" id="btn-palm-refresh">↻ 刷新</button>
        </div>
        <div class="sdxt-grid-2" style="margin-bottom:10px;">
          <button type="button" class="sdxt-btn sdxt-btn-primary" id="palm-go-pos">💰 柜台极速收银</button>
          <button type="button" class="sdxt-btn sdxt-btn-gold" id="palm-go-add">+ 建档与定价</button>
          <button type="button" class="sdxt-btn sdxt-btn-ghost" id="palm-go-supply">🚚 上游进货订货</button>
          <button type="button" class="sdxt-btn sdxt-btn-ghost" id="palm-go-members">📒 熟客赊欠催收</button>
        </div>
        <div id="ui-palm-health-tip" style="font-size:13px;color:var(--sdxt-muted);text-align:center;padding:12px 8px;background:#faf9f6;border-radius:12px;">
          🌿 账实严丝合缝，可在顶部下拉切换任意一线岗位巡检，或进入电脑全面版工作台！
        </div>
      </div>

      <div class="sdxt-card" style="display:flex;align-items:center;justify-content:space-between;gap:10px;">
        <div>
          <div style="font-weight:800;font-size:14px;color:var(--sdxt-ink);">需要配置阶梯批发价、多店调拨或大屏轮播？</div>
          <div style="font-size:12px;color:var(--sdxt-muted);margin-top:2px;">支持随时切入电脑全面版百业调度工作台</div>
        </div>
        <a href="./store.html" class="sdxt-btn sdxt-btn-primary" style="white-space:nowrap;text-decoration:none;">进完整工作台 →</a>
      </div>
    </section>

    <!-- ==================== 视图 1：手机端快速查货与建档 ==================== -->
    <section id="view-shelf" class="hidden">
      <div class="sdxt-card" style="padding:12px;">
        <div style="display:flex;gap:8px;">
          <input id="shelf-search-input" class="sdxt-input" placeholder="🔍 搜名称 / 扫条码 / 秤号查价..." />
          <button type="button" class="sdxt-btn sdxt-btn-primary" id="btn-open-add-item">+ 建档</button>
        </div>
      </div>
      <div id="ui-shelf-list"></div>
    </section>

    <!-- ==================== 视图 2：手机端移动极速收银台 ==================== -->
    <section id="view-pos" class="hidden">
      <div class="sdxt-card">
        <div style="display:flex;gap:6px;margin-bottom:8px;">
          <input id="pos-universal-input" class="sdxt-input" placeholder="扫条码 / 称重签 / 输 品名*重量" />
          <button type="button" class="sdxt-btn sdxt-btn-ghost" id="btn-pos-scan-confirm">添加</button>
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;">
          <button type="button" class="sdxt-pill" id="btn-select-pos-member">👤 <span id="ui-selected-mem-label">选熟客/会员</span></button>
          <button type="button" class="sdxt-pill" id="btn-undo-sale">↩️ 撤回上笔</button>
          <button type="button" class="sdxt-pill" id="btn-show-payqr">💳 收款码</button>
        </div>

        <div id="ui-pos-cart-list" style="min-height:80px;border-top:1px solid var(--sdxt-line);border-bottom:1px solid var(--sdxt-line);padding:8px 0;margin-bottom:10px;"></div>

        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
          <span style="font-size:13px;color:var(--sdxt-muted);">应收合计 <span id="ui-pos-discount-tip" style="color:#d97706;font-weight:700;"></span></span>
          <span style="font-size:28px;font-weight:900;color:#be123c;">¥<span id="ui-pos-payable">0.00</span></span>
        </div>

        <div class="sdxt-grid-3">
          <button type="button" class="sdxt-btn sdxt-btn-ok" data-pay="wechat">微信收款</button>
          <button type="button" class="sdxt-btn sdxt-btn-primary" data-pay="alipay">支付宝</button>
          <button type="button" class="sdxt-btn sdxt-btn-ghost" data-pay="cash">现金收款</button>
        </div>
        <div class="sdxt-grid-2" style="margin-top:8px;">
          <button type="button" class="sdxt-btn sdxt-btn-ghost" data-pay="credit">记熟客赊账</button>
          <button type="button" class="sdxt-btn sdxt-btn-ghost hidden" id="btn-pay-balance" data-pay="balance">会员卡扣款</button>
        </div>
      </div>
    </section>

    <!-- ==================== 视图 3：手机端缺货补货与签收入库 ==================== -->
    <section id="view-supply" class="hidden">
      <div class="sdxt-card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <span style="font-weight:800;font-size:14px;">🚚 快捷补货与到货签收</span>
          <button type="button" class="sdxt-btn sdxt-btn-primary" style="padding:6px 12px;font-size:12px;" id="btn-import-lowstock-po">⚡ 导入缺货订货</button>
        </div>
        <div id="ui-purchase-cart-box" style="background:#faf9f6;border-radius:12px;padding:10px;margin-bottom:10px;"></div>
        <div id="ui-po-order-list"></div>
      </div>
    </section>

    <!-- ==================== 视图 4：手机端熟客挂账与积木会员 ==================== -->
    <section id="view-members" class="hidden">
      <div class="sdxt-card" style="display:flex;gap:8px;">
        <input id="member-search-input" class="sdxt-input" placeholder="搜客户姓名 / 手机号..." />
        <button type="button" class="sdxt-btn sdxt-btn-primary" id="btn-add-member">+ 新熟客</button>
      </div>
      <div id="ui-member-list"></div>
    </section>
  </main>

  <!-- 手机底部悬浮导航栏 -->
  <nav class="sdxt-tabbar">
    <button type="button" class="sdxt-tab active" data-tab="palm"><span>🧭</span><span>掌中宝</span></button>
    <button type="button" class="sdxt-tab" data-tab="shelf"><span>🏷️</span><span id="nav-lbl-shelf">货架</span></button>
    <button type="button" class="sdxt-tab" data-tab="pos" id="nav-tab-pos"><span>💰</span><span>收银</span></button>
    <button type="button" class="sdxt-tab" data-tab="supply"><span>🚚</span><span>补货</span></button>
    <button type="button" class="sdxt-tab" data-tab="members"><span>📒</span><span id="nav-lbl-mem">熟客</span></button>
  </nav>

  <div id="ui-drawer-mask" class="sdxt-drawer-mask hidden">
    <div class="sdxt-drawer-box" id="ui-drawer-body"></div>
  </div>

  <script type="module">
    import { initStoreTerminalBridge } from './src/modules/soulEngine/multiTerminalBridge.js';
    import './src/modules/store/storeLocalVault.js';
    import './src/modules/store/storeCounterPos.js';
    import './src/modules/store/storeCatalogPricing.js';
    import './src/modules/store/storePosterStudio.js';
    import './src/modules/store/storeUpstreamOrder.js';

    initStoreTerminalBridge();

    (async function bootstrapPalmApp() {
      const vault = await window.StoreLocalVault.init();
      const pos = window.StoreCounterPos;
      const cat = window.StoreCatalogPricing;
      const upstream = window.StoreUpstreamOrder;
      upstream.init();

      const $ = (id) => document.getElementById(id);
      const openDrawer = (html) => {
        $('ui-drawer-body').innerHTML = html;
        $('ui-drawer-mask').classList.remove('hidden');
      };
      const closeDrawer = () => $('ui-drawer-mask').classList.add('hidden');
      $('ui-drawer-mask').addEventListener('click', (e) => { if (e.target === $('ui-drawer-mask')) closeDrawer(); });

      const showMsg = (title, text) => {
        openDrawer(`<h3>${title}</h3><p style="font-size:14px;color:var(--sdxt-ink-soft);">${text}</p><button class="sdxt-btn sdxt-btn-primary" style="width:100%;" id="m-ok-btn">知道了</button>`);
        $('m-ok-btn').onclick = closeDrawer;
      };

      function switchTab(tabName) {
        document.querySelectorAll('.sdxt-tab').forEach((t) => t.classList.toggle('active', t.dataset.tab === tabName));
        ['palm', 'shelf', 'pos', 'supply', 'members'].forEach((v) => $(`view-${v}`).classList.toggle('hidden', v !== tabName));
        renderAll();
      }

      async function renderAll() {
        const policy = vault.getPolicy();
        const lex = vault.getLexicon();
        const staff = vault.getActiveStaff();
        const canSeeCost = vault.hasPerm('viewCost');

        $('ui-store-name').textContent = vault.activeStoreData.storeName;
        $('ui-store-caret').classList.toggle('hidden', vault.meta.stores.length <= 1);
        $('ui-staff-name').textContent = staff.name;
        $('ui-store-code').textContent = vault.activeStoreData.storeId.toUpperCase();
        $('btn-boss-lock').textContent = vault.isBossUnlocked() ? '🔓 已解锁' : '🔒 锁屏';

        const activeStaffList = vault.meta.staff.filter((s) => s.active);
        $('select-staff-role').innerHTML = activeStaffList.map((st) =>
          `<option value="${st.id}" ${st.id === vault.meta.activeStaffId ? 'selected' : ''}>👑 ${st.name} (${vault.ROLE_PRESETS[st.role]?.label || st.role}指挥舱)</option>`
        ).join('');

        $('nav-lbl-shelf').textContent = lex.itemLabel;
        $('nav-lbl-mem').textContent = lex.customerLabel;
        $('nav-tab-pos').classList.toggle('hidden', Boolean(policy.hardware.hasStandalonePos));

        const catalogList = Object.values(vault.activeStoreData.catalog || {}).filter((i) => !i.archived);
        const memberList = Object.values(vault.activeStoreData.members || {});
        const totalDebt = memberList.reduce((s, m) => s + Number(m.creditDebt || 0), 0);
        const todayStart = new Date().setHours(0, 0, 0, 0);
        const todaySales = (vault.activeStoreData.txEvents || [])
          .filter((e) => !e.voided && e.ts >= todayStart && (e.type === 'sale' || e.type === 'credit_pay'))
          .reduce((s, e) => s + Number(e.amount || 0), 0);

        if (canSeeCost) {
          const stockVal = catalogList.reduce((s, i) => s + Number(i.stock || 0) * Number(i.costPrice || 0), 0);
          $('kpi-lbl-stock').textContent = `在库${lex.itemLabel}货值`;
          $('kpi-val-stock').textContent = `¥${Math.round(stockVal)}`;
        } else {
          $('kpi-lbl-stock').textContent = `在架${lex.itemLabel}数`;
          $('kpi-val-stock').textContent = `${catalogList.length}款`;
        }
        $('kpi-lbl-debt').textContent = `${lex.customerLabel}在账赊欠`;
        $('kpi-val-debt').textContent = `¥${totalDebt.toFixed(0)}`;
        $('kpi-val-sales').textContent = `¥${todaySales.toFixed(0)}`;

        const { lowStock } = cat.getAlertsAndRestockList();
        const pendingOrders = (upstream.data.orders || []).filter((o) => o.status !== 'received');
        $('ui-palm-health-tip').innerHTML = (lowStock.length || pendingOrders.length)
          ? `⚠️ 当前有 <strong>${lowStock.length}</strong> 款低库存待补、<strong>${pendingOrders.length}</strong> 笔进货待签收，点「补货」一键处理！`
          : `🌿 账实严丝合缝，可在顶部下拉切换任意一线岗位巡检，或进入电脑全面版工作台！`;

        const kw = ($('shelf-search-input').value || '').trim().toLowerCase();
        const filtered = catalogList.filter((i) => !kw || i.name.toLowerCase().includes(kw) || String(i.barcode || '').includes(kw) || String(i.plu || '').includes(kw));
        $('ui-shelf-list').innerHTML = filtered.map((it) => `
          <div class="sdxt-card" style="padding:12px;">
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <div>
                <div style="font-weight:800;font-size:15px;">${it.name}</div>
                <div style="font-size:12px;color:var(--sdxt-muted);margin-top:2px;">库存 ${it.stock}${it.unit || lex.unitDefault} ${canSeeCost ? `· 进¥${Number(it.costPrice).toFixed(2)}` : ''}</div>
              </div>
              <div style="text-align:right;">
                <div style="font-size:18px;font-weight:900;color:#be123c;">¥${Number(it.retailPrice).toFixed(2)}</div>
                <button type="button" class="sdxt-pill" style="padding:2px 8px;font-size:11px;margin-top:4px;" data-stockin-id="${it.id}">📥 入库</button>
              </div>
            </div>
          </div>`).join('') || `<div class="sdxt-card" style="text-align:center;color:var(--sdxt-muted);">暂无${lex.itemLabel}，点右上角「+ 建档」</div>`;

        $('ui-shelf-list').querySelectorAll('[data-stockin-id]').forEach((b) => {
          b.onclick = () => {
            const it = vault.activeStoreData.catalog[b.dataset.stockinId];
            if (!it) return;
            openDrawer(`<h3>📥 ${it.name} 快速入库</h3>
              <input id="in-qty" type="number" class="sdxt-input" placeholder="入库数量" value="1" />
              <button class="sdxt-btn sdxt-btn-ok" style="width:100%;margin-top:10px;" id="in-ok">确认入库</button>`);
            $('in-ok').onclick = async () => { await cat.receiveStock({ itemId: it.id, qtyIn: $('in-qty').value, isBox: Number(it.packRate) > 1 }); closeDrawer(); renderAll(); };
          };
        });

        renderPosCart();
        renderSupplyView();
        renderMembers();
      }

      function renderPosCart() {
        const policy = vault.getPolicy();
        const lex = vault.getLexicon();
        const summary = pos.recalculate();
        $('ui-pos-payable').textContent = summary.payable.toFixed(2);
        $('btn-pay-balance').classList.toggle('hidden', !policy.loyaltyBlocks.storedValueCard.enabled);
        const selMem = pos.currentMemberId ? vault.activeStoreData.members[pos.currentMemberId] : null;
        $('ui-selected-mem-label').textContent = selMem ? `${selMem.name}(已选)` : `选${lex.customerLabel}/会员`;
        $('ui-pos-discount-tip').textContent = summary.memberSaved > 0 ? `(会员省¥${summary.memberSaved})` : '';

        $('ui-pos-cart-list').innerHTML = pos.cart.map((l, idx) => `
          <div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;">
            <span><strong>${l.name}</strong> ${l.isWeigh ? `${l.weight}${lex.weighUnit}` : `x${l.qty}`}</span>
            <span>¥${Number(l.subtotal).toFixed(2)} <button type="button" data-rm="${idx}" style="border:none;background:#fff1f2;color:#be123c;border-radius:6px;padding:2px 6px;margin-left:6px;">删</button></span>
          </div>`).join('') || '<div style="text-align:center;color:var(--sdxt-muted);font-size:13px;padding:16px 0;">扫码、输秤号或“名称*重量”开单</div>';

        $('ui-pos-cart-list').querySelectorAll('[data-rm]').forEach((b) => {
          b.onclick = () => { pos.cart.splice(Number(b.dataset.rm), 1); renderPosCart(); };
        });
      }

      function renderSupplyView() {
        const pCart = upstream.purchaseCart;
        $('ui-purchase-cart-box').innerHTML = pCart.length ? `
          <div style="font-weight:700;font-size:13px;margin-bottom:6px;">🛒 待提交补货单（${pCart.length}项）</div>
          ${pCart.map((c) => `<div style="font-size:12px;padding:2px 0;">· ${c.name} × ${c.qty}${c.unit}</div>`).join('')}
          <button type="button" class="sdxt-btn sdxt-btn-primary" style="width:100%;margin-top:8px;" id="btn-sub-po">一键发出采购单</button>
        ` : '<div style="font-size:12px;color:var(--sdxt-muted);text-align:center;">点右上角「⚡ 导入缺货订货」一键汇总低库存</div>';
        $('btn-sub-po')?.addEventListener('click', async () => {
          const ords = await upstream.submitPurchaseOrders();
          showMsg('✅ 已发出采购单', `共生成 ${ords.length} 笔订货单`);
          renderAll();
        });

        const orders = upstream.data.orders || [];
        $('ui-po-order-list').innerHTML = orders.slice(0, 8).map((o) => `
          <div style="padding:8px 0;border-bottom:1px dashed var(--sdxt-line);font-size:13px;display:flex;justify-content:space-between;align-items:center;">
            <div><strong>${o.supplierName}</strong><div style="font-size:12px;color:var(--sdxt-muted);">¥${Number(o.totalAmount).toFixed(2)} · ${o.status === 'received' ? '已入库' : '在途待收'}</div></div>
            ${o.status !== 'received' ? `<button type="button" class="sdxt-pill" style="background:#ecfdf5;color:#047857;" data-recv="${o.orderId}">📥 签收入库</button>` : '<span class="sdxt-badge">已入库</span>'}
          </div>`).join('') || '<div style="font-size:12px;color:var(--sdxt-muted);">暂无在途采购单</div>';

        $('ui-po-order-list').querySelectorAll('[data-recv]').forEach((b) => {
          b.onclick = async () => { await upstream.confirmOrderReceivedAndStockIn(b.dataset.recv); showMsg('✅ 已签收入库', '库存与进价已自动同步'); renderAll(); };
        });
      }

      function renderMembers() {
        const kw = ($('member-search-input').value || '').trim();
        const list = Object.values(vault.activeStoreData.members || {}).filter((m) => !kw || m.name.includes(kw) || (m.phone || '').includes(kw));
        $('ui-member-list').innerHTML = list.map((m) => `
          <div class="sdxt-card" style="display:flex;justify-content:space-between;align-items:center;">
            <div>
              <strong>${m.name}</strong> <span style="font-size:12px;color:var(--sdxt-muted);">${m.phone || ''}</span>
              <div style="margin-top:4px;">${Number(m.creditDebt) > 0 ? `<span class="sdxt-badge" style="background:#fff1f2;color:#be123c;">赊欠 ¥${Number(m.creditDebt).toFixed(2)}</span>` : '<span class="sdxt-badge">无欠款</span>'}</div>
            </div>
            <div style="display:flex;gap:6px;">
              ${Number(m.creditDebt) > 0 ? `<button type="button" class="sdxt-pill" data-wx="${m.id}">微信催收</button><button type="button" class="sdxt-pill" data-pay-debt="${m.id}">销账</button>` : ''}
              <button type="button" class="sdxt-pill" data-sel="${m.id}">收银</button>
            </div>
          </div>`).join('') || '<div class="sdxt-card" style="text-align:center;color:var(--sdxt-muted);">暂无熟客档案</div>';

        $('ui-member-list').querySelectorAll('[data-sel]').forEach((b) => { b.onclick = () => { pos.currentMemberId = b.dataset.sel; switchTab('pos'); }; });
        $('ui-member-list').querySelectorAll('[data-wx]').forEach((b) => {
          b.onclick = async () => {
            const txt = pos.buildPoliteWechatStatement(b.dataset.wx);
            await navigator.clipboard.writeText(txt).catch(() => {});
            showMsg('📋 已复制礼貌对账单', `<pre style="white-space:pre-wrap;font-size:13px;">${txt}</pre>`);
          };
        });
        $('ui-member-list').querySelectorAll('[data-pay-debt]').forEach((b) => {
          b.onclick = async () => {
            const m = vault.activeStoreData.members[b.dataset.payDebt];
            await pos.settleCreditDebt(m.id, m.creditDebt, 'wechat');
            showMsg('✅ 已结清销账', `${m.name} 的在账赊欠已全额核销`);
            renderAll();
          };
        });
      }

      document.querySelectorAll('.sdxt-tab').forEach((btn) => { btn.onclick = () => switchTab(btn.dataset.tab); });
      $('palm-go-pos').onclick = () => switchTab('pos');
      $('palm-go-add').onclick = () => { switchTab('shelf'); $('btn-open-add-item').click(); };
      $('palm-go-supply').onclick = () => switchTab('supply');
      $('palm-go-members').onclick = () => switchTab('members');
      $('btn-palm-refresh').onclick = renderAll;
      $('btn-toggle-large-font').onclick = () => document.body.classList.toggle('sdxt-large-font');
      $('select-staff-role').onchange = (e) => { vault.switchStaff(e.target.value); renderAll(); };
      $('btn-quick-backup-link').onclick = () => vault.exportOrShareJsonBackup(true);
      $('btn-quick-share-backup').onclick = async () => { await vault.exportOrShareJsonBackup(true); $('ui-backup-toast').classList.add('hidden'); };

      $('btn-quick-guide').onclick = () => {
        showMsg('💡 门店掌中宝 · 使用指引',
          '1. <strong>掌中宝（手机专版）</strong>：三色状态卡一眼掌握货值、赊欠与实收，单手拇指完成收银、补货与微信催收。<br/><br/>' +
          '2. <strong>电脑全面版（store.html）</strong>：点右上角「🖥️ 全面版」或底部「进完整工作台 →」，进入宽屏三联总账 + 全功能多栏调度台，手机电脑数据完全互通。');
      };

      const openQuickAddForm = (prefillBarcode = '') => {
        const lex = vault.getLexicon();
        openDrawer(`<h3>📦 快速新增${lex.itemLabel}</h3>
          <div style="display:grid;gap:8px;margin:10px 0;">
            <input id="p-nm" class="sdxt-input" placeholder="${lex.itemLabel}名称" />
            <input id="p-bc" class="sdxt-input" placeholder="条码 (选填)" value="${prefillBarcode}" />
            <div class="sdxt-grid-2">
              <input id="p-cost" type="number" step="0.01" class="sdxt-input" placeholder="进货底价" />
              <input id="p-ret" type="number" step="0.01" class="sdxt-input" placeholder="对外零售价" />
            </div>
            <input id="p-stk" type="number" class="sdxt-input" placeholder="初始库存数量" />
          </div>
          <button class="sdxt-btn sdxt-btn-primary" style="width:100%;" id="p-sv">保存上架</button>`);
        $('p-sv').onclick = async () => {
          if (!$('p-nm').value.trim()) return;
          await cat.upsertCatalogItem({ name: $('p-nm').value.trim(), barcode: $('p-bc').value.trim(), costPrice: $('p-cost').value, retailPrice: $('p-ret').value, stock: $('p-stk').value });
          closeDrawer();
          renderAll();
        };
      };

      $('btn-open-add-item').onclick = () => openQuickAddForm('');
      window.addEventListener('sdxt:unknown-barcode', (e) => openQuickAddForm(e.detail?.barcode || ''));

      window.addEventListener('sdxt:join-coproduction', (e) => {
        const camp = e.detail;
        if (!camp) return;
        openDrawer(`<h3>🔥 跟单参与上游凑单开产</h3>
          <p style="font-size:13px;">活动：<strong>${camp.title}</strong>（已凑 ${camp.currentQty || 0}/${camp.targetQty}${camp.unit || '件'}）</p>
          <input id="m-cpq" type="number" class="sdxt-input" value="10" style="margin:8px 0;" />
          <button class="sdxt-btn sdxt-btn-primary" style="width:100%;" id="m-cpo">确认报数凑单</button>`);
        $('m-cpo').onclick = () => {
          upstream.joinCoProduction(camp.id, $('m-cpq').value);
          closeDrawer();
          showMsg('✅ 报数成功', '已计入上游凑单开产总进度');
        };
      });

      $('btn-pos-scan-confirm').onclick = () => { pos.handleUniversalInput($('pos-universal-input').value); $('pos-universal-input').value = ''; renderPosCart(); };
      $('btn-undo-sale').onclick = async () => { try { await pos.undoLastSale(); renderAll(); } catch (e) { showMsg('提示', e.message); } };
      $('btn-select-pos-member').onclick = () => {
        const list = Object.values(vault.activeStoreData.members || {});
        openDrawer(`<h3>👤 选择熟客 / 会员</h3>
          <div style="display:grid;gap:6px;margin:10px 0;">
            <button class="sdxt-btn sdxt-btn-ghost" data-pm="">散客</button>
            ${list.map((m) => `<button class="sdxt-btn sdxt-btn-ghost" data-pm="${m.id}">${m.name}</button>`).join('')}
          </div>`);
        $('ui-drawer-body').querySelectorAll('[data-pm]').forEach((b) => { b.onclick = () => { pos.currentMemberId = b.dataset.pm; closeDrawer(); renderPosCart(); }; });
      };
      $('btn-show-payqr').onclick = () => {
        const qrs = vault.activeStoreData.payQrs || {};
        openDrawer(`<h3>💳 门店收款码</h3>
          <div class="sdxt-grid-2" style="text-align:center;margin:10px 0;">
            <div><div>微信</div>${qrs.wechat ? `<img src="${qrs.wechat}" style="width:100%;max-width:150px;"/>` : '<p style="font-size:12px;">请在电脑全面版上传</p>'}</div>
            <div><div>支付宝</div>${qrs.alipay ? `<img src="${qrs.alipay}" style="width:100%;max-width:150px;"/>` : '<p style="font-size:12px;">请在电脑全面版上传</p>'}</div>
          </div>
          <button class="sdxt-btn sdxt-btn-primary" style="width:100%;" id="q-c">关闭</button>`);
        $('q-c').onclick = closeDrawer;
      };
      document.querySelectorAll('[data-pay]').forEach((btn) => {
        btn.onclick = async () => {
          try { await pos.checkout({ payMethod: btn.dataset.pay, skipLargeAlert: true }); renderAll(); } catch (e) { showMsg('提示', e.message); }
        };
      });

      $('btn-import-lowstock-po').onclick = () => { upstream.importLowStockToPurchaseCart(); renderSupplyView(); };
      $('btn-add-member').onclick = () => {
        openDrawer(`<h3>👤 新增熟客</h3>
          <input id="m-nm" class="sdxt-input" placeholder="熟客称呼" style="margin:8px 0;" />
          <input id="m-ph" class="sdxt-input" placeholder="手机号" style="margin-bottom:10px;" />
          <button class="sdxt-btn sdxt-btn-primary" style="width:100%;" id="m-ok">保存</button>`);
        $('m-ok').onclick = async () => { if ($('m-nm').value.trim()) { await pos.upsertMember({ name: $('m-nm').value.trim(), phone: $('m-ph').value.trim() }); closeDrawer(); renderAll(); } };
      };

      $('btn-boss-lock').onclick = () => {
        if (vault.isBossUnlocked() && vault.meta.pinHash) { vault.lockBoss(); renderAll(); return; }
        openDrawer(`<h3>🔒 掌柜安全码</h3>
          <input id="pin-in" type="password" inputmode="numeric" class="sdxt-input" placeholder="${vault.meta.pinHash ? '输入安全码解锁' : '首次设置4位安全码'}" />
          <button class="sdxt-btn sdxt-btn-primary" style="width:100%;margin-top:10px;" id="pin-ok">确认</button>`);
        $('pin-ok').onclick = () => {
          const v = $('pin-in').value.trim();
          if (!vault.meta.pinHash) { try { vault.setupPin(v, ''); closeDrawer(); renderAll(); } catch (e) { showMsg('提示', e.message); } }
          else if (vault.verifyPin(v)) { closeDrawer(); renderAll(); }
          else showMsg('安全码错误', '请重新输入');
        };
      };

      $('btn-store-switcher').onclick = () => {
        openDrawer(`<h3>🏪 切换门店</h3>
          <div style="margin:10px 0;">${vault.meta.stores.map((s) => `<button class="sdxt-pill ${s.id === vault.meta.activeStoreId ? 'active' : ''}" data-st="${s.id}" style="margin:3px;">${s.name}</button>`).join('')}</div>
          <button class="sdxt-btn sdxt-btn-ghost" style="width:100%;" id="st-c">关闭</button>`);
        $('ui-drawer-body').querySelectorAll('[data-st]').forEach((b) => { b.onclick = async () => { await vault.loadStore(b.dataset.st); closeDrawer(); renderAll(); }; });
        $('st-c').onclick = closeDrawer;
      };

      $('shelf-search-input').oninput = renderAll;
      $('member-search-input').oninput = renderMembers;
      window.addEventListener('sdxt:suggest-backup', () => $('ui-backup-toast').classList.remove('hidden'));

      await renderAll();
    })();
  </script>
</body>
</html>
