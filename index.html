<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>商道相通 · 百业门店工作台</title>
  <style>
    :root { --bg:#f8fafc; --card:#ffffff; --ink:#0f172a; --muted:#64748b; --brand:#dc2626; --ok:#10b981; --warn:#d97706; --line:#e2e8f0; }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--ink); padding-bottom:84px; }
    .topbar { position:sticky; top:0; z-index:40; background:#fff; border-bottom:1px solid var(--line); padding:10px 14px; display:flex; align-items:center; justify-content:space-between; gap:8px; }
    .store-title { font-weight:800; font-size:16px; display:flex; align-items:center; gap:6px; cursor:pointer; }
    .pill-btn { padding:6px 10px; border-radius:99px; border:1px solid var(--line); background:#fff; font-size:12px; font-weight:600; color:var(--ink); cursor:pointer; white-space:nowrap; }
    .pill-btn.active { background:#0f172a; color:#fff; border-color:#0f172a; }
    .container { max-width:780px; margin:0 auto; padding:12px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px; }
    .grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .grid-3 { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
    .input { width:100%; padding:10px 12px; border:1px solid #cbd5e1; border-radius:10px; font-size:14px; outline:none; }
    .input:focus { border-color:#0f172a; }
    .btn { padding:10px 12px; border:none; border-radius:10px; font-weight:700; font-size:13px; cursor:pointer; }
    .btn-primary { background:#0f172a; color:#fff; }
    .btn-danger { background:var(--brand); color:#fff; }
    .btn-ok { background:var(--ok); color:#fff; }
    .btn-ghost { background:#f1f5f9; color:#334155; }
    .tabbar { position:fixed; bottom:0; left:0; right:0; z-index:50; background:#fff; border-top:1px solid var(--line); display:flex; padding:6px 4px; gap:2px; }
    .tab { flex:1; border:none; background:transparent; padding:6px 2px; font-size:11px; font-weight:700; color:var(--muted); border-radius:10px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:2px; }
    .tab.active { color:var(--brand); background:#fef2f2; }
    .badge { display:inline-block; padding:2px 7px; border-radius:6px; font-size:11px; font-weight:700; background:#f1f5f9; color:#334155; }
    .hidden { display:none !important; }
    .drawer-mask { position:fixed; inset:0; z-index:100; background:rgba(15,23,42,.55); display:flex; align-items:flex-end; justify-content:center; }
    .drawer-box { width:100%; max-width:620px; max-height:90vh; overflow-y:auto; background:#fff; border-radius:18px 18px 0 0; padding:18px; }
    .h-scroll { display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; }
    .h-scroll::-webkit-scrollbar { display:none; }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="store-title" id="btn-store-switcher">
      <span>🏪</span>
      <span id="ui-store-name" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px;">我的门店</span>
      <span id="ui-store-caret" class="hidden" style="font-size:11px;color:#64748b;">▼</span>
    </div>
    <div style="display:flex;align-items:center;gap:6px;">
      <button type="button" class="pill-btn" id="btn-staff-role">👤 掌柜</button>
      <button type="button" class="pill-btn" id="btn-boss-lock">🔓 已解锁</button>
    </div>
  </header>

  <main class="container">
    <div id="ui-backup-toast" class="card hidden" style="background:#ecfdf5;border-color:#a7f3d0;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;">
      <span style="font-size:12px;color:#065f46;font-weight:600;">💾 账本已有新流水，1秒发微信文件传输助手防丢</span>
      <button type="button" class="btn btn-ok" style="padding:6px 10px;font-size:12px;" id="btn-quick-share-backup">立即备份</button>
    </div>

    <div id="co-production-banner-slot"></div>

    <!-- 视图 1：纯正对外零售货架（白纸极简，手电筒视角防泄露） -->
    <section id="view-shelf">
      <div class="card" style="padding:10px 12px;">
        <div style="display:flex;gap:8px;">
          <input id="shelf-search-input" class="input" placeholder="🔍 搜名称 / 扫条码 / 秤号查价..." />
          <button type="button" class="btn btn-primary" id="btn-open-add-item">+ 建档</button>
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;">
          <button type="button" class="pill-btn" id="btn-batch-price">📈 分类调价</button>
          <button type="button" class="pill-btn" id="btn-print-tags">🏷️ 打印价签/秤签</button>
          <button type="button" class="pill-btn" id="btn-toggle-archived">📦 停售归档库</button>
        </div>
        <div id="ui-standalone-pos-bar" class="hidden" style="margin-top:8px;padding-top:8px;border-top:1px dashed #e2e8f0;display:flex;justify-content:space-between;align-items:center;">
          <span style="font-size:12px;color:#475569;">🖥️ 已启用独立称重收银一体机模式</span>
          <button type="button" class="pill-btn" id="btn-record-pos-day">📥 录一体机日结</button>
        </div>
      </div>
      <div id="ui-shelf-list"></div>
    </section>

    <!-- 视图 2：柜台快速收银与称重 -->
    <section id="view-pos" class="hidden">
      <div class="card">
        <div style="display:flex;gap:6px;margin-bottom:8px;">
          <input id="pos-universal-input" class="input" placeholder="扫条码 / 称重签 / 输 品名*重量 (如 鸡蛋*2.5)" />
          <button type="button" class="btn btn-ghost" id="btn-pos-scan-confirm">添加</button>
          <button type="button" class="btn btn-ghost" id="btn-bt-scale" title="连接蓝牙电子秤">⚖️</button>
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;">
          <button type="button" class="pill-btn" id="btn-select-pos-member">👤 <span id="ui-selected-mem-label">选熟客/会员</span></button>
          <button type="button" class="pill-btn" id="btn-hold-order">⏸️ 挂单/外送</button>
          <button type="button" class="pill-btn" id="btn-resume-held">📋 取单(<span id="ui-held-count">0</span>)</button>
          <button type="button" class="pill-btn" id="btn-undo-sale">↩️ 撤回上笔</button>
          <button type="button" class="pill-btn" id="btn-show-payqr">💳 收款码</button>
          <button type="button" class="pill-btn" id="btn-open-refund">🔄 退货退款</button>
        </div>

        <div id="ui-pos-cart-list" style="min-height:86px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px 0;margin-bottom:10px;"></div>

        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
          <div>
            <div style="font-size:13px;color:var(--muted);">应收合计 <span id="ui-pos-discount-tip" style="color:#d97706;font-weight:700;"></span></div>
            <div style="margin-top:4px;display:flex;gap:6px;">
              <button type="button" class="pill-btn" style="padding:3px 8px;font-size:11px;" id="btn-quick-round-yuan">一键抹零到元</button>
              <button type="button" class="pill-btn" style="padding:3px 8px;font-size:11px;" id="btn-quick-manual-amt">+ 手输金额</button>
            </div>
          </div>
          <span style="font-size:28px;font-weight:900;color:var(--brand);">¥<span id="ui-pos-payable">0.00</span></span>
        </div>

        <div class="grid-3">
          <button type="button" class="btn btn-ok" data-pay="wechat">微信收款</button>
          <button type="button" class="btn btn-primary" data-pay="alipay">支付宝</button>
          <button type="button" class="btn btn-ghost" data-pay="cash">现金(算找零)</button>
        </div>
        <div class="grid-2" style="margin-top:8px;">
          <button type="button" class="btn btn-ghost" data-pay="credit">记熟客挂账</button>
          <button type="button" class="btn btn-ghost hidden" id="btn-pay-balance" data-pay="balance">会员卡扣款</button>
        </div>
      </div>

      <div class="card">
        <div style="font-weight:700;font-size:14px;margin-bottom:8px;">🧾 今日收银流水（支持补打58mm小票）</div>
        <div id="ui-today-tx-list"></div>
      </div>
    </section>

    <!-- 视图 3：上游供货方采购订货与周期账单 -->
    <section id="view-supply" class="hidden">
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <span style="font-weight:800;font-size:15px;">🚚 上游供货方与进货单</span>
          <button type="button" class="pill-btn" id="btn-add-supplier">+ 供货方</button>
        </div>
        <div class="h-scroll" id="ui-supplier-pills" style="margin-bottom:10px;"></div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;">
          <button type="button" class="btn btn-ghost" style="flex:1;" id="btn-import-lowstock-po">⚡ 导入本店缺货</button>
          <button type="button" class="btn btn-ghost hidden" style="flex:1;" id="btn-import-multistore-po">🏢 多店统购汇总</button>
          <button type="button" class="btn btn-primary" style="flex:1;" id="btn-add-supply-prod">+ 录供货目录</button>
        </div>
        <div id="ui-purchase-cart-box" style="background:#f8fafc;border-radius:10px;padding:10px;margin-bottom:10px;"></div>
        <div id="ui-supply-catalog-list"></div>
      </div>

      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <span style="font-weight:700;font-size:14px;">📦 采购订单与周期对账单</span>
          <button type="button" class="pill-btn" id="btn-supplier-statements">📑 周期对账汇总</button>
        </div>
        <div id="ui-po-order-list"></div>
      </div>
    </section>

    <!-- 视图 4：熟客账本与积木会员（流水无痕：未点亮的积木零渲染） -->
    <section id="view-members" class="hidden">
      <div class="card" style="display:flex;gap:8px;">
        <input id="member-search-input" class="input" placeholder="搜客户姓名 / 手机号..." />
        <button type="button" class="btn btn-primary" id="btn-add-member">+ 新客户</button>
      </div>
      <div id="ui-member-list"></div>
    </section>

    <!-- 视图 5：掌柜经营、百业词典与多选存储策略 -->
    <section id="view-manage" class="hidden">
      <div id="ui-boss-dashboard-card" class="card hidden" style="background:linear-gradient(135deg,#0f172a,#1e293b);color:#fff;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
          <span style="font-weight:800;font-size:15px;">📊 经营内账看板（今日）</span>
          <span class="badge" style="background:rgba(255,255,255,.15);color:#fff;" id="ui-store-count-badge">单店账本</span>
        </div>
        <div class="grid-3">
          <div><div style="font-size:11px;opacity:.75;">营业实收</div><div style="font-size:18px;font-weight:800;" id="ui-dash-rev">¥0.00</div></div>
          <div><div style="font-size:11px;opacity:.75;">成本+杂费</div><div style="font-size:18px;font-weight:800;" id="ui-dash-cost">¥0.00</div></div>
          <div><div style="font-size:11px;opacity:.75;">预估真净赚</div><div style="font-size:18px;font-weight:800;color:#34d399;" id="ui-dash-profit">¥0.00</div></div>
        </div>
      </div>

      <div class="card">
        <div style="font-weight:700;font-size:14px;margin-bottom:10px;">🧰 百业门店实战工具箱</div>
        <div class="grid-2">
          <button type="button" class="btn btn-ghost" id="btn-tool-alerts">⚠️ 缺货临期与热销分析</button>
          <button type="button" class="btn btn-ghost" id="btn-tool-poster">📣 群接龙海报 / A4传单</button>
          <button type="button" class="btn btn-ghost" id="btn-tool-tv">📺 16:9 店内大屏轮播</button>
          <button type="button" class="btn btn-ghost" id="btn-tool-shift">🧮 交接班实盘清点</button>
          <button type="button" class="btn btn-ghost" id="btn-tool-expense">💸 记日常杂费支出</button>
          <button type="button" class="btn btn-ghost" id="btn-tool-pos-csv">📂 导入一体机CSV表</button>
          <button type="button" class="btn btn-ghost" id="btn-tool-storage">🛡️ 存储多选与积木规则</button>
          <button type="button" class="btn btn-ghost" id="btn-tool-stores">🏢 分店调拨与精细权限</button>
          <button type="button" class="btn btn-ghost" style="grid-column:span 2;" id="btn-tool-lexicon">🌐 百工百业词典与参数自定义</button>
        </div>
      </div>
    </section>
  </main>

  <nav class="tabbar">
    <button type="button" class="tab active" data-tab="shelf"><span>🏷️</span><span id="nav-lbl-shelf">门店货架</span></button>
    <button type="button" class="tab" data-tab="pos" id="nav-tab-pos"><span>💰</span><span>柜台收银</span></button>
    <button type="button" class="tab" data-tab="supply"><span>🚚</span><span>进货订货</span></button>
    <button type="button" class="tab" data-tab="members"><span>📒</span><span id="nav-lbl-mem">熟客会员</span></button>
    <button type="button" class="tab" data-tab="manage"><span>⚙️</span><span>掌柜管理</span></button>
  </nav>

  <div id="ui-drawer-mask" class="drawer-mask hidden">
    <div class="drawer-box" id="ui-drawer-body"></div>
  </div>

  <script type="module" src="./src/modules/soulEngine/multiTerminalBridge.js"></script>
  <script src="./src/modules/store/storeLocalVault.js"></script>
  <script src="./src/modules/store/storeCounterPos.js"></script>
  <script src="./src/modules/store/storeCatalogPricing.js"></script>
  <script src="./src/modules/store/storePosterStudio.js"></script>
  <script src="./src/modules/store/storeUpstreamOrder.js"></script>

  <script>
    (async function bootstrapStoreApp() {
      const vault = await window.StoreLocalVault.init();
      const pos = window.StoreCounterPos;
      const cat = window.StoreCatalogPricing;
      const poster = window.StorePosterStudio;
      const upstream = window.StoreUpstreamOrder;
      upstream.init();

      let showArchived = false;
      let activeSupplierFilter = 'ALL';

      const $ = (id) => document.getElementById(id);
      const openDrawer = (html) => {
        $('ui-drawer-body').innerHTML = html;
        $('ui-drawer-mask').classList.remove('hidden');
      };
      const closeDrawer = () => $('ui-drawer-mask').classList.add('hidden');
      $('ui-drawer-mask').addEventListener('click', (e) => { if (e.target === $('ui-drawer-mask')) closeDrawer(); });

      const showMsg = (title, text) => {
        openDrawer(`<h3>${title}</h3><p style="font-size:14px;color:#334155;">${text}</p><button class="btn btn-primary" style="width:100%;" id="m-ok-btn">知道了</button>`);
        $('m-ok-btn').onclick = closeDrawer;
      };

      async function renderAll() {
        const policy = vault.getPolicy();
        const lex = vault.getLexicon();
        const staff = vault.getActiveStaff();
        const canSeeCost = vault.hasPerm('viewCost');

        // 动态词典实时渲染
        $('nav-lbl-shelf').textContent = `${lex.itemLabel}货架`;
        $('nav-lbl-mem').textContent = `${lex.customerLabel}会员`;
        $('shelf-search-input').placeholder = `🔍 搜${lex.itemLabel}名称 / 条码 / ${lex.locLabel}...`;
        $('member-search-input').placeholder = `搜${lex.customerLabel}姓名 / 手机号...`;
        $('btn-import-multistore-po').classList.toggle('hidden', vault.meta.stores.length <= 1);

        $('ui-store-name').textContent = vault.activeStoreData.storeName;
        $('ui-store-caret').classList.toggle('hidden', vault.meta.stores.length <= 1);
        $('btn-staff-role').textContent = `👤 ${staff.name}`;
        $('btn-boss-lock').textContent = vault.isBossUnlocked() ? '🔓 已解锁' : '🔒 锁屏中';

        const hasPosMachine = Boolean(policy.hardware.hasStandalonePos);
        $('ui-standalone-pos-bar').classList.toggle('hidden', !hasPosMachine);
        $('nav-tab-pos').classList.toggle('hidden', hasPosMachine);

        // 1. 渲染对外零售货架
        const kw = ($('shelf-search-input').value || '').trim().toLowerCase();
        const items = Object.values(vault.activeStoreData.catalog || {}).filter((i) => {
          if (Boolean(i.archived) !== showArchived) return false;
          if (!kw) return true;
          return (i.name || '').toLowerCase().includes(kw) || String(i.barcode || '').includes(kw) || String(i.plu || '').includes(kw) || (i.shelfLoc || '').toLowerCase().includes(kw);
        });

        $('ui-shelf-list').innerHTML = items.length ? items.map((it) => {
          const hasMemPrice = policy.loyaltyBlocks.memberPriceAndDay.enabled && Number(it.memberPrice) > 0;
          const costHtml = canSeeCost
            ? `<span class="badge" style="background:#fef2f2;color:#b91c1c;">进 ¥${Number(it.costPrice).toFixed(2)} · 赚 ¥${(Number(it.retailPrice) - Number(it.costPrice)).toFixed(2)}</span>`
            : '';
          const tierTip = Array.isArray(it.tierPrices) && it.tierPrices.length
            ? `<span class="badge" style="background:#eff6ff;color:#1d4ed8;">满${it.tierPrices[0].minQty}${it.unit}¥${it.tierPrices[0].price}</span>`
            : '';
          return `
            <div class="card" style="padding:12px;">
              <div style="display:flex;justify-content:space-between;align-items:center;">
                <div style="min-width:0;padding-right:8px;">
                  <div style="font-weight:700;font-size:15px;">${it.name}</div>
                  <div style="font-size:12px;color:#64748b;margin-top:3px;">
                    库存 ${it.stock}${it.unit || lex.unitDefault}${it.shelfLoc ? ` · ${it.shelfLoc}` : ''} ${costHtml} ${tierTip}
                  </div>
                </div>
                <div style="text-align:right;flex-shrink:0;">
                  <div style="font-size:18px;font-weight:900;color:var(--brand);">¥${Number(it.retailPrice).toFixed(2)}<span style="font-size:11px;color:#64748b;font-weight:normal;">/${it.unit || lex.unitDefault}</span></div>
                  ${hasMemPrice ? `<div style="font-size:11px;color:#d97706;font-weight:700;">会员 ¥${Number(it.memberPrice).toFixed(2)}</div>` : ''}
                </div>
              </div>
              <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;padding-top:8px;border-top:1px dashed #f1f5f9;">
                <button type="button" class="pill-btn" style="padding:3px 9px;font-size:11px;" data-stockin-id="${it.id}">📥 到货入库</button>
                <button type="button" class="pill-btn" style="padding:3px 9px;font-size:11px;" data-adjust-id="${it.id}">📋 实盘校准</button>
                <button type="button" class="pill-btn" style="padding:3px 9px;font-size:11px;" data-edit-id="${it.id}">✏️ 改价/编辑</button>
                <button type="button" class="pill-btn" style="padding:3px 9px;font-size:11px;" data-arch-id="${it.id}">${it.archived ? '♻️ 恢复上架' : '📦 停售归档'}</button>
              </div>
            </div>`;
        }).join('') : `<div class="card" style="text-align:center;color:#64748b;padding:24px;">${showArchived ? `暂无停售归档${lex.itemLabel}` : `货架暂无${lex.itemLabel}，点右上角「+ 建档」录入`}</div>`;

        $('ui-shelf-list').querySelectorAll('[data-stockin-id]').forEach((b) => { b.onclick = () => openStockInDrawer(b.dataset.stockinId); });
        $('ui-shelf-list').querySelectorAll('[data-adjust-id]').forEach((b) => { b.onclick = () => openStockAdjustDrawer(b.dataset.adjustId); });
        $('ui-shelf-list').querySelectorAll('[data-edit-id]').forEach((b) => { b.onclick = () => openItemForm('', vault.activeStoreData.catalog[b.dataset.editId]); });
        $('ui-shelf-list').querySelectorAll('[data-arch-id]').forEach((b) => {
          b.onclick = async () => {
            const it = vault.activeStoreData.catalog[b.dataset.archId];
            if (it) { it.archived = !it.archived; await vault.persistStore(); renderAll(); }
          };
        });

        renderPosCart();
        renderSupplyView();
        renderMembers();
        await renderManageDashboard();
      }

      function renderPosCart() {
        const policy = vault.getPolicy();
        const lex = vault.getLexicon();
        const summary = pos.recalculate();
        $('ui-pos-payable').textContent = summary.payable.toFixed(2);
        $('ui-held-count').textContent = (vault.activeStoreData.heldOrders || []).length;
        $('btn-pay-balance').classList.toggle('hidden', !policy.loyaltyBlocks.storedValueCard.enabled);

        const selMem = pos.currentMemberId ? vault.activeStoreData.members[pos.currentMemberId] : null;
        $('ui-selected-mem-label').textContent = selMem ? `${selMem.name}(已选)` : `选${lex.customerLabel}/会员`;

        const tips = [];
        if (summary.memberSaved > 0) tips.push(`会员省¥${summary.memberSaved}`);
        if (summary.fullReductionSaved > 0) tips.push(`满减¥${summary.fullReductionSaved}`);
        if (summary.matchedGift) tips.push(`赠:${summary.matchedGift}`);
        $('ui-pos-discount-tip').textContent = tips.length ? `(${tips.join(' · ')})` : '';

        const linesHtml = pos.cart.map((l, idx) => `
          <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;">
            <div><strong>${l.name}</strong> <span style="font-size:12px;color:#64748b;">${l.isWeigh ? `${l.weight}${l.weighUnit || lex.weighUnit}` : `x${l.qty}`}</span></div>
            <div style="display:flex;align-items:center;gap:8px;">
              <span style="font-weight:700;">¥${Number(l.subtotal).toFixed(2)}</span>
              <button type="button" data-rm-line="${idx}" style="border:none;background:#fee2e2;color:#dc2626;border-radius:6px;padding:2px 7px;cursor:pointer;">删</button>
            </div>
          </div>`).join('');
        const manualHtml = pos.manualAmount > 0 ? `<div style="display:flex;justify-content:space-between;padding:6px 0;color:#0f172a;"><span>手输快捷金额</span><strong>¥${Number(pos.manualAmount).toFixed(2)}</strong></div>` : '';
        $('ui-pos-cart-list').innerHTML = (linesHtml || manualHtml) ? (linesHtml + manualHtml) : '<div style="text-align:center;color:#94a3b8;font-size:13px;padding:18px 0;">扫码、输秤号或输入“名称*重量”自动算价</div>';

        $('ui-pos-cart-list').querySelectorAll('[data-rm-line]').forEach((btn) => {
          btn.onclick = () => { pos.cart.splice(Number(btn.dataset.rmLine), 1); renderPosCart(); };
        });

        const todayStart = new Date().setHours(0, 0, 0, 0);
        const todayTxs = (vault.activeStoreData.txEvents || []).filter((e) => !e.voided && e.ts >= todayStart && e.type === 'sale').slice(-8).reverse();
        $('ui-today-tx-list').innerHTML = todayTxs.map((e) => `
          <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px dashed #e2e8f0;font-size:13px;">
            <span>${new Date(e.ts).toLocaleTimeString().slice(0, 5)} · ¥${Number(e.amount).toFixed(2)} (${e.payMethod})</span>
            <button type="button" data-print-evt="${e.eventId}" class="pill-btn" style="padding:3px 8px;">🖨️ 小票</button>
          </div>`).join('') || '<div style="font-size:12px;color:#94a3b8;">今日暂无收银流水</div>';

        $('ui-today-tx-list').querySelectorAll('[data-print-evt]').forEach((btn) => {
          btn.onclick = () => {
            const evt = vault.activeStoreData.txEvents.find((x) => x.eventId === btn.dataset.printEvt);
            if (evt) pos.printReceipt(evt);
          };
        });
      }

      // 3. 渲染上游供货方采购视图
      function renderSupplyView() {
        const sups = upstream.data.suppliers || [];
        $('ui-supplier-pills').innerHTML = `<button type="button" class="pill-btn ${activeSupplierFilter === 'ALL' ? 'active' : ''}" data-sup-id="ALL">全部供货方</button>` +
          sups.map((s) => `<button type="button" class="pill-btn ${activeSupplierFilter === s.id ? 'active' : ''}" data-sup-id="${s.id}">${s.name}</button>`).join('');
        $('ui-supplier-pills').querySelectorAll('[data-sup-id]').forEach((b) => {
          b.onclick = () => { activeSupplierFilter = b.dataset.supId; renderSupplyView(); };
        });

        const pCart = upstream.purchaseCart;
        const poTotal = pCart.reduce((s, c) => s + c.wholesalePrice * c.qty, 0);
        $('ui-purchase-cart-box').innerHTML = pCart.length ? `
          <div style="font-weight:700;font-size:13px;margin-bottom:6px;">🛒 待提交采购单（预估 ¥${poTotal.toFixed(2)}）</div>
          ${pCart.map((c, i) => `<div style="display:flex;justify-content:space-between;font-size:12px;padding:3px 0;">
            <span>${c.name} (${c.supplierName}) × ${c.qty}${c.unit}</span>
            <span>¥${(c.wholesalePrice * c.qty).toFixed(2)} <a href="javascript:void(0)" data-rm-po="${i}" style="color:#dc2626;margin-left:6px;">移除</a></span>
          </div>`).join('')}
          <button type="button" class="btn btn-primary" style="width:100%;margin-top:8px;" id="btn-submit-po">生成正式采购订货单</button>
        ` : '<div style="font-size:12px;color:#64748b;text-align:center;">采购订货单为空，可点上方一键导入缺货或从下方目录挑选</div>';

        $('ui-purchase-cart-box').querySelectorAll('[data-rm-po]').forEach((a) => {
          a.onclick = () => { upstream.purchaseCart.splice(Number(a.dataset.rmPo), 1); renderSupplyView(); };
        });
        const subBtn = $('btn-submit-po');
        if (subBtn) {
          subBtn.onclick = async () => {
            try {
              const ords = await upstream.submitPurchaseOrders();
              showMsg('✅ 订货单已生成', `已按供货方自动拆分为 <strong>${ords.length}</strong> 笔采购单，可在下方追踪收货与微信发单。`);
              renderSupplyView();
            } catch (e) { showMsg('提示', e.message); }
          };
        }

        const prods = (upstream.data.supplierItems || []).filter((p) => activeSupplierFilter === 'ALL' || p.supplierId === activeSupplierFilter);
        $('ui-supply-catalog-list').innerHTML = prods.map((p) => `
          <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #f1f5f9;">
            <div><div style="font-weight:700;font-size:14px;">${p.name}</div><div style="font-size:12px;color:#64748b;">批发价 ¥${Number(p.wholesalePrice).toFixed(2)}/${p.unit} · 1${p.unit}=${p.packRate}散件</div></div>
            <button type="button" class="pill-btn" data-add-po="${p.id}">+ 进货</button>
          </div>`).join('');
        $('ui-supply-catalog-list').querySelectorAll('[data-add-po]').forEach((b) => {
          b.onclick = () => {
            const p = upstream.data.supplierItems.find((x) => x.id === b.dataset.addPo);
            if (p) { upstream.addToPurchaseCart(p, 1); renderSupplyView(); }
          };
        });

        const orders = upstream.data.orders || [];
        $('ui-po-order-list').innerHTML = orders.slice(0, 10).map((o) => `
          <div style="padding:8px 0;border-bottom:1px dashed #e2e8f0;font-size:13px;">
            <div style="display:flex;justify-content:space-between;">
              <strong>${o.supplierName} (${o.orderId})</strong>
              <span class="badge" style="background:${o.status === 'received' ? '#dcfce7' : '#fef3c7'};color:${o.status === 'received' ? '#15803d' : '#b45309'};">${o.status === 'received' ? '已入库' : '待收货'}</span>
            </div>
            <div style="font-size:12px;color:#64748b;margin:4px 0;">金额 ¥${Number(o.totalAmount).toFixed(2)} · 已付 ¥${Number(o.paidAmount || 0).toFixed(2)}</div>
            <div style="display:flex;gap:6px;">
              <button type="button" class="pill-btn" style="padding:3px 8px;font-size:11px;" data-copy-po="${o.orderId}">📋 复制发微信</button>
              ${o.status !== 'received' ? `<button type="button" class="pill-btn" style="padding:3px 8px;font-size:11px;background:#ecfdf5;color:#047857;" data-recv-po="${o.orderId}">📥 到货一键入库</button>` : ''}
            </div>
          </div>`).join('') || '<div style="font-size:12px;color:#94a3b8;">暂无向上游采购记录</div>';

        $('ui-po-order-list').querySelectorAll('[data-copy-po]').forEach((b) => {
          b.onclick = async () => {
            const o = upstream.data.orders.find((x) => x.orderId === b.dataset.copyPo);
            if (o) {
              const txt = upstream.buildWechatPurchaseText(o);
              await navigator.clipboard.writeText(txt).catch(() => {});
              showMsg('📋 订货单已复制', `<pre style="white-space:pre-wrap;font-size:12px;">${txt}</pre>`);
            }
          };
        });
        $('ui-po-order-list').querySelectorAll('[data-recv-po]').forEach((b) => {
          b.onclick = async () => {
            try {
              await upstream.confirmOrderReceivedAndStockIn(b.dataset.recvPo);
              showMsg('✅ 签收入库成功', '采购商品已按箱规自动拆零计入本店库存，并更新最新进货价！');
              renderAll();
            } catch (e) { showMsg('提示', e.message); }
          };
        });
      }

      // 4. 渲染熟客与积木会员本（全套积木按需渲染：赊账/储值/攒星/计次卡/周期配送/押金载具）
      function renderMembers() {
        const policy = vault.getPolicy();
        const blocks = policy.loyaltyBlocks;
        const lex = vault.getLexicon();
        const kw = ($('member-search-input').value || '').trim();
        const list = Object.values(vault.activeStoreData.members || {}).filter((m) => !kw || (m.name || '').includes(kw) || (m.phone || '').includes(kw));

        $('ui-member-list').innerHTML = list.map((m) => {
          const activePunches = (m.punchCards || []).filter((c) => c.remainTimes > 0);
          const activeSubs = (m.subscriptions || []).filter((s) => s.remainDeliveries > 0);
          const activeDeps = (m.deposits || []).filter((d) => !d.returned);

          return `
          <div class="card">
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <div>
                <div style="font-weight:700;">${m.name} <span style="font-size:12px;color:#64748b;">${m.phone || ''}</span></div>
                <div style="font-size:12px;margin-top:4px;display:flex;gap:6px;flex-wrap:wrap;">
                  ${Number(m.creditDebt) > 0 ? `<span class="badge" style="background:#fee2e2;color:#dc2626;">待结挂账 ¥${Number(m.creditDebt).toFixed(2)}</span>` : ''}
                  ${blocks.storedValueCard.enabled ? `<span class="badge" style="background:#dcfce7;color:#15803d;">余额 ¥${Number(m.balance || 0).toFixed(2)}</span>` : ''}
                  ${blocks.stampReward.enabled ? `<span class="badge" style="background:#fef3c7;color:#b45309;">⭐ ${m.stars || 0}星</span>` : ''}
                  ${activePunches.map((c) => `<span class="badge" style="background:#e0e7ff;color:#3730a3;">🎟️ ${c.title}:余${c.remainTimes}次</span>`).join('')}
                  ${activeSubs.map((s) => `<span class="badge" style="background:#fae8ff;color:#86198f;">🚚 ${s.itemDesc}:余${s.remainDeliveries}期(${s.nextDate})</span>`).join('')}
                  ${activeDeps.map((d) => `<span class="badge" style="background:#ffedd5;color:#9a3412;">🪣 押金:${d.itemName} ¥${d.amount}</span>`).join('')}
                </div>
              </div>
              <button type="button" class="pill-btn" data-use-mem="${m.id}">选去收银</button>
            </div>
            <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;padding-top:8px;border-top:1px dashed #f1f5f9;">
              ${Number(m.creditDebt) > 0 ? `<button type="button" class="pill-btn" style="font-size:11px;padding:3px 8px;" data-copy-debt="${m.id}">微信对账</button><button type="button" class="pill-btn" style="font-size:11px;padding:3px 8px;" data-clear-debt="${m.id}">💰 还款销账</button>` : ''}
              ${blocks.storedValueCard.enabled ? `<button type="button" class="pill-btn" style="font-size:11px;padding:3px 8px;" data-topup-mem="${m.id}">💳 储值充送</button>` : ''}
              ${blocks.stampReward.enabled && Number(m.stars) > 0 ? `<button type="button" class="pill-btn" style="font-size:11px;padding:3px 8px;" data-redeem-star="${m.id}">🎁 攒星兑礼</button>` : ''}
              ${blocks.punchAndSubscription.enabled ? `<button type="button" class="pill-btn" style="font-size:11px;padding:3px 8px;" data-punch-manage="${m.id}">🎟️ 次卡/周期配送</button>` : ''}
              ${blocks.referralAndDeposit.enabled ? `<button type="button" class="pill-btn" style="font-size:11px;padding:3px 8px;" data-dep-manage="${m.id}">🪣 押金载具管理</button>` : ''}
            </div>
          </div>`;
        }).join('') || `<div class="card" style="text-align:center;color:#64748b;">暂无${lex.customerLabel}档案，点右上角建档</div>`;

        $('ui-member-list').querySelectorAll('[data-use-mem]').forEach((b) => {
          b.onclick = () => { pos.currentMemberId = b.dataset.useMem; switchTab('pos'); };
        });
        $('ui-member-list').querySelectorAll('[data-copy-debt]').forEach((b) => {
          b.onclick = async () => {
            const msg = pos.buildPoliteWechatStatement(b.dataset.copyDebt);
            await navigator.clipboard.writeText(msg).catch(() => {});
            showMsg('📋 已复制礼貌对账单', `<pre style="white-space:pre-wrap;font-size:13px;">${msg}</pre>`);
          };
        });
        $('ui-member-list').querySelectorAll('[data-clear-debt]').forEach((b) => {
          b.onclick = () => {
            const m = vault.activeStoreData.members[b.dataset.clearDebt];
            openDrawer(`<h3>💰 ${m.name} 还款销账</h3><p>当前待结欠款：¥${Number(m.creditDebt).toFixed(2)}</p>
              <input id="repay-amt" type="number" class="input" value="${Number(m.creditDebt).toFixed(2)}" />
              <button class="btn btn-ok" style="width:100%;margin-top:10px;" id="repay-ok">确认结清入账</button>`);
            $('repay-ok').onclick = async () => { await pos.settleCreditDebt(m.id, $('repay-amt').value, 'wechat'); closeDrawer(); renderAll(); };
          };
        });
        $('ui-member-list').querySelectorAll('[data-topup-mem]').forEach((b) => {
          b.onclick = () => {
            const m = vault.activeStoreData.members[b.dataset.topupMem];
            openDrawer(`<h3>💳 ${m.name} 储值充送</h3>
              <div class="grid-2" style="margin:10px 0;">
                <input id="tp-pay" type="number" class="input" placeholder="实收充值金额" />
                <input id="tp-bonus" type="number" class="input" placeholder="赠送金额 (选填)" value="0" />
              </div>
              <button class="btn btn-primary" style="width:100%;" id="tp-ok">确认充值</button>`);
            $('tp-ok').onclick = async () => {
              const pay = Number($('tp-pay').value || 0);
              const bonus = Number($('tp-bonus').value || 0);
              if (pay <= 0) return;
              m.balance = Number((Number(m.balance || 0) + pay + bonus).toFixed(2));
              await vault.appendEvent({ type: 'topup', amount: pay, payMethod: 'wechat', memberId: m.id, memberName: m.name, note: `储值实收¥${pay}+赠¥${bonus}` });
              closeDrawer();
              renderAll();
            };
          };
        });
        $('ui-member-list').querySelectorAll('[data-redeem-star]').forEach((b) => {
          b.onclick = async () => {
            const m = vault.activeStoreData.members[b.dataset.redeemStar];
            const need = Number(policy.loyaltyBlocks.stampReward.starsToRedeem || 10);
            if (Number(m.stars) < need) { showMsg('提示', `当前 ${m.stars} 星，需满 ${need} 星可兑礼`); return; }
            m.stars -= need;
            await vault.persistStore();
            showMsg('🎁 兑礼成功', `已扣减 ${need} 星，剩余 ${m.stars} 星`);
            renderMembers();
          };
        });

        // 计次卡 & 周期配送管理抽屉
        $('ui-member-list').querySelectorAll('[data-punch-manage]').forEach((b) => {
          b.onclick = () => {
            const m = vault.activeStoreData.members[b.dataset.punchManage];
            const cards = (m.punchCards || []).filter((c) => c.remainTimes > 0);
            const subs = (m.subscriptions || []).filter((s) => s.remainDeliveries > 0);
            openDrawer(`<h3>🎟️ ${m.name} · 计次卡与周期配送</h3>
              ${cards.map((c) => `<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #f1f5f9;">
                <span>${c.title}（余 ${c.remainTimes}/${c.totalTimes} 次）</span>
                <button class="pill-btn" data-use-pc="${c.cardId}">核销 -1次</button>
              </div>`).join('')}
              ${subs.map((s) => `<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #f1f5f9;">
                <span>🚚 ${s.itemDesc}（余 ${s.remainDeliveries}期 · 下次${s.nextDate}）</span>
                <button class="pill-btn" data-done-sub="${s.subId}">送达打卡</button>
              </div>`).join('')}
              <hr style="border:none;border-top:1px solid #e2e8f0;margin:10px 0;"/>
              <div style="font-weight:700;font-size:13px;margin-bottom:6px;">+ 新办计次卡</div>
              <div class="grid-3" style="margin-bottom:8px;">
                <input id="pc-title" class="input" placeholder="套餐名(如理发/桶装水)" />
                <input id="pc-times" type="number" class="input" placeholder="总次数" value="10" />
                <input id="pc-price" type="number" class="input" placeholder="实收金额" />
              </div>
              <button class="btn btn-primary" style="width:100%;margin-bottom:10px;" id="pc-add-btn">办理计次卡</button>
              <div style="font-weight:700;font-size:13px;margin-bottom:6px;">+ 新增周期配送订户</div>
              <div class="grid-3" style="margin-bottom:8px;">
                <input id="sub-desc" class="input" placeholder="配送内容(如鲜奶2瓶)" />
                <input id="sub-days" type="number" class="input" placeholder="间隔天数" value="7" />
                <input id="sub-cnt" type="number" class="input" placeholder="总期数" value="12" />
              </div>
              <button class="btn btn-ok" style="width:100%;" id="sub-add-btn">开启周期配送</button>`);

            $('ui-drawer-body').querySelectorAll('[data-use-pc]').forEach((btn) => {
              btn.onclick = async () => { await pos.consumePunch(m.id, btn.dataset.usePc); closeDrawer(); renderAll(); };
            });
            $('ui-drawer-body').querySelectorAll('[data-done-sub]').forEach((btn) => {
              btn.onclick = async () => { await pos.completeSubscriptionDelivery(m.id, btn.dataset.doneSub); closeDrawer(); renderAll(); };
            });
            $('pc-add-btn').onclick = async () => {
              await pos.addPunchCard(m.id, { title: $('pc-title').value, totalTimes: $('pc-times').value, price: $('pc-price').value });
              closeDrawer();
              renderAll();
            };
            $('sub-add-btn').onclick = async () => {
              await pos.addSubscription(m.id, { itemDesc: $('sub-desc').value, intervalDays: $('sub-days').value, remainDeliveries: $('sub-cnt').value });
              closeDrawer();
              renderAll();
            };
          };
        });

        // 押金载具寄存与退还抽屉
        $('ui-member-list').querySelectorAll('[data-dep-manage]').forEach((b) => {
          b.onclick = () => {
            const m = vault.activeStoreData.members[b.dataset.depManage];
            const deps = (m.deposits || []).filter((d) => !d.returned);
            openDrawer(`<h3>🪣 ${m.name} · 押金载具寄存管理</h3>
              ${deps.map((d) => `<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #f1f5f9;">
                <span>${d.itemName}（押金 ¥${Number(d.amount).toFixed(2)}）</span>
                <button class="pill-btn" data-ret-dep="${d.depId}">退载具并退押金</button>
              </div>`).join('') || '<p style="font-size:12px;color:#64748b;">当前无未退押金</p>'}
              <div class="grid-2" style="margin:10px 0;">
                <input id="dep-item" class="input" placeholder="载具名称(如水桶/周转筐)" />
                <input id="dep-amt" type="number" class="input" placeholder="押金金额(元)" />
              </div>
              <button class="btn btn-primary" style="width:100%;" id="dep-add-btn">收取押金并登记</button>`);
            $('ui-drawer-body').querySelectorAll('[data-ret-dep]').forEach((btn) => {
              btn.onclick = async () => { await pos.refundDeposit(m.id, btn.dataset.retDep); closeDrawer(); renderAll(); };
            });
            $('dep-add-btn').onclick = async () => {
              await pos.addDeposit(m.id, { itemName: $('dep-item').value, amount: $('dep-amt').value });
              closeDrawer();
              renderAll();
            };
          };
        });
      }

      async function renderManageDashboard() {
        const canSee = vault.hasPerm('viewCost');
        $('ui-boss-dashboard-card').classList.toggle('hidden', !canSee);
        if (!canSee) return;
        const dash = await cat.getMultiStoreDashboard('today');
        $('ui-dash-rev').textContent = `¥${dash.totalRevenue.toFixed(2)}`;
        $('ui-dash-cost').textContent = `¥${(dash.totalCost + dash.totalExpense).toFixed(2)}`;
        $('ui-dash-profit').textContent = `¥${dash.totalNetProfit.toFixed(2)}`;
        $('ui-store-count-badge').textContent = vault.meta.stores.length > 1 ? `合并 ${vault.meta.stores.length} 家分店` : '本店经营';
      }

      function switchTab(tabName) {
        document.querySelectorAll('.tab').forEach((t) => t.classList.toggle('active', t.dataset.tab === tabName));
        ['shelf', 'pos', 'supply', 'members', 'manage'].forEach((v) => $(`view-${v}`).classList.toggle('hidden', v !== tabName));
        renderAll();
      }
      document.querySelectorAll('.tab').forEach((btn) => { btn.onclick = () => switchTab(btn.dataset.tab); });

      // 收银事件绑定
      $('btn-pos-scan-confirm').onclick = () => {
        const val = $('pos-universal-input').value;
        $('pos-universal-input').value = '';
        pos.handleUniversalInput(val);
        renderPosCart();
      };
      $('pos-universal-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('btn-pos-scan-confirm').click(); });

      $('btn-bt-scale').onclick = async () => {
        try {
          const devName = await pos.connectBluetoothScale((w) => { $('pos-universal-input').value = `*${w}`; });
          showMsg('⚖️ 蓝牙秤已连接', `已连接设备：${devName}`);
        } catch (e) { showMsg('蓝牙连接提示', e.message); }
      };

      $('btn-select-pos-member').onclick = () => {
        const list = Object.values(vault.activeStoreData.members || {});
        const lex = vault.getLexicon();

          </div>
          <button class="btn btn-primary" style="width:100%;" id="m-save">保存${lex.customerLabel}</button>`);
        $('m-save').onclick = async () => {
          if (!$('m-name').value.trim()) return;
          await pos.upsertMember({
            name: $('m-name').value.trim(),
            phone: $('m-phone').value.trim(),
            referrerId: $('m-ref') ? $('m-ref').value : ''
          });
          closeDrawer();
          renderAll();
        };
      };

      $('shelf-search-input').oninput = renderAll;
      $('member-search-input').oninput = renderMembers;
      window.addEventListener('sdxt:suggest-backup', () => $('ui-backup-toast').classList.remove('hidden'));
      $('btn-quick-share-backup').onclick = async () => {
        await vault.exportOrShareJsonBackup(true);
        $('ui-backup-toast').classList.add('hidden');
      };

      await renderAll();
    })();
  </script>
</body>
</html>
