<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>司机配送随车核销端</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans p-3 pb-16">
  <div class="max-w-md mx-auto space-y-3">
    <!-- 头部路线指示 -->
    <header class="bg-slate-800 text-white p-3.5 rounded-xl shadow flex justify-between items-center">
      <div>
        <h1 class="text-base font-bold">配送工单 · 城东A线</h1>
        <p class="text-xs text-slate-400">到达门店后核对货物并点击核销</p>
      </div>
      <button onclick="loadOrders()" class="bg-slate-700 text-white text-xs px-2.5 py-1.5 rounded-lg">刷新工单</button>
    </header>

    <!-- 门店送货工单列表 -->
    <div id="driver-orders" class="space-y-3">
      <div class="p-6 text-center text-slate-400 text-xs">正在载入配送任务...</div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://pzkszmbjktnpbutfhzko.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_mRyykwNHu1vD6zx-wJWi1A_EQXSh8Sz';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loadOrders() {
      const { data: orders } = await supabase.from('orders').select('*').order('id', { ascending: false });
      const container = document.getElementById('driver-orders');

      if (!orders || orders.length === 0) {
        container.innerHTML = '<div class="p-8 text-center text-slate-400 text-xs">今日该路线暂无待送货订单</div>';
        return;
      }

      container.innerHTML = orders.map(o => `
        <div class="bg-white p-3.5 rounded-xl shadow-sm border border-slate-200 space-y-2">
          <div class="flex justify-between items-start">
            <div>
              <div class="font-bold text-sm text-slate-800">${o.store_name}</div>
              <div class="text-xs text-slate-400 mt-0.5">单号: ${o.order_no}</div>
            </div>
            <span class="text-xs px-2 py-0.5 rounded font-bold ${o.status === 'DELIVERED' ? 'bg-emerald-50 text-emerald-600' : 'bg-amber-50 text-amber-600'}">
              ${o.status === 'DELIVERED' ? '已送达' : '待送达'}
            </span>
          </div>

          <div class="bg-slate-50 p-2 rounded-lg flex justify-between items-center text-xs">
            <span class="text-slate-500">本单金额:</span>
            <span class="font-bold text-sm text-indigo-700">¥${o.total_amount}</span>
          </div>

          ${o.status !== 'DELIVERED' ? `
            <div class="flex gap-2 pt-1">
              <button onclick="deliverOrder(${o.id}, ${o.store_id}, ${o.total_amount}, 'CASH')" class="flex-1 bg-emerald-600 active:bg-emerald-700 text-white font-bold text-xs py-2 rounded-lg shadow-sm">
                💵 现结并签收
              </button>
              <button onclick="deliverOrder(${o.id}, ${o.store_id}, ${o.total_amount}, 'CREDIT')" class="flex-1 bg-slate-700 active:bg-slate-800 text-white font-bold text-xs py-2 rounded-lg shadow-sm">
                📝 挂账签收
              </button>
            </div>
          ` : `
            <div class="text-[11px] text-slate-400 text-center font-bold py-1">
              ✓ 货款已核销 (${o.pay_status === 'PAID' ? '现结已清' : '记入挂账'})
            </div>
          `}
        </div>
      `).join('');
    }

    async function deliverOrder(orderId, storeId, amount, payType) {
      const payStatus = payType === 'CASH' ? 'PAID' : 'UNPAID';
      
      // 更新订单状态
      await supabase.from('orders').update({ status: 'DELIVERED', pay_status: payStatus }).eq('id', orderId);

      // 若现场现结，从小店欠款中减除
      if (payType === 'CASH') {
        const { data: st } = await supabase.from('store').select('current_debt').eq('id', storeId).single();
        if (st) {
          const updatedDebt = Math.max(0, st.current_debt - amount);
          await supabase.from('store').update({ current_debt: updatedDebt }).eq('id', storeId);
        }
      }

      alert('核销成功！');
      loadOrders();
    }

    loadOrders();
  </script>
</body>
</html>
