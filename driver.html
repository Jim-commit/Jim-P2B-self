<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>司机配送随车核销端</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans p-3 pb-16">
  <div class="max-w-md mx-auto space-y-3">
    <header class="bg-slate-800 text-white p-3.5 rounded-xl shadow flex justify-between items-center">
      <div>
        <h1 class="text-base font-bold">配送工单 · 城东A线</h1>
        <p class="text-xs text-slate-400">核对实收，支持手写签名与自动微信通知</p>
      </div>
      <button onclick="loadOrders()" class="bg-slate-700 text-white text-xs px-2.5 py-1.5 rounded-lg">刷新工单</button>
    </header>

    <div id="driver-orders" class="space-y-3">
      <div class="p-6 text-center text-slate-400 text-xs">正在载入配送任务...</div>
    </div>
  </div>

  <!-- 电子手写签名弹窗 -->
  <div id="signature-modal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-sm rounded-2xl p-4 space-y-3">
      <div class="flex justify-between items-center">
        <h3 class="font-bold text-sm text-slate-800">✍️ 门店老板验收签名</h3>
        <button onclick="closeSignModal()" class="text-slate-400 text-lg">✕</button>
      </div>
      <p class="text-[11px] text-slate-500">请核对货物并实收结清，在下方灰色画板上手写签名：</p>
      <div class="border border-slate-300 rounded-xl overflow-hidden bg-slate-50">
        <canvas id="sign-canvas" width="320" height="150" class="w-full touch-none cursor-crosshair"></canvas>
      </div>
      <div class="flex gap-2">
        <button onclick="clearCanvas()" class="flex-1 bg-slate-100 text-slate-600 text-xs font-bold py-2 rounded-xl">重签清空</button>
        <button onclick="confirmSettleWithSign()" class="flex-1 bg-emerald-600 text-white text-xs font-bold py-2 rounded-xl">确认并入账</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { supabase, currentTenant } from './src/lib/supabase.js';
    import { sendWechatNotice } from './src/lib/notify.js';

    if (!currentTenant) {
      document.body.innerHTML = `
        <div class="min-h-screen bg-slate-100 flex items-center justify-center p-4">
          <div class="bg-white p-6 rounded-2xl shadow max-w-xs w-full text-center space-y-3">
            <div class="text-4xl">🚚</div>
            <h2 class="text-base font-bold text-slate-800">未指定车队所属总代</h2>
            <p class="text-xs text-slate-500 leading-relaxed">司机核销端必须从排班任务看板接入，请联系调度员下发派车单。</p>
            <div class="pt-2 border-t border-slate-100 space-y-2">
              <span class="text-[11px] text-slate-400 block">测试入口快速接入：</span>
              <a href="?tenant=BJ_HQ" class="block w-full bg-slate-800 active:bg-slate-900 text-white text-xs font-bold py-2 rounded-lg">登录北京车队</a>
              <a href="?tenant=SH_HQ" class="block w-full bg-teal-700 active:bg-teal-800 text-white text-xs font-bold py-2 rounded-lg">登录上海车队</a>
            </div>
          </div>
        </div>
      `;
      throw new Error('未指定总代租户，拒绝核销。');
    }

    let loadedOrders = [];
    let activeOrderId = null;
    let activePayMethod = null;
    let canvas, ctx, isDrawing = false;

    window.loadOrders = async function() {
      const { data: orders, error } = await supabase.from('orders').select('*').order('id', { ascending: false });
      const container = document.getElementById('driver-orders');

      loadedOrders = orders || [];
      if (!orders || orders.length === 0) {
        container.innerHTML = '<div class="p-8 text-center text-slate-400 text-xs">今日暂无待配送订单</div>';
        return;
      }

      container.innerHTML = orders.map(o => `
        <div class="bg-white p-3.5 rounded-xl shadow-sm border border-slate-200 space-y-2">
          <div class="flex justify-between items-start">
            <div>
              <div class="font-bold text-sm text-slate-800">${o.store_name}</div>
              <div class="text-xs text-slate-400 mt-0.5">单号: ${o.order_no}</div>
            </div>
            <span class="text-xs px-2 py-0.5 rounded font-bold ${o.status === 'DELIVERED' ? 'bg-emerald-50 text-emerald-600' : 'bg-amber-50 text-amber-600'}">
              ${o.status === 'DELIVERED' ? '已送达' : '待配送'}
            </span>
          </div>

          <div class="bg-slate-50 p-2.5 rounded-lg space-y-1.5 text-xs">
            <div class="flex justify-between">
              <span class="text-slate-500">应收金额:</span>
              <span class="font-bold text-indigo-700">¥${o.total_amount}</span>
            </div>
            ${o.status !== 'DELIVERED' ? `
              <div class="flex items-center gap-2 pt-1 border-t border-slate-200">
                <span class="text-slate-500">实收金额:</span>
                <input type="number" id="actual-amt-${o.id}" value="${o.total_amount}" class="flex-1 bg-white border border-slate-300 rounded px-2 py-1 text-xs font-bold text-slate-800">
              </div>
              <input type="text" id="reject-reason-${o.id}" placeholder="如有损耗/少件请在此输入原因" class="w-full bg-white border border-slate-200 rounded px-2 py-1 text-[11px]">
            ` : `
              <div class="flex justify-between text-slate-500">
                <span>实收金额:</span>
                <span class="font-bold text-slate-800">¥${o.actual_amount || o.total_amount}</span>
              </div>
              ${o.reject_reason ? `<div class="text-red-500 text-[10px]">备注: ${o.reject_reason}</div>` : ''}
            `}
          </div>

          ${o.status !== 'DELIVERED' ? `
            <div class="flex gap-2 pt-1">
              <button onclick="openSignature(${o.id}, 'CASH')" class="flex-1 bg-emerald-600 active:bg-emerald-700 text-white font-bold text-xs py-2 rounded-lg shadow-sm">
                💵 现金核销
              </button>
              <button onclick="openSignature(${o.id}, 'WECHAT')" class="flex-1 bg-teal-600 active:bg-teal-700 text-white font-bold text-xs py-2 rounded-lg shadow-sm">
                📱 微信转账
              </button>
              <button onclick="openSignature(${o.id}, 'CREDIT')" class="flex-1 bg-slate-700 active:bg-slate-800 text-white font-bold text-xs py-2 rounded-lg shadow-sm">
                📝 挂账签收
              </button>
            </div>
          ` : `
            <div class="text-[11px] text-slate-400 text-center font-bold py-0.5">
              ✓ 货款对账已结清 (${o.pay_status === 'PAID' ? '现结入账' : '已入挂账'})
            </div>
          `}
        </div>
      `).join('');
    };

    function initCanvas() {
      canvas = document.getElementById('sign-canvas');
      ctx = canvas.getContext('2d');
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      ctx.strokeStyle = '#1e293b';

      const getPos = (e) => {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: clientX - rect.left, y: clientY - rect.top };
      };

      const start = (e) => { isDrawing = true; const p = getPos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); };
      const draw = (e) => { if (!isDrawing) return; const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); };
      const stop = () => { isDrawing = false; };

      canvas.addEventListener('mousedown', start);
      canvas.addEventListener('mousemove', draw);
      window.addEventListener('mouseup', stop);

      canvas.addEventListener('touchstart', start, { passive: false });
      canvas.addEventListener('touchmove', (e) => { e.preventDefault(); draw(e); }, { passive: false });
      window.addEventListener('touchend', stop);
    }

    window.openSignature = function(orderId, payMethod) {
      activeOrderId = orderId;
      activePayMethod = payMethod;
      document.getElementById('signature-modal').classList.remove('hidden');
      if (!canvas) initCanvas();
      window.clearCanvas();
    };

    window.closeSignModal = function() {
      document.getElementById('signature-modal').classList.add('hidden');
    };

    window.clearCanvas = function() {
      if (ctx && canvas) ctx.clearRect(0, 0, canvas.width, canvas.height);
    };

    window.confirmSettleWithSign = async function() {
      const actualAmt = parseFloat(document.getElementById(`actual-amt-${activeOrderId}`).value);
      const reason = document.getElementById(`reject-reason-${activeOrderId}`).value.trim();

      if (isNaN(actualAmt) || actualAmt < 0) return alert('请输入有效的实收金额！');

      const targetOrder = loadedOrders.find(it => it.id === activeOrderId);
      const finalRemark = reason ? `${reason} (已电子签名)` : '已电子签名验收';

      const { data, error } = await supabase.rpc('deliver_and_settle_order', {
        p_order_id: activeOrderId,
        p_pay_method: activePayMethod,
        p_actual_amount: actualAmt,
        p_reject_reason: finalRemark,
        p_operator: '送货司机'
      });

      if (error) {
        alert(error.message);
      } else {
        const storeName = targetOrder ? targetOrder.store_name : '辖区门店';
        const orderNo = targetOrder ? targetOrder.order_no : '未知单号';
        const methodText = activePayMethod === 'CASH' ? '现钞收讫' : (activePayMethod === 'WECHAT' ? '微信扫码转账' : '挂账赊销确认');
        
        const noticeTitle = `💰 实收账款入账：${storeName} (¥${actualAmt.toFixed(2)})`;
        const noticeDesp = `### 司机送达现场收款通知\n- **结款门店**：${storeName}\n- **收款金额**：¥${actualAmt.toFixed(2)}\n- **结账方式**：${methodText}\n- **关联合同单号**：\`${orderNo}\`\n- **现场核验**：门店老板已在司机手持终端手写签名验收\n- **损耗与备注**：${finalRemark}\n\n[👉 点击打开总代中台查验对账流水](https://goods-lucky.vercel.app/hq.html?tenant=${currentTenant})`;

        sendWechatNotice(noticeTitle, noticeDesp);

        alert('核销成功！实收流水已实时登账并已触发微信通知。');
        window.closeSignModal();
        window.loadOrders();
      }
    };

    window.loadOrders();
  </script>
</body>
</html>
