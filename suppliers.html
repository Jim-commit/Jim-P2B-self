<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>严选供货商名录 · B2B 实体货源招商黄页</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; background-color: #f7f5f0; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="text-stone-800 pb-20">

  <!-- 顶部导航栏 -->
  <header class="bg-[#1b4332] text-white sticky top-0 z-30 shadow-md">
    <div class="max-w-5xl mx-auto px-4 py-3.5 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-xl bg-amber-400 flex items-center justify-center font-bold text-stone-900 text-lg shadow-xs">供</div>
        <div>
          <h1 class="text-base font-bold leading-tight tracking-wide">严选供货商名录</h1>
          <p class="text-[11px] text-emerald-200">源头厂商直供 · 资质核验 · 送货到店</p>
        </div>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <a href="join.html" class="px-3.5 py-1.5 rounded-xl bg-amber-400 hover:bg-amber-300 text-stone-900 font-bold shadow transition">
          + 厂商入驻
        </a>
      </div>
    </div>
  </header>

  <!-- 顶部价值宣言与搜索栏 -->
  <section class="bg-gradient-to-b from-[#1b4332] to-[#143628] text-white pt-3 pb-8 px-4">
    <div class="max-w-5xl mx-auto">
      <div class="bg-white/10 backdrop-blur-sm border border-emerald-400/25 rounded-2xl p-4 mb-4">
        <div class="flex flex-wrap items-center justify-between gap-2">
          <div>
            <span class="inline-block px-2 py-0.5 text-[11px] font-bold bg-emerald-400/20 text-emerald-200 border border-emerald-300/30 rounded-lg mb-1">
              纯 B2B 实体批发对接
            </span>
            <h2 class="text-lg font-bold">寻找本地一手优质供货商</h2>
            <p class="text-xs text-emerald-100/90 mt-0.5">所有展示厂商均已核验营业执照，支持预约业务员上门送样、先验货后合作。</p>
          </div>
          <div class="text-right hidden sm:block">
            <div class="text-2xl font-bold text-amber-300 font-mono" id="stat-supplier-count">-</div>
            <div class="text-[11px] text-emerald-200">已核验源头厂商</div>
          </div>
        </div>
      </div>

      <!-- 搜索框 -->
      <div class="relative">
        <input
          type="text"
          id="search-input"
          placeholder="搜索商号名称、代号、主营货品（如：花生油、大米、酒水、日化）..."
          class="w-full pl-10 pr-4 py-3 rounded-2xl bg-white text-stone-900 placeholder-stone-400 text-sm shadow-lg focus:outline-none focus:ring-2 focus:ring-amber-400"
        />
        <svg class="w-5 h-5 text-stone-400 absolute left-3.5 top-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>
      </div>
    </div>
  </section>

  <!-- 主体列表区 -->
  <main class="max-w-5xl mx-auto px-4 -mt-4">
    <!-- 加载状态 -->
    <div id="loading-state" class="bg-white rounded-3xl p-10 text-center shadow-sm border border-stone-200/80">
      <div class="inline-block w-8 h-8 border-4 border-[#1b4332] border-t-transparent rounded-full animate-spin mb-3"></div>
      <p class="text-sm text-stone-500">正在加载已核验供货商名录...</p>
    </div>

    <!-- 空状态 -->
    <div id="empty-state" class="hidden bg-white rounded-3xl p-10 text-center shadow-sm border border-stone-200/80">
      <p class="text-base font-bold text-stone-700">暂未找到匹配的供货商</p>
      <p class="text-xs text-stone-400 mt-1">请尝试更换关键词，或欢迎优质厂商点击右上角申请入驻</p>
    </div>

    <!-- 供货商卡片容器 -->
    <div id="supplier-list" class="space-y-4"></div>
  </main>

  <!-- 预约送样 / 申请供货弹窗 -->
  <div id="inquiry-modal" class="fixed inset-0 z-50 hidden bg-stone-900/75 backdrop-blur-xs flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl shadow-2xl overflow-hidden">
      <div class="px-5 py-4 bg-[#1b4332] text-white flex items-center justify-between">
        <div>
          <h3 class="text-base font-bold">预约供货商上门送样 / 洽谈</h3>
          <p class="text-xs text-amber-300 mt-0.5 font-bold" id="modal-supplier-name">目标厂商：-</p>
        </div>
        <button onclick="window.closeInquiryModal()" class="text-emerald-200 hover:text-white p-1 text-lg">✕</button>
      </div>

      <form id="inquiry-form" class="p-5 space-y-3.5 text-xs">
        <input type="hidden" id="modal-tenant-id" />

        <div>
          <label class="block font-bold text-stone-700 mb-1">您的实体店 / 公司名称 <span class="text-rose-500">*</span></label>
          <input type="text" id="lead-store-name" required placeholder="例如：阳光便利店 / 兴隆百货超市" class="w-full px-3.5 py-2.5 text-sm bg-stone-50 border border-stone-200 rounded-xl focus:border-emerald-700 focus:outline-none" />
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block font-bold text-stone-700 mb-1">联系人称呼 <span class="text-rose-500">*</span></label>
            <input type="text" id="lead-contact-name" required placeholder="例如：张老板" class="w-full px-3.5 py-2.5 text-sm bg-stone-50 border border-stone-200 rounded-xl focus:border-emerald-700 focus:outline-none" />
          </div>
          <div>
            <label class="block font-bold text-stone-700 mb-1">联系电话 / 微信 <span class="text-rose-500">*</span></label>
            <input type="tel" id="lead-phone" required placeholder="11位手机号" class="w-full px-3.5 py-2.5 text-sm bg-stone-50 border border-stone-200 rounded-xl focus:border-emerald-700 focus:outline-none font-mono" />
          </div>
        </div>

        <div>
          <label class="block font-bold text-stone-700 mb-1">店铺详细地址 <span class="text-rose-500">*</span></label>
          <input type="text" id="lead-address" required placeholder="街道门牌号，方便业务员上门送样" class="w-full px-3.5 py-2.5 text-sm bg-stone-50 border border-stone-200 rounded-xl focus:border-emerald-700 focus:outline-none" />
        </div>

        <div>
          <label class="block font-bold text-stone-700 mb-1">意向货品或备注（选填）</label>
          <textarea id="lead-note" rows="2" placeholder="例如：想了解饮料整箱批发价，每周大概进货20箱" class="w-full px-3.5 py-2 text-sm bg-stone-50 border border-stone-200 rounded-xl focus:border-emerald-700 focus:outline-none"></textarea>
        </div>

        <div class="bg-amber-50 border border-amber-200 rounded-xl p-3 text-[11px] text-amber-900 leading-relaxed">
          💡 提交后线索将直达厂商调度中枢，厂商业务员或供货师傅将电话联系您安排上门送样与开通专属进货账号。
        </div>

        <button type="submit" id="submit-inquiry-btn" class="w-full py-3 rounded-xl bg-[#1b4332] hover:bg-[#143628] text-white font-bold text-sm shadow-md transition active:scale-95">
          确认提交合作意向
        </button>
      </form>
    </div>
  </div>

  <!-- 底部四个标准工作台导航 -->
  <footer class="fixed bottom-0 inset-x-0 bg-white border-t border-stone-200 py-2 px-4 z-20">
    <div class="max-w-5xl mx-auto flex items-center justify-around text-xs text-stone-600">
      <a href="suppliers.html" class="flex flex-col items-center text-[#1b4332] font-bold">
        <span>🏢 供货商名录</span>
      </a>
      <a href="index.html" class="flex flex-col items-center hover:text-stone-900">
        <span>🛒 门店订货台</span>
      </a>
      <a href="driver.html" class="flex flex-col items-center hover:text-stone-900">
        <span>🚚 司机配送端</span>
      </a>
      <a href="hq.html" class="flex flex-col items-center hover:text-stone-900">
        <span>📊 厂商管理台</span>
      </a>
    </div>
  </footer>

  <script type="module">
    import { supabase } from './src/lib/supabase.js';

    let allSuppliers = [];

    // 演示兜底数据（当数据库暂无已激活厂商或网络异常时平滑兜底展示）
    const DEMO_SUPPLIERS = [
      {
        tenant_id: 'DEMO-HX888',
        name: '华兴源头粮油食品商行（示例展位）',
        category: '粮油米面 · 调味干货',
        city: '本地核心仓储配送圈',
        description: '专注社区超市、餐饮店一站式粮油调味直供，自有厢式货车每日早晚两班准时送货到店，破损包退。',
        products: [
          { name: '非转基因一级压榨花生油', spec: '5L×4桶/箱', measure_unit: '箱', origin_place: '源头工坊原产', image_url: '' },
          { name: '东北长粒香大米（餐饮专供）', spec: '25kg/袋', measure_unit: '袋', origin_place: '黑龙江五常', image_url: '' },
          { name: '特级酿造酱油商用装', spec: '1.9L×6瓶/箱', measure_unit: '箱', origin_place: '原生态酿造', image_url: '' }
        ]
      }
    ];

    async function loadSuppliers() {
      const loadingEl = document.getElementById('loading-state');
      const emptyEl = document.getElementById('empty-state');

      try {
        if (!supabase) {
          allSuppliers = DEMO_SUPPLIERS;
          renderSuppliers(allSuppliers);
          return;
        }

        // 1. 读取真实厂商表 platform_tenant（在册且未停用）
        const { data: tenants, error: tErr } = await supabase
          .from('platform_tenant')
          .select('*')
          .eq('is_active', true)
          .order('id', { ascending: false });

        if (tErr) throw tErr;

        // 过滤出开通了实体门店供货（Brick-and-mortar）的厂商
        const validTenants = (tenants || []).filter(t =>
          (t.permit_brick_and_mortar !== false) && (t.service_mode !== 'online')
        );

        if (validTenants.length === 0) {
          allSuppliers = DEMO_SUPPLIERS;
          renderSuppliers(allSuppliers);
          return;
        }

        // 2. 读取在售实体供货商品作为招牌样品预览（不泄露 tier_1_price 内部底价）
        const { data: products, error: pErr } = await supabase
          .from('product')
          .select('id, tenant_id, name, category_main, category_sub, spec, measure_unit, origin_place, image_url, status, channel_brick_and_mortar, sales_channel_type')
          .eq('status', 'active');

        if (pErr) console.warn('读取商品样例失败:', pErr);

        const productMap = {};
        (products || []).forEach(p => {
          const isBM = (p.channel_brick_and_mortar !== undefined) ? p.channel_brick_and_mortar : (p.sales_channel_type !== 'online');
          if (!isBM) return;
          if (!productMap[p.tenant_id]) productMap[p.tenant_id] = [];
          if (productMap[p.tenant_id].length < 8) {
            productMap[p.tenant_id].push(p);
          }
        });

        allSuppliers = validTenants.map(t => {
          const prods = productMap[t.tenant_id] || [];
          const cats = Array.from(new Set(prods.map(p => p.category_main).filter(Boolean)));
          return {
            tenant_id: t.tenant_id,
            name: t.company_name || t.tenant_id,
            category: t.business_scope || (cats.length > 0 ? cats.join(' · ') : '实体全品类直供'),
            city: t.region || t.address || '本地仓储配送覆盖',
            description: t.intro || `源头正规供货商（商号：${t.tenant_id}），营业执照与资质已核验，支持签约门店定期配送、电子签收与往来授信对账。`,
            products: prods
          };
        });

        renderSuppliers(allSuppliers);
      } catch (err) {
        console.error('加载供货商名录失败，已切换至兜底演示数据:', err);
        allSuppliers = DEMO_SUPPLIERS;
        renderSuppliers(allSuppliers);
      } finally {
        loadingEl.classList.add('hidden');
      }
    }

    function renderSuppliers(list) {
      const listEl = document.getElementById('supplier-list');
      const emptyEl = document.getElementById('empty-state');
      const countEl = document.getElementById('stat-supplier-count');

      countEl.textContent = list.length;

      if (!list.length) {
        listEl.innerHTML = '';
        emptyEl.classList.remove('hidden');
        return;
      }

      emptyEl.classList.add('hidden');
      listEl.innerHTML = list.map(s => {
        const samplesHtml = s.products.length > 0
          ? `<div class="mt-3.5 pt-3 border-t border-stone-100">
              <div class="text-[11px] font-bold text-stone-400 mb-2">主营招牌货品预览（签约后享专属批发底价）：</div>
              <div class="flex gap-2.5 overflow-x-auto no-scrollbar pb-1">
                ${s.products.map(p => `
                  <div class="shrink-0 w-40 bg-stone-50 border border-stone-200/80 rounded-2xl p-2.5 flex flex-col justify-between">
                    <div>
                      ${p.image_url ? `<img src="${p.image_url}" class="w-full h-20 object-cover rounded-xl mb-2 border border-stone-200/60">` : ''}
                      <div class="text-xs font-bold text-stone-800 line-clamp-2" title="${p.name}">${p.name}</div>
                      <div class="text-[11px] text-stone-500 mt-1 truncate">规格：${p.spec || '整装'}</div>
                    </div>
                    <div class="mt-2 flex items-center justify-between">
                      <span class="inline-block px-1.5 py-0.5 rounded bg-amber-100/80 text-amber-900 text-[10px] font-bold">
                        单位：${p.measure_unit || '箱'}
                      </span>
                      ${p.origin_place ? `<span class="text-[9px] text-emerald-800 truncate max-w-[70px]">${p.origin_place}</span>` : ''}
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>`
          : '';

        return `
          <article class="bg-white rounded-3xl p-4 sm:p-5 shadow-sm border border-stone-200/80 hover:border-emerald-400 transition">
            <div class="flex flex-col sm:flex-row sm:items-start justify-between gap-3">
              <div class="flex-1">
                <div class="flex flex-wrap items-center gap-2">
                  <h3 class="text-base sm:text-lg font-bold text-stone-900">${s.name}</h3>
                  <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-bold bg-emerald-50 text-emerald-800 border border-emerald-200">
                    ✓ 营业执照已核验
                  </span>
                  <span class="px-2 py-0.5 rounded-lg text-[11px] bg-stone-100 text-stone-700 font-mono font-bold">商号：${s.tenant_id}</span>
                </div>

                <div class="flex flex-wrap items-center gap-x-4 gap-y-1 text-xs text-stone-500 mt-1.5">
                  <span>📦 主营：${s.category}</span>
                  <span>📍 覆盖：${s.city}</span>
                </div>

                <p class="text-xs sm:text-sm text-stone-600 mt-2.5 leading-relaxed">
                  ${s.description}
                </p>
              </div>

              <div class="flex sm:flex-col items-center sm:items-end justify-center shrink-0 pt-2 sm:pt-0 border-t sm:border-t-0 border-stone-100">
                <button
                  onclick="window.openInquiryModal('${escapeHtml(s.tenant_id)}', '${escapeHtml(s.name)}')"
                  class="w-full sm:w-auto px-5 py-2.5 rounded-xl bg-[#1b4332] hover:bg-[#143628] text-white text-xs font-bold shadow transition cursor-pointer active:scale-95"
                >
                  预约送样 / 申请供货
                </button>
              </div>
            </div>
            ${samplesHtml}
          </article>
        `;
      }).join('');
    }

    // 搜索过滤
    document.getElementById('search-input').addEventListener('input', (e) => {
      const kw = e.target.value.trim().toLowerCase();
      if (!kw) {
        renderSuppliers(allSuppliers);
        return;
      }
      const filtered = allSuppliers.filter(s =>
        s.name.toLowerCase().includes(kw) ||
        s.tenant_id.toLowerCase().includes(kw) ||
        s.category.toLowerCase().includes(kw) ||
        s.city.toLowerCase().includes(kw) ||
        s.products.some(p => p.name.toLowerCase().includes(kw))
      );
      renderSuppliers(filtered);
    });

    // 弹窗控制
    window.openInquiryModal = (tenantId, tenantName) => {
      document.getElementById('modal-tenant-id').value = tenantId;
      document.getElementById('modal-supplier-name').textContent = `目标厂商：${tenantName} (${tenantId})`;
      document.getElementById('inquiry-modal').classList.remove('hidden');
    };

    window.closeInquiryModal = () => {
      document.getElementById('inquiry-modal').classList.add('hidden');
      document.getElementById('inquiry-form').reset();
    };

    // 提交预约送样线索 -> 直达目标厂商 hq.html 的“新店招商线索”队列
    document.getElementById('inquiry-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit-inquiry-btn');
      btn.disabled = true;
      btn.textContent = '正在提交...';

      const tenantId = document.getElementById('modal-tenant-id').value;
      const storeName = document.getElementById('lead-store-name').value.trim();
      const contactName = document.getElementById('lead-contact-name').value.trim();
      const phone = document.getElementById('lead-phone').value.trim();
      const address = document.getElementById('lead-address').value.trim();
      const note = document.getElementById('lead-note').value.trim();

      const orderNo = `LEAD-${new Date().toISOString().slice(0, 10).replace(/-/g, '')}-${Math.floor(1000 + Math.random() * 9000)}`;

      try {
        if (supabase && !tenantId.startsWith('DEMO-')) {
          const { error } = await supabase.from('store_order').insert([{
            order_no: orderNo,
            tenant_id: tenantId,
            store_name: storeName,
            driver_name: '待指派业务员',
            order_source: 'b2b_directory_lead',
            settlement_type: 'credit',
            settlement_note: `${contactName}|${phone}|${address}`,
            items: [],
            items_return: [],
            items_exchange: [],
            total_amount: 0,
            return_amount: 0,
            net_settle_amount: 0,
            order_status: 'pending_confirm',
            delivery_status: 'lead_pending',
            note: `[新店招商线索] 联系人:${contactName} | 电话:${phone} | 地址:${address}${note ? ' | 意向:' + note : ''}`,
            driver_action_instruction: `【新店送样线索】联系 ${contactName}(${phone}) 上门洽谈`
          }]);

          if (error) throw error;
        }

        alert('✅ 合作意向已直达厂商调度中枢！厂商业务员或供货师傅将尽快电话联系您安排上门送样。');
        window.closeInquiryModal();
      } catch (err) {
        console.error('提交线索失败:', err);
        alert('提交遇到网络波动，请稍后重试或直接联系厂商：' + (err.message || ''));
      } finally {
        btn.disabled = false;
        btn.textContent = '确认提交合作意向';
      }
    });

    function escapeHtml(str) {
      return String(str || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }

    loadSuppliers();
  </script>
</body>
</html>
