<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>商道相通 · 电脑宽屏全面调度台</title>
  <link rel="stylesheet" href="./src/styles/tailwind.css">
</head>
<body class="bg-[#f7f5f0] text-stone-800 font-sans min-h-screen flex flex-col">

  <!-- 与 index.html 完全同源的松林翠绿顶栏 -->
  <header class="bg-gradient-to-r from-[#1b4332] via-[#2d6a4f] to-[#1b4332] text-white px-6 py-3.5 shadow-md flex items-center justify-between gap-4">
    <div class="flex items-center gap-3">
      <span class="text-lg font-bold tracking-tight">🏮 商道相通 · 电脑宽屏全面调度台</span>
      <span id="pc-branch-badge" class="bg-[#d4a373] text-stone-900 text-xs px-2.5 py-0.5 rounded-full font-bold">厚德便民门店</span>
      <span class="text-xs text-emerald-100/80 hidden md:inline">人尽其才 · 物尽其用 · 地尽其利 · 货畅其流</span>
    </div>
    <div class="flex items-center gap-2 text-xs">
      <a href="hq.html" class="px-3 py-1.5 rounded-xl bg-white/10 hover:bg-white/20 transition">🏭 批发调度</a>
      <a href="mall.html" class="px-3 py-1.5 rounded-xl bg-white/10 hover:bg-white/20 transition">🛍️ 逛大集</a>
      <a href="suppliers.html" class="px-3 py-1.5 rounded-xl bg-white/10 hover:bg-white/20 transition">🔎 供需名录</a>
      <a href="driver.html" class="px-3 py-1.5 rounded-xl bg-white/10 hover:bg-white/20 transition">🚛 物流履约</a>
      <a href="index.html" class="px-3 py-1.5 rounded-xl bg-amber-400 text-stone-950 font-bold hover:bg-amber-300 transition">📱 返回手机工作台</a>
    </div>
  </header>

  <main class="max-w-6xl w-full mx-auto p-5 grid grid-cols-1 lg:grid-cols-3 gap-5 flex-1">
    <!-- 左栏：模块选配与商道主线快捷调度 -->
    <section class="bg-white rounded-3xl p-5 border border-stone-200/80 shadow-sm space-y-4">
      <div class="flex justify-between items-center border-b border-stone-100 pb-2.5">
        <h2 class="font-bold text-sm text-emerald-950">⚙️ 门店模块自由选配（与手机端实时同源）</h2>
      </div>
      <div id="pc-module-list" class="space-y-2 text-xs"></div>
    </section>

    <!-- 中栏：铁账四位并立 & 家庭支取隔离 & 稽核体检 -->
    <section class="bg-white rounded-3xl p-5 border border-stone-200/80 shadow-sm space-y-4">
      <div class="flex justify-between items-center border-b border-stone-100 pb-2.5">
        <h2 class="font-bold text-sm text-emerald-950">🛡️ 铁账四位并立与主权稽核台</h2>
        <span id="pc-audit-tag" class="text-[11px] bg-emerald-100 text-emerald-900 px-2.5 py-0.5 rounded-full font-bold">四方吻合</span>
      </div>
      <div class="grid grid-cols-2 gap-3 text-xs">
        <div class="bg-stone-50 p-3 rounded-2xl border border-stone-200">
          <span class="text-[10px] text-stone-400 block">独立钱箱实有现金</span>
          <b id="pc-cash-val" class="text-lg font-mono text-emerald-950">¥0.00</b>
        </div>
        <div class="bg-amber-50/70 p-3 rounded-2xl border border-amber-200">
          <span class="text-[10px] text-amber-800 block">家庭私人支取(已隔离)</span>
          <b id="pc-family-val" class="text-lg font-mono text-amber-900">¥0.00</b>
        </div>
      </div>
      <div class="flex gap-2 text-xs">
        <button type="button" id="pc-btn-family" class="flex-1 py-2.5 rounded-xl bg-amber-100 hover:bg-amber-200 text-amber-950 font-bold">🏠 记家庭私人支取</button>
        <button type="button" id="pc-btn-export" class="flex-1 py-2.5 rounded-xl bg-[#1b4332] text-amber-300 font-bold">🔐 导出加密铁账包</button>
      </div>
    </section>

    <!-- 右栏：链式防篡改凭证流水（只增不删 · 红字冲销） -->
    <section class="bg-white rounded-3xl p-5 border border-stone-200/80 shadow-sm space-y-4">
      <div class="flex justify-between items-center border-b border-stone-100 pb-2.5">
        <h2 class="font-bold text-sm text-emerald-950">📑 不可篡改链式凭证流水</h2>
        <span class="text-[10px] text-stone-400">只增不删 · 红字冲销</span>
      </div>
      <div id="pc-voucher-list" class="space-y-2 text-xs max-h-[60vh] overflow-y-auto"></div>
    </section>
  </main>

  <script type="module">
    import { StoreCoreEngine, OPTIONAL_UI_MODULES, roundMoney } from './src/modules/store/storeCoreEngine.js';

    const engine = new StoreCoreEngine();

    function renderPcDashboard() {
      const branch = localStorage.getItem('baigong_active_branch_name');
      if (branch) document.getElementById('pc-branch-badge').textContent = branch;

      const audit = coreAudit();
      document.getElementById('pc-audit-tag').textContent = audit.passed ? `🛡️ 四方吻合 (${audit.totalVouchers}单)` : '⚠️ 发现断链疑点';
      document.getElementById('pc-cash-val').textContent = `¥${roundMoney(engine.state.cashBook.currentCash).toFixed(2)}`;
      document.getElementById('pc-family-val').textContent = `¥${roundMoney(engine.state.cashBook.familyDrawTotal).toFixed(2)}`;

      const modHost = document.getElementById('pc-module-list');
      modHost.innerHTML = OPTIONAL_UI_MODULES.map(m => {
        const checked = engine.isUiModuleEnabled(m.id);
        return `
          <label class="flex items-center justify-between bg-stone-50 px-3 py-2.5 rounded-2xl border border-stone-200 cursor-pointer">
            <div>
              <div class="font-bold text-stone-800">${m.name} <span class="text-[10px] text-emerald-800 bg-emerald-100 px-1.5 rounded">${m.pillar}</span></div>
              <div class="text-[10px] text-stone-400 mt-0.5">${m.desc}</div>
            </div>
            <input type="checkbox" data-pc-mod="${m.id}" ${checked ? 'checked' : ''} class="w-4 h-4 accent-[#1b4332]">
          </label>
        `;
      }).join('');

      modHost.querySelectorAll('[data-pc-mod]').forEach(chk => {
        chk.onchange = () => {
          engine.setUiModuleEnabled(chk.dataset.pcMod, chk.checked);
          renderPcDashboard();
        };
      });

      const vHost = document.getElementById('pc-voucher-list');
      const list = engine.state.vouchers.slice(0, 20);
      vHost.innerHTML = list.length === 0
        ? '<div class="text-center text-stone-400 py-8">暂无本地扩展凭证记录</div>'
        : list.map(v => `
          <div class="p-2.5 rounded-2xl border border-stone-200 flex justify-between items-center ${v.status === 'VOIDED' ? 'opacity-50 line-through bg-rose-50' : 'bg-stone-50'}">
            <div>
              <b class="text-stone-800">${v.id}</b> <span class="text-[10px] text-stone-500">(${v.type})</span>
              <div class="text-[10px] text-stone-400 font-mono">${v.hash}</div>
            </div>
            <div class="text-right">
              <b class="font-mono text-emerald-950">¥${v.totalAmount.toFixed(2)}</b>
              ${v.status === 'POSTED' && v.type !== 'VOID_RED' ? `<button type="button" data-pc-void="${v.id}" class="block ml-auto mt-1 text-[10px] text-rose-600 underline">红字冲销</button>` : ''}
            </div>
          </div>
        `).join('');

      vHost.querySelectorAll('[data-pc-void]').forEach(btn => {
        btn.onclick = () => {
          const reason = prompt('输入红字冲销原因：', '录错更正');
          if (!reason) return;
          const res = engine.voidVoucherWithRedEntry(btn.dataset.pcVoid, reason);
          alert(res.message);
          renderPcDashboard();
        };
      });
    }

    function coreAudit() {
      return engine.runIronAbacusAudit();
    }

    document.getElementById('pc-btn-family').onclick = () => {
      const amt = roundMoney(prompt('输入老板私人/家庭支取现金金额（只扣钱箱，绝不污染经营利润）：', '100'));
      if (amt > 0) {
        coreEngineCommitFamily(amt);
      }
    };

    function coreEngineCommitFamily(amt) {
      engine.commitVoucher({ type: 'FAMILY_DRAW', totalAmount: amt, payMethod: 'CASH', note: '电脑台登记家庭支取' });
      renderPcDashboard();
    }

    document.getElementById('pc-btn-export').onclick = async () => {
      const pass = prompt('可选：输入微信转发加密口令（留空则导出防篡改封签包）：', '');
      if (pass === null) return;
      const pkg = await engine.exportIronBackup(pass.trim());
      const blob = new Blob([JSON.stringify(pkg, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `商道铁账加密备份_${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
    };

    renderPcDashboard();
  </script>
</body>
</html>
