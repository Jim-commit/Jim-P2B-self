<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>商道相通 · 百工商业全域智慧工作台（电脑全面调度台）</title>
  <style>
    :root {
      --bg-page: #f4f6f8;
      --bg-card: #ffffff;
      --bg-subtle: #f8fafc;
      --border-light: #e2e8f0;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --primary: #0f766e;
      --primary-light: #ccfbf1;
      --primary-dark: #115e59;
      --accent: #b45309;
      --accent-bg: #fef3c7;
      --danger: #be123c;
      --danger-bg: #ffe4e6;
      --success: #15803d;
      --success-bg: #dcfce7;
      --radius: 10px;
      --shadow: 0 2px 8px rgba(15, 23, 42, 0.05);
      --font-scale: 1;
    }

    body.elder-mode { --font-scale: 1.25; }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg-page);
      color: var(--text-main);
      font-size: calc(14px * var(--font-scale));
      line-height: 1.5;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    .topbar {
      background: #ffffff;
      border-bottom: 1px solid var(--border-light);
      padding: 10px 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      z-index: 20;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: calc(16px * var(--font-scale));
      color: var(--primary-dark);
      white-space: nowrap;
    }
    .store-select {
      padding: 4px 10px;
      border-radius: 999px;
      font-weight: 700;
      background: var(--bg-subtle);
      border: 1px solid var(--border-light);
      color: var(--primary-dark);
      cursor: pointer;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: calc(12px * var(--font-scale));
      background: var(--bg-subtle);
      border: 1px solid var(--border-light);
      color: var(--text-main);
    }
    .badge.warn { background: var(--accent-bg); color: var(--accent); border-color: #fde68a; }
    .badge.danger { background: var(--danger-bg); color: var(--danger); border-color: #fecdd3; }
    .badge.ok { background: var(--success-bg); color: var(--success); border-color: #bbf7d0; }

    .omni-capsule {
      flex: 1;
      min-width: 240px;
      max-width: 460px;
      display: flex;
      align-items: center;
      background: var(--bg-subtle);
      border: 1px solid var(--border-light);
      border-radius: 999px;
      padding: 4px 12px;
      gap: 6px;
    }
    .omni-capsule:focus-within {
      border-color: var(--primary);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.12);
    }
    .omni-capsule input { border: none; background: transparent; outline: none; flex: 1; font-size: inherit; color: var(--text-main); }

    .topbar-actions { display: flex; align-items: center; gap: 6px; margin-left: auto; flex-wrap: wrap; }

    button, .btn {
      border: 1px solid var(--border-light);
      background: #fff;
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 7px;
      cursor: pointer;
      font-size: calc(13px * var(--font-scale));
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s;
    }
    button:hover { background: var(--bg-subtle); border-color: #cbd5e1; }
    button.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
    button.primary:hover { background: var(--primary-dark); }
    button.warn { background: var(--accent-bg); color: var(--accent); border-color: #fcd34d; }
    button.danger { background: var(--danger-bg); color: var(--danger); border-color: #fda4af; }
    button.sm { padding: 4px 8px; font-size: calc(12px * var(--font-scale)); }

    .sandbox-banner {
      background: #fef3c7;
      color: #92400e;
      padding: 6px 18px;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #fde68a;
    }

    .workspace { display: flex; flex: 1; overflow: hidden; }
    .sidebar {
      width: 236px;
      background: #ffffff;
      border-right: 1px solid var(--border-light);
      padding: 12px 10px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .stage-label { font-size: 11px; color: var(--text-muted); padding: 10px 10px 4px; letter-spacing: 0.5px; }
    .nav-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 11px;
      border-radius: 8px;
      cursor: pointer;
      color: var(--text-main);
      font-weight: 500;
      transition: background 0.15s;
    }
    .nav-item:hover { background: var(--bg-subtle); }
    .nav-item.active { background: var(--primary-light); color: var(--primary-dark); font-weight: 700; }

    .main-stage { flex: 1; overflow-y: auto; padding: 18px 22px 60px; }

    .grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; margin-bottom: 16px; }
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 16px; margin-bottom: 16px; }
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--bg-subtle);
      gap: 8px;
      flex-wrap: wrap;
    }
    .card-title { font-weight: 700; font-size: calc(15px * var(--font-scale)); }
    .stat-val { font-size: calc(22px * var(--font-scale)); font-weight: 700; color: var(--primary-dark); margin: 4px 0; }
    .stat-sub { font-size: calc(12px * var(--font-scale)); color: var(--text-muted); }

    .progress-bar { height: 8px; background: var(--bg-subtle); border-radius: 999px; overflow: hidden; border: 1px solid var(--border-light); margin-top: 6px; }
    .progress-fill { height: 100%; background: var(--primary); transition: width 0.3s; }

    .form-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; margin-bottom: 12px; }
    .field { display: flex; flex-direction: column; gap: 4px; min-width: 130px; flex: 1; }
    .field label { font-size: calc(12px * var(--font-scale)); color: var(--text-muted); }
    input, select, textarea {
      padding: 7px 10px;
      border: 1px solid var(--border-light);
      border-radius: 6px;
      font-size: inherit;
      font-family: inherit;
      background: #fff;
      color: var(--text-main);
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); }

    table { width: 100%; border-collapse: collapse; font-size: calc(13px * var(--font-scale)); }
    th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--border-light); }
    th { background: var(--bg-subtle); color: var(--text-muted); font-weight: 600; }
    tr.voided-row { opacity: 0.55; text-decoration: line-through; background: #fff1f2; }

    .decision-card {
      border-left: 4px solid var(--accent);
      background: #fffbeb;
      padding: 12px 14px;
      border-radius: 8px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .decision-card.danger { border-left-color: var(--danger); background: #fff1f2; }

    .sku-pill-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 8px;
      max-height: 280px;
      overflow-y: auto;
      padding: 4px;
    }
    .sku-pick-btn {
      flex-direction: column;
      align-items: flex-start;
      padding: 8px 10px;
      border-radius: 8px;
      text-align: left;
    }

    .check-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(175px, 1fr)); gap: 8px; margin: 8px 0; }
    .check-item { display: flex; align-items: center; gap: 6px; font-size: 13px; background: var(--bg-subtle); padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border-light); cursor: pointer; }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }
    .overlay.show { display: flex; }
    .modal-box {
      background: #fff;
      border-radius: 14px;
      max-width: 620px;
      width: 100%;
      padding: 22px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      max-height: 90vh;
      overflow-y: auto;
    }
    .avatar-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; margin: 16px 0; }
    .avatar-card {
      border: 1px solid var(--border-light);
      border-radius: 10px;
      padding: 14px 10px;
      text-align: center;
      cursor: pointer;
      transition: all 0.15s;
    }
    .avatar-card:hover { border-color: var(--primary); background: var(--primary-light); }

    .signage-screen {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #0f766e 0%, #115e59 100%);
      color: #fff;
      z-index: 200;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 40px;
    }
    .signage-screen.show { display: flex; }

    .toast {
      position: fixed;
      bottom: 22px;
      right: 22px;
      background: #1e293b;
      color: #fff;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 13px;
      z-index: 300;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
    }
    .toast.show { opacity: 1; }

    @media print {
      .topbar, .sidebar, .no-print { display: none !important; }
      .workspace, .main-stage { overflow: visible !important; height: auto !important; }
    }
  </style>
</head>
<body>

  <header class="topbar no-print" id="topbar" title="提示：双击顶部空白处可一键开启/关闭防窥脱敏掩护">
    <div class="brand">
      <span>🏮 商道相通</span>
      <select class="store-select" id="storeSelector" title="切换当前查看的总店/分店"></select>
      <span class="badge ok" id="geneBadge">社区便利</span>
    </div>

    <div class="omni-capsule">
      <span>🔍</span>
      <input type="text" id="omniInput" placeholder="扫条码 / 搜货号 / 指令如“老王赊账48元”或“家用拿走200”..." />
      <button class="sm" id="btnOmniVoice">🎙️ 解析</button>
    </div>

    <div class="topbar-actions">
      <button class="sm" id="btnAccountSwitch">👑 <span id="activeAccName">本机掌柜</span></button>
      <button class="sm" id="btnToggleUiMode">🌿 极简白纸态</button>
      <button class="sm" id="btnPrivacyShield">👁️ 防窥</button>
      <button class="sm" id="btnCustomerScreen">📺 副屏客显</button>
      <button class="sm" id="btnLockScreen">🔒 锁屏</button>
    </div>
  </header>

  <div class="sandbox-banner no-print" id="sandboxBanner" style="display:none;">
    <span>🎓 <strong>当前处于【练手模拟舱】</strong>：所有开单、改价、冲销操作均在内存沙盒演练，绝不写入正式账本。</span>
    <button class="sm warn" id="btnExitSandbox">退出模拟舱并还原正式账本</button>
  </div>

  <div class="workspace">
    <aside class="sidebar no-print" id="sidebarNav"></aside>
    <main class="main-stage" id="mainStage"></main>
  </div>

  <div class="overlay" id="lockOverlay">
    <div class="modal-box">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h3 style="margin:0;">🔐 岗位值班切换与安全锁</h3>
        <button class="sm" id="btnCloseLockModal">关闭</button>
      </div>
      <p style="color:var(--text-muted); font-size:13px;">点击对应值班头像即可切换岗位（受手电筒权限自动隔离视野）：</p>
      <div class="avatar-grid" id="avatarGrid"></div>
      <div id="pinVerifyBox" style="display:none; margin-top:12px; padding-top:12px; border-top:1px solid var(--border-light);">
        <div class="form-row">
          <div class="field">
            <label id="pinPromptLabel">请输入 4 位数字上岗口令</label>
            <input type="password" id="pinInput" maxlength="8" placeholder="输入口令..." />
          </div>
          <button class="primary" id="btnConfirmPin">确认上岗</button>
        </div>
      </div>
      <div style="margin-top:14px; padding-top:12px; border-top:1px dashed var(--border-light); display:flex; justify-content:space-between; align-items:center;">
        <span style="font-size:12px; color:var(--text-muted);">新店员学徒练手？进入全真隔离沙盒：</span>
        <button class="sm warn" id="btnEnterSandbox">🎓 进入练手模拟舱</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="roleModalOverlay">
    <div class="modal-box" id="roleModalBody"></div>
  </div>

  <div class="signage-screen" id="signageScreen">
    <div style="font-size:22px; opacity:0.85; margin-bottom:12px;" id="signageStoreTitle">本店今日街坊特惠</div>
    <div style="font-size:56px; font-weight:800; margin-bottom:18px;" id="signageHeadline">新鲜直达 · 诚实守信</div>
    <div style="font-size:28px; max-width:860px; line-height:1.6;" id="signageBody">欢迎光临！支持微信群接龙预订、到店自提，老街坊享专属熟客价。</div>
    <button style="margin-top:40px; background:rgba(255,255,255,0.2); color:#fff; border-color:rgba(255,255,255,0.4);" id="btnExitSignage">退出大屏展示 (ESC)</button>
  </div>

  <div class="toast" id="toastBox"></div>

  <script type="module">
    import {
      StoreCoreEngine,
      MODULE_CATALOG,
      INDUSTRY_GENES,
      PERMISSION_CATALOG,
      roundMoney,
      generateId,
      sha256Hex
    } from './src/modules/store/storeCoreEngine.js';

    const engine = new StoreCoreEngine();
    window.__STORE_ENGINE__ = engine;

    let activeModule = 'pos';
    let posCart = [];
    let orderCart = []; // 交互式订货下单购物车
    let orderFilterKeyword = '';
    let pendingSwitchAccId = null;
    let customerDisplayWin = null;

    const $ = (id) => document.getElementById(id);

    function showToast(msg) {
      const box = $('toastBox');
      box.textContent = msg;
      box.classList.add('show');
      clearTimeout(box._t);
      box._t = setTimeout(() => box.classList.remove('show'), 2800);
    }

    function renderAll() {
      const store = engine.getActiveStore();
      const gene = engine.getActiveGene();
      const acc = engine.getCurrentAccount();
      const metrics = engine.getDashboardMetrics();

      document.body.classList.toggle('elder-mode', Boolean(engine.state.meta.elderLargeMode));

      const visibleStores = engine.getVisibleStores();
      const sel = $('storeSelector');
      sel.innerHTML = visibleStores.map(s => `<option value="${s.id}" ${s.id === store.id ? 'selected' : ''}>🏪 ${s.name}</option>`).join('');
      sel.onchange = () => {
        const res = engine.switchStore(sel.value);
        if (res.ok) {
          posCart = [];
          orderCart = [];
          showToast(`已切换至【${res.store.name}】`);
        } else {
          showToast(res.message);
        }
      };

      $('geneBadge').textContent = gene.name.split('/')[0].trim();
      $('activeAccName').textContent = acc.name;
      $('btnToggleUiMode').textContent = engine.state.meta.uiMode === 'simple' ? '🌿 极简白纸态' : '🧭 全面调度态';
      $('btnPrivacyShield').textContent = engine.privacyShieldActive ? '🙈 已开启防窥' : '👁️ 防窥';
      $('sandboxBanner').style.display = engine.sandboxMode ? 'flex' : 'none';

      if (engine.state.rbac.locked) openAccountModal(true);

      const allowedModules = MODULE_CATALOG.filter(m => engine.canAccessModule(m.id));
      if (allowedModules.length > 0 && !allowedModules.some(m => m.id === activeModule)) {
        activeModule = allowedModules[0].id;
      }

      renderSidebar(allowedModules, metrics);
      renderMainStage(metrics);
      syncCustomerDisplayWindow();
    }

    function renderSidebar(allowedModules, metrics) {
      const nav = $('sidebarNav');
      let lastStage = '';
      let html = '';

      for (const mod of allowedModules) {
        if (mod.stage !== lastStage) {
          html += `<div class="stage-label">${mod.stage}</div>`;
          lastStage = mod.stage;
        }
        let badgeHtml = '';
        if (mod.id === 'receiving' && metrics.pendingPurchaseOrders.length > 0) {
          badgeHtml = `<span class="badge warn">${metrics.pendingPurchaseOrders.length}待签收</span>`;
        } else if (mod.id === 'finance' && metrics.pendingApprovals.length > 0) {
          badgeHtml = `<span class="badge warn">${metrics.pendingApprovals.length}待核决</span>`;
        } else if (mod.id === 'catalog' && metrics.lowStockSkus.length > 0) {
          badgeHtml = `<span class="badge danger">${metrics.lowStockSkus.length}缺货</span>`;
        }
        html += `
          <div class="nav-item ${activeModule === mod.id ? 'active' : ''}" data-mod="${mod.id}">
            <span>${mod.icon} ${mod.name}</span>
            ${badgeHtml}
          </div>
        `;
      }

      html += `
        <div class="stage-label">全域平台协同</div>
        <div class="nav-item" onclick="location.href='index.html'"><span>📱 掌中宝随身作战舱</span></div>
        <div class="nav-item" onclick="window.open('mall.html','_blank')"><span>🛒 逛大集源头拼单</span></div>
        <div class="nav-item" onclick="window.open('suppliers.html','_blank')"><span>🏭 百业供需名录</span></div>
      `;
      nav.innerHTML = html;

      nav.querySelectorAll('[data-mod]').forEach(el => {
        el.onclick = () => { activeModule = el.dataset.mod; renderAll(); };
      });
    }

    function renderMainStage(metrics) {
      const stage = $('mainStage');
      const isSimple = engine.state.meta.uiMode === 'simple';

      switch (activeModule) {
        case 'procurement': stage.innerHTML = viewProcurement(metrics); bindProcurementEvents(); break;
        case 'receiving':   stage.innerHTML = viewReceiving(metrics); bindReceivingEvents(); break;
        case 'catalog':     stage.innerHTML = viewCatalog(metrics); bindCatalogEvents(); break;
        case 'pos':         stage.innerHTML = viewPos(metrics, isSimple); bindPosEvents(); break;
        case 'marketing':   stage.innerHTML = viewMarketing(); bindMarketingEvents(); break;
        case 'finance':     stage.innerHTML = viewFinance(metrics); bindFinanceEvents(); break;
        case 'reconcile':   stage.innerHTML = viewReconcile(); bindReconcileEvents(); break;
        case 'governance':  stage.innerHTML = viewGovernance(); bindGovernanceEvents(); break;
        default:            stage.innerHTML = viewPos(metrics, isSimple); bindPosEvents();
      }
    }

    /* ------------------------------------------------------------------------
     * 模块 ①：交互式订货下单台 & 供货方名册（完整恢复并升级！）
     * ------------------------------------------------------------------------ */
    function viewProcurement(metrics) {
      const canCost = engine.hasPermission('viewCostAndProfit');
      const storeSkus = engine.state.catalog.filter(s => s.storeId === engine.state.activeStoreId || !s.storeId);
      const filteredSkus = orderFilterKeyword
        ? storeSkus.filter(s => s.name.toLowerCase().includes(orderFilterKeyword.toLowerCase()) || (s.barcode && s.barcode.includes(orderFilterKeyword)))
        : storeSkus;
      const orderTotal = roundMoney(orderCart.reduce((s, it) => s + it.qty * it.unitPrice, 0));
      const storeOrders = (engine.state.purchaseOrders || []).filter(o => o.storeId === engine.state.activeStoreId);

      return `
        <!-- 交互式选品订货下单工作台 -->
        <div class="grid-2">
          <div class="card">
            <div class="card-header">
              <span class="card-title">🛒 第一步：交互式选品加购（点选商品加入采购单）</span>
              <div style="display:flex; gap:6px; flex-wrap:wrap;">
                <button class="sm warn" id="btnAutoSplitRestock">⚡ 缺货自动拆单(${metrics.lowStockSkus.length})</button>
                <button class="sm" id="btnQuickCustomOrderLine">+ 临采新品</button>
              </div>
            </div>

            <div class="form-row">
              <div class="field">
                <input type="text" id="orderSkuSearch" value="${orderFilterKeyword}" placeholder="输入品名或条码筛选货架商品..." />
              </div>
            </div>

            <div class="sku-pill-grid">
              ${filteredSkus.length === 0
                ? `<div class="stat-sub" style="grid-column:span 2; padding:16px;">暂无商品，可点右上角“+ 临采新品”直接订货</div>`
                : filteredSkus.map(s => `
                  <button class="sku-pick-btn" data-pick-order-sku="${s.id}">
                    <strong style="font-size:13px;">${s.name}</strong>
                    <span class="stat-sub">库存:${s.stock}${s.unit} ${canCost ? `· 进价¥${s.costPrice}` : ''}</span>
                  </button>
                `).join('')
              }
            </div>
          </div>

          <div class="card">
            <div class="card-header">
              <span class="card-title">📝 第二步：核对采购订货单并发出</span>
              <button class="sm" id="btnClearOrderCart">清空</button>
            </div>

            <div class="form-row">
              <div class="field">
                <label>向哪家供货方订货</label>
                <select id="orderSupplierSelect">

    function bindProcurementEvents() {
      if ($('orderSkuSearch')) {
        $('orderSkuSearch').oninput = (e) => {
          orderFilterKeyword = e.target.value;
          renderAll();
          const inp = $('orderSkuSearch');
          if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
        };
      }

      document.querySelectorAll('[data-pick-order-sku]').forEach(btn => {
        btn.onclick = () => {
          const sku = engine.state.catalog.find(s => s.id === btn.dataset.pickOrderSku);
          if (!sku) return;
          const existing = orderCart.find(c => c.skuId === sku.id);
          if (existing) existing.qty += 1;
          else orderCart.push({ skuId: sku.id, name: sku.name, unit: sku.unit, qty: Math.max(1, (sku.maxStock || 20) - Math.max(0, sku.stock)), unitPrice: sku.costPrice || 0 });
          if (sku.supplierId && $('orderSupplierSelect')) {
            $('orderSupplierSelect').value = sku.supplierId;
          }
          renderAll();
        };
      });

      if ($('btnQuickCustomOrderLine')) {
        $('btnQuickCustomOrderLine').onclick = () => {
          const name = prompt('输入临采新品名称：');
          if (!name) return;
          const qty = Number(prompt('输入订购数量：', '10')) || 1;
          const unitPrice = roundMoney(prompt('输入预期进货单价（元）：', '5'));
          orderCart.push({ skuId: '', name: name.trim(), unit: engine.getActiveGene().unitDefault, qty, unitPrice });
          renderAll();
        };
      }

      document.querySelectorAll('[data-ord-qty]').forEach(inp => {
        inp.onchange = () => { orderCart[inp.dataset.ordQty].qty = Math.max(1, Number(inp.value) || 1); renderAll(); };
      });
      document.querySelectorAll('[data-ord-price]').forEach(inp => {
        inp.onchange = () => { orderCart[inp.dataset.ordPrice].unitPrice = roundMoney(inp.value); renderAll(); };
      });
      document.querySelectorAll('[data-ord-del]').forEach(btn => {
        btn.onclick = () => { orderCart.splice(btn.dataset.ordDel, 1); renderAll(); };
      });
      if ($('btnClearOrderCart')) $('btnClearOrderCart').onclick = () => { orderCart = []; renderAll(); };

      if ($('btnSubmitPurchaseOrder')) {
        $('btnSubmitPurchaseOrder').onclick = () => {
          if (orderCart.length === 0) return showToast('请先点选要订购的商品');
          const res = engine.createPurchaseOrder({
            supplierId: $('orderSupplierSelect').value,
            items: orderCart,
            note: $('orderNoteInput').value.trim()
          });
          if (res.ok) {
            orderCart = [];
            showToast(`✅ ${res.message}，货到时可在②板块一键签收`);
            renderAll();
          }
        };
      }

      if ($('btnAutoSplitRestock')) {
        $('btnAutoSplitRestock').onclick = () => {
          const res = engine.autoSplitRestockOrders();
          showToast(res.message);
          renderAll();
        };
      }

      document.querySelectorAll('[data-copy-po]').forEach(btn => {
        btn.onclick = () => {
          const text = engine.formatPurchaseOrderText(btn.dataset.copyPo);
          navigator.clipboard?.writeText(text);
          alert(`已复制电子订货单（可直接发微信给供货商）：\n\n${text}`);
        };
      });

      document.querySelectorAll('[data-clone-po]').forEach(btn => {
        btn.onclick = () => {
          const res = engine.cloneLastPurchaseOrder(btn.dataset.clonePo);
          showToast(res.message);
          renderAll();
        };
      });

      document.querySelectorAll('[data-goto-rcv]').forEach(btn => {
        btn.onclick = () => {
          activeModule = 'receiving';
          renderAll();
        };
      });

      if ($('btnAddSupplier')) {
        $('btnAddSupplier').onclick = () => {
          const name = prompt('输入供货方/批发商名称：');
          if (!name) return;
          const phone = prompt('输入送货师傅或业务员电话：', '');
          engine.state.suppliers.unshift({
            id: generateId('SUP'),
            name: name.trim(),
            contact: '',
            phone: phone || '',
            category: '综合供货',
            creditNote: '',
            payableBalance: 0,
            carrierBalance: 0,
            updatedAt: Date.now()
          });
          engine._persist();
          showToast(`已添加供货方【${name}】`);
          renderAll();
        };
      }

      if ($('btnGenJointOrder')) {
        $('btnGenJointOrder').onclick = () => {
          const lines = orderCart.length > 0
            ? orderCart.map((s, i) => `${i + 1}. ${s.name} × ${s.qty}${s.unit}`).join('\n')
            : '1. 畅销饮品/粮油常规补货 20箱';
          const text = `🤝【片区邻里联采拼单需求单（已脱敏底价与库存）】\n发起门店：${engine.getActiveStore().name}\n${lines}\n欢迎同片区同行接龙凑大单向源头厂家压价！`;
          navigator.clipboard?.writeText(text);
          alert(`已生成并复制脱敏联采单：\n\n${text}`);
        };
      }
    }

              <label>供货商</label>
              <select id="rcvSupplier">

              </select>
            </div>
            <div class="field" style="flex:2;">
              <label>到货商品</label>
              <select id="rcvSku">
                ${skus.map(s => `<option value="${s.id}">${s.name} (当前库存:${s.stock}${s.unit})</option>`).join('')}
              </select>

            <div class="field"><label>实收数量</label><input type="number" id="rcvQty" value="20" /></div>

      `;

    function bindReceivingEvents() {
      document.querySelectorAll('[data-rcv-po]').forEach(btn => {
        btn.onclick = () => {
          const carrierDelta = Number(prompt('本次随车周转筐/水桶净增减（借入填正数，归还填负数，无则填0）：', '0')) || 0;
          const res = engine.receivePurchaseOrder(btn.dataset.rcvPo, {
            payMethod: btn.dataset.pay,
            carrierDelta
          });
          showToast(res.message);
          renderAll();
        };
      });

      if ($('btnConfirmReceive')) {
        $('btnConfirmReceive').onclick = () => {
          const sku = engine.state.catalog.find(s => s.id === $('rcvSku')?.value);
          if (!sku) return showToast('请先在商品库建立至少一款商品');
          const qty = Number($('rcvQty').value) || 0;
          const bonusQty = Number($('rcvBonus').value) || 0;
          const unitPrice = roundMoney($('rcvPrice').value);
          const carrierDelta = Number($('rcvCarrier').value) || 0;
          const payMethod = $('rcvPayMethod').value;
          const total = roundMoney(qty * unitPrice);

          const res = engine.commitVoucher({
            type: 'RECEIVE',
            items: [{ skuId: sku.id, name: sku.name, qty, bonusQty, unitPrice, costPrice: unitPrice }],
            totalAmount: total,
            payMethod,
            cashPaid: payMethod === 'CASH' ? total : 0,
            creditAmount: payMethod === 'CREDIT' ? total : 0,
            carrierDelta,
            counterpartyId: $('rcvSupplier').value,
            note: `随车签收入库（含赠${bonusQty}）`
          });
          if (res.ok) {
            showToast(`✅ 已签收入库【${sku.name}】共 ${qty + bonusQty} ${sku.unit}`);
            renderAll();
          }
        };
      }
    }

    function bindCatalogEvents() {
      if ($('btnAddSku')) {
        $('btnAddSku').onclick = () => {
          const name = $('skuName').value.trim();
          if (!name) return showToast('请填写商品名称');
          const packCost = Number($('skuPackCost').value) || 0;
          const packSize = Math.max(1, Number($('skuPackSize').value) || 1);
          const unitCost = roundMoney(packCost / packSize);
          const retail = roundMoney($('skuRetail').value);
          const stock = Number($('skuStock').value) || 0;
          const gene = engine.getActiveGene();

          engine.state.catalog.unshift({
            id: generateId('SKU'),
            storeId: engine.state.activeStoreId,
            barcode: $('skuCode').value.trim(),
            scaleCode: '',
            name,
            category: gene.quickTags[0] || '主营商品',
            unit: gene.unitDefault,
            packUnit: gene.packUnitDefault,
            packSize,
            costPrice: unitCost,
            retailPrice: retail,
            memberPrice: retail,
            wholesalePrice: retail,
            tierPrices: [],
            stock,
            minStock: 5,
            maxStock: 100,
            supplierId: '',
            expiryDate: '',
            location: '',
            isBundle: false,
            bundleItems: [],
            updatedAt: Date.now()
          });
          engine._persist();
          showToast(`已保存【${name}】，拆零单件底价 ¥${unitCost}`);
          renderAll();
        };
      }

      if ($('btnLossGift')) {
        $('btnLossGift').onclick = () => {
          const skus = engine.state.catalog.filter(s => s.storeId === engine.state.activeStoreId || !s.storeId);
          if (skus.length === 0) return showToast('请先添加商品');
          const name = prompt('输入报损或自用商品名称：', skus[0].name);
          const sku = skus.find(s => s.name.includes(name));
          if (!sku) return showToast('未找到匹配商品');
          const qty = Number(prompt(`输入减少数量（${sku.unit}）：`, '1')) || 0;
          const reason = prompt('选择用途备注（如：破损报损 / 店内自用 / 试吃人情往来）：', '破损报损');
          if (qty > 0) {
            engine.commitVoucher({
              type: 'LOSS_GIFT',
              items: [{ skuId: sku.id, name: sku.name, qty, unitPrice: sku.costPrice, costPrice: sku.costPrice }],
              note: reason
            });
            showToast(`已登记【${sku.name}】${qty}${sku.unit}（${reason}）`);
            renderAll();
          }
        };
      }

      if ($('btnTransferStore')) {
        $('btnTransferStore').onclick = () => {
          const otherStores = engine.state.stores.filter(s => s.id !== engine.state.activeStoreId);
          if (otherStores.length === 0) return showToast('暂无其他分店可调拨');
          const target = otherStores[0];
          const skus = engine.state.catalog.filter(s => s.storeId === engine.state.activeStoreId);
          if (skus.length === 0) return showToast('当前门店暂无可调拨商品');
          const name = prompt(`调往【${target.name}】，输入商品名称：`, skus[0].name);
          const sku = skus.find(s => s.name.includes(name));
          if (!sku) return showToast('未找到商品');
          const qty = Number(prompt(`输入调出数量（${sku.unit}）：`, '5')) || 0;
          if (qty > 0) {
            engine.commitVoucher({
              type: 'TRANSFER_STORE',
              targetStoreId: target.id,
              items: [{ skuId: sku.id, name: sku.name, qty, unitPrice: sku.costPrice, costPrice: sku.costPrice }],
              note: `调拨至【${target.name}】`
            });
            showToast(`已调出 ${qty}${sku.unit} 至【${target.name}】`);
            renderAll();
          }
        };
      }

      document.querySelectorAll('[data-add-pos]').forEach(btn => {
        btn.onclick = () => {
          const sku = engine.state.catalog.find(s => s.id === btn.dataset.addPos);
          if (sku) {
            posCart.push({ skuId: sku.id, name: sku.name, qty: 1, unitPrice: sku.retailPrice, costPrice: sku.costPrice });
            activeModule = 'pos';
            renderAll();
          }
        };
      });

      document.querySelectorAll('[data-add-ord]').forEach(btn => {
        btn.onclick = () => {
          const sku = engine.state.catalog.find(s => s.id === btn.dataset.addOrd);
          if (sku) {
            orderCart.push({ skuId: sku.id, name: sku.name, unit: sku.unit, qty: 10, unitPrice: sku.costPrice || 0 });
            activeModule = 'procurement';
            renderAll();
          }
        };
      });
    }

    function bindPosEvents() {
      const searchEl = $('posSearchInput');
      if (searchEl) {
        searchEl.onkeydown = (e) => {
          if (e.key !== 'Enter') return;
          const q = searchEl.value.trim();
          if (!q) return;
          const matches = engine.searchCatalog(q);
          if (matches.length > 0) {
            const sku = matches[0];
            const existing = posCart.find(c => c.skuId === sku.id);
            if (existing) existing.qty += 1;
            else posCart.push({ skuId: sku.id, name: sku.name, qty: 1, unitPrice: sku.retailPrice, costPrice: sku.costPrice });
            searchEl.value = '';
            renderAll();
          } else {
            const priceStr = prompt(`商品库暂无【${q}】，请输入零售单价（元）直接边卖边建档：`, '10');
            if (priceStr !== null && !isNaN(Number(priceStr))) {
              const price = roundMoney(priceStr);
              const newSku = {
                id: generateId('SKU'),
                storeId: engine.state.activeStoreId,
                barcode: /^\d+$/.test(q) ? q : '',
                scaleCode: '',
                name: q,
                category: engine.getActiveGene().quickTags[0] || '主营商品',
                unit: engine.getActiveGene().unitDefault,
                packUnit: engine.getActiveGene().packUnitDefault,
                packSize: 1,
                costPrice: 0,
                retailPrice: price,
                memberPrice: price,
                wholesalePrice: price,
                tierPrices: [],
                stock: 0,
                minStock: 5,
                maxStock: 100,
                supplierId: '',
                expiryDate: '',
                location: '',
                isBundle: false,
                bundleItems: [],
                updatedAt: Date.now()
              };
              engine.state.catalog.push(newSku);
              posCart.push({ skuId: newSku.id, name: newSku.name, qty: 1, unitPrice: price, costPrice: 0 });
              searchEl.value = '';
              showToast(`已自动建档【${q}】并加入收银台`);
              renderAll();
            }
          }
        };
      }

      if ($('btnQuickNoCatalog')) {
        $('btnQuickNoCatalog').onclick = () => {
          const name = prompt('输入临时代收品名：', '散装百货');
          if (!name) return;
          const price = roundMoney(prompt('输入金额（元，负数代表退货/退押金）：', '10'));
          posCart.push({ skuId: '', name, qty: 1, unitPrice: price, costPrice: 0 });
          renderAll();
        };
      }

      if ($('btnAcceptCrossSell')) {
        $('btnAcceptCrossSell').onclick = () => {
          const hint = engine.getCrossSellHint(posCart.map(i => i.skuId));
          if (hint) {
            posCart.push({ skuId: hint.sku.id, name: hint.sku.name, qty: 1, unitPrice: hint.sku.retailPrice, costPrice: hint.sku.costPrice });
            renderAll();
          }
        };
      }

      if ($('btnAddServiceTicket')) {
        $('btnAddServiceTicket').onclick = () => {
          const typeChoice = prompt('选择工单类型：1=街坊代订自提(剥离驿站服务纯利)  2=定金取货/售后质保凭证', '1');
          const customerName = prompt('街坊/客户称呼：', '李姐');
          if (!customerName) return;
          const phoneTail = prompt('手机尾号（4位，方便到店核销）：', '8866') || '0000';
          const itemDesc = prompt('登记事项或代订货品名称：', '大集拼单礼盒 1箱') || '代订包裹';
          const totalFee = roundMoney(prompt('货款总额（元）：', '50'));
          const serviceProfit = typeChoice === '1' ? roundMoney(prompt('其中本店驿站服务纯利（元）：', '5')) : 0;

          engine.state.serviceTickets.unshift({
            id: generateId('TKT'),
            storeId: engine.state.activeStoreId,
            type: typeChoice === '1' ? 'RELAY_PICKUP' : 'DEPOSIT',
            customerName,
            phoneTail,
            itemDesc,
            totalFee,
            serviceProfit,
            status: 'OPEN',
            createdAt: Date.now()
          });
          engine._persist();
          showToast(`已登记工单（尾号 ${phoneTail}）`);
          renderAll();
        };
      }

      document.querySelectorAll('[data-done-ticket]').forEach(btn => {
        btn.onclick = () => {
          const tkt = engine.state.serviceTickets.find(t => t.id === btn.dataset.doneTicket);
          if (!tkt) return;
          tkt.status = 'DONE';
          engine.commitVoucher({
            type: 'RELAY_ORDER',
            totalAmount: tkt.totalFee,
            serviceFee: tkt.serviceProfit || 0,
            payMethod: 'DIGITAL',
            digitalPaid: tkt.totalFee,
            note: `核销交付【${tkt.customerName}】(尾号${tkt.phoneTail})：${tkt.itemDesc}`
          });
          showToast(`已核销交付，驿站服务纯利 ¥${tkt.serviceProfit || 0} 已独立入账`);
          renderAll();
        };
      });

      document.querySelectorAll('[data-cart-qty]').forEach(inp => {
        inp.onchange = () => { posCart[inp.dataset.cartQty].qty = Number(inp.value) || 0; renderAll(); };
      });
      document.querySelectorAll('[data-cart-price]').forEach(inp => {
        inp.onchange = () => { posCart[inp.dataset.cartPrice].unitPrice = roundMoney(inp.value); renderAll(); };
      });
      document.querySelectorAll('[data-cart-del]').forEach(btn => {
        btn.onclick = () => { posCart.splice(btn.dataset.cartDel, 1); renderAll(); };
      });

      const checkout = (payMethod) => {
        if (posCart.length === 0) return showToast('收银台当前为空');
        const cusId = $('posCustomerSelect')?.value || '';
        if (payMethod === 'CREDIT' && !cusId) return showToast('熟客记账请先在上方选择对应熟客');
        const total = roundMoney(posCart.reduce((s, it) => s + it.qty * it.unitPrice, 0));
        const res = engine.commitVoucher({
          type: 'SALE',
          typeName: '柜台收银单',
          items: posCart,
          totalAmount: total,
          payMethod,
          cashPaid: payMethod === 'CASH' ? total : 0,
          digitalPaid: payMethod === 'DIGITAL' ? total : 0,
          creditAmount: payMethod === 'CREDIT' ? total : 0,
          counterpartyId: cusId
        });
        if (res.ok) {
          posCart = [];
          engine.speakFeedback(`收款${total}元，已入账`);
          showToast(`✅ 收银落账成功（单号 ${res.voucher.id}）`);
        } else {
          showToast(`⚠️ ${res.message}`);
        }
        renderAll();
      };

      if ($('btnPayDigital')) $('btnPayDigital').onclick = () => checkout('DIGITAL');
      if ($('btnPayCash')) $('btnPayCash').onclick = () => checkout('CASH');
      if ($('btnPayCredit')) $('btnPayCredit').onclick = () => checkout('CREDIT');
      if ($('btnClearCart')) $('btnClearCart').onclick = () => { posCart = []; renderAll(); };

      if ($('btnUploadQr')) {
        $('btnUploadQr').onclick = () => {
          const url = prompt('请输入收款码图片地址或粘贴 DataURL：', engine.getActiveStore().paymentQrUrl);
          if (url !== null) {
            engine.getActiveStore().paymentQrUrl = url.trim();
            engine._persist();
            showToast('收款码已更新并加锁保护');
            renderAll();
          }
        };
      }

      if ($('btnCloseShift')) {
        $('btnCloseShift').onclick = () => {
          const counted = Number($('shiftCountedCash').value);
          const note = $('shiftNote').value;
          const res = engine.closeShiftAndLock(counted, note);
          showToast(`交接班封账完成，现金长短款差额：¥${res.shiftRecord.cashDiff}`);
          renderAll();
        };
      }
    }

    function bindReconcileEvents() {
      if ($('btnExportIron')) {
        $('btnExportIron').onclick = async () => {
          const pass = prompt('可选：输入微信转发加密口令（留空则导出明文防篡改封签包）：', '');
          if (pass === null) return;
          const pkg = await engine.exportIronBackup(pass.trim());
          const blob = new Blob([JSON.stringify(pkg, null, 2)], { type: 'application/json' });
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = `商道铁账备份_${new Date().toISOString().slice(0, 10)}.json`;
          a.click();
          showToast('铁账备份包已导出，可发微信永久留底');
        };
      }

      if ($('fileImportIron')) {
        $('fileImportIron').onchange = (e) => {
          const file = e.target.files?.[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = async () => {
            let res = await engine.importWithIronJudge(reader.result);
            if (res.needPassphrase) {
              const pass = prompt('该账本受 AES 加密信封保护，请输入解密口令：', '');
              if (pass) res = await engine.importWithIronJudge(reader.result, pass);
            }
            alert(res.message);
            renderAll();
          };
          reader.readAsText(file);
        };
      }

      if ($('btnBarterOffset')) {
        $('btnBarterOffset').onclick = () => {
          if (engine.state.suppliers.length === 0) return showToast('请先在①订货与供货方中添加供货方');
          const sup = engine.state.suppliers[0];
          const amt = roundMoney(prompt(`登记与【${sup.name}】的返利/实物折价冲抵金额（元）：`, '100'));
          const note = prompt('冲抵说明（如：年底陈列返利货抵货款）：', '厂家返利实物冲抵应付货款');
          if (amt > 0) {
            engine.commitVoucher({
              type: 'BARTER_OFFSET',
              totalAmount: amt,
              payMethod: 'OFFSET',
              counterpartyId: sup.id,
              counterpartyName: sup.name,
              note
            });
            showToast(`已生成实物轧差冲抵单 ¥${amt}`);
            renderAll();
          }
        };
      }

      if ($('btnCompactCold')) {
        $('btnCompactCold').onclick = () => {
          const res = engine.compactColdData(90);
          showToast(`冷热分层完成，已归档 ${res.archivedCount} 条 90 天前历史流水`);
          renderAll();
        };
      }

      document.querySelectorAll('[data-void-id]').forEach(btn => {
        btn.onclick = () => {
          const reason = prompt('请输入红字冲销原因（将永久记入审计链）：', '录错更正');
          if (!reason) return;
          const res = engine.voidVoucherWithRedEntry(btn.dataset.voidId, reason);
          showToast(res.message);
          renderAll();
        };
      });
    }

          showToast('家业常青副掌柜接力备忘已保存');
        };
      }

      document.querySelectorAll('[data-snap-id]').forEach(btn => {
        btn.onclick = () => {
          if (!confirm('确认恢复至此时间点快照？当前之后的新增流水将被回退。')) return;
          const res = engine.restoreSnapshot(btn.dataset.snapId);
          showToast(res.message);
          renderAll();
        };
      });
    }

    function openAccountModal(isLocked = false) {
      $('lockOverlay').classList.add('show');
      $('btnCloseLockModal').style.display = isLocked ? 'none' : 'inline-flex';
      $('pinVerifyBox').style.display = 'none';
      const grid = $('avatarGrid');
      grid.innerHTML = engine.state.rbac.accounts.filter(a => a.active).map(acc => {
        const role = engine.state.rbac.roles.find(r => r.id === acc.roleId);
        return `
          <div class="avatar-card" data-acc-id="${acc.id}">
            <div style="font-size:28px;">${acc.avatar}</div>
            <div style="font-weight:700; margin-top:4px;">${acc.name}</div>
            <div style="font-size:11px; color:var(--text-muted);">${role?.name || ''}</div>
          </div>
        `;
      }).join('');

      grid.querySelectorAll('[data-acc-id]').forEach(card => {
        card.onclick = async () => {
          const accId = card.dataset.accId;
          const res = await engine.switchAccount(accId, '');
          if (res.ok) {
            $('lockOverlay').classList.remove('show');
            showToast(`已切换至【${res.account.name}】视角`);
            renderAll();
          } else if (res.needPin) {
            pendingSwitchAccId = accId;
            $('pinPromptLabel').textContent = res.message;
            $('pinVerifyBox').style.display = 'block';
            $('pinInput').value = '';
            $('pinInput').focus();
          }
        };
      });
    }

    $('btnConfirmPin').onclick = async () => {
      if (!pendingSwitchAccId) return;
      const res = await engine.switchAccount(pendingSwitchAccId, $('pinInput').value);
      if (res.ok) {
        $('lockOverlay').classList.remove('show');
        showToast(`口令验证通过，欢迎【${res.account.name}】`);
        renderAll();
      } else {
        showToast(res.message);
      }
    };

    $('btnAccountSwitch').onclick = () => openAccountModal(false);
    $('btnCloseLockModal').onclick = () => $('lockOverlay').classList.remove('show');
    $('btnLockScreen').onclick = () => engine.lockScreen();
    $('btnToggleUiMode').onclick = () => {
      engine.state.meta.uiMode = engine.state.meta.uiMode === 'simple' ? 'full' : 'simple';
      engine._persist();
      renderAll();
    };
    $('btnPrivacyShield').onclick = () => {
      const on = engine.togglePrivacyShield();
      showToast(on ? '已开启防窥掩护，敏感底价已脱敏' : '已恢复正常显示');
    };
    $('topbar').ondblclick = (e) => { if (e.target === $('topbar')) $('btnPrivacyShield').click(); };

    $('btnEnterSandbox').onclick = () => { engine.enterSandbox(); $('lockOverlay').classList.remove('show'); renderAll(); };
    $('btnExitSandbox').onclick = () => { engine.exitSandbox(); showToast('已退出练手模拟舱，正式账本分毫未动'); renderAll(); };
    $('btnExitSignage').onclick = () => $('signageScreen').classList.remove('show');
    window.addEventListener('keydown', (e) => { if (e.key === 'Escape') $('signageScreen').classList.remove('show'); });

    $('btnOmniVoice').onclick = () => {
      const cmd = engine.parseVoiceOrQuickCommand($('omniInput').value);
      if (cmd.intent === 'FAMILY_DRAW' || cmd.intent === 'EXPENSE') {
        if (!cmd.amount) return showToast('请在指令中包含具体金额，如“家用拿走200元”');
        if (confirm(`识别为【${cmd.label}】，金额 ¥${cmd.amount}，确认核准落账吗？`)) {
          engine.commitVoucher({ type: cmd.intent, totalAmount: cmd.amount, payMethod: 'CASH', note: cmd.note });
          $('omniInput').value = '';
          engine.speakFeedback(`已记录${cmd.amount}元`);
          showToast(`✅ ${cmd.label} 已落账`);
          renderAll();
        }
      } else if (cmd.matchedSkus?.length > 0) {
        const sku = cmd.matchedSkus[0];
        posCart.push({ skuId: sku.id, name: sku.name, qty: 1, unitPrice: sku.retailPrice, costPrice: sku.costPrice });
        activeModule = 'pos';
        $('omniInput').value = '';
        showToast(`已将【${sku.name}】加入收银台`);
        renderAll();
      } else {
        showToast(cmd.label || '未匹配到指令');
      }
    };
    $('omniInput').onkeydown = (e) => { if (e.key === 'Enter') $('btnOmniVoice').click(); };

    $('btnCustomerScreen').onclick = () => {
      customerDisplayWin = window.open('', 'CustomerDisplay', 'width=800,height=600');
      syncCustomerDisplayWindow();
      showToast('已开启副屏客显窗口，可拖至面向顾客的副屏');
    };

    function syncCustomerDisplayWindow() {
      if (!customerDisplayWin || customerDisplayWin.closed) return;
      const store = engine.getActiveStore();
      const total = roundMoney(posCart.reduce((s, it) => s + it.qty * it.unitPrice, 0));
      customerDisplayWin.document.open();
      customerDisplayWin.document.write(`
        <!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><title>客显屏 - ${store.name}</title>
        <style>body{font-family:sans-serif;background:#0f172a;color:#fff;margin:0;padding:30px;display:flex;flex-direction:column;height:100vh;box-sizing:border-box;}
        .header{font-size:24px;color:#5eead4;border-bottom:1px solid #334155;padding-bottom:14px;}
        .list{flex:1;overflow:auto;font-size:22px;padding:16px 0;}
        .row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px dashed #334155;}
        .footer{font-size:44px;font-weight:800;text-align:right;color:#fde047;padding-top:16px;border-top:2px solid #475569;}</style></head>
        <body>
          <div class="header">🏮 欢迎光临 ${store.name} · 诚实守信</div>
          <div class="list">
            ${posCart.length === 0 ? '<div style="text-align:center;margin-top:80px;color:#94a3b8;">祝您生活愉快，欢迎选购！</div>' :
              posCart.map(it => `<div class="row"><span>${it.name} × ${it.qty}</span><span>¥${roundMoney(it.qty * it.unitPrice).toFixed(2)}</span></div>`).join('')}
          </div>
          <div class="footer">合计：¥${total.toFixed(2)}</div>
        </body></html>
      `);
      customerDisplayWin.document.close();
    }

    engine.subscribe(() => renderAll());
    renderAll();
  </script>
</body>
</html>
