<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SaaS 平台运营与入驻管理中心</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans p-4 min-h-screen">
  <div class="max-w-6xl mx-auto space-y-4">
    
    <!-- 顶栏运营看板 -->
    <header class="bg-slate-800 border border-slate-700 p-5 rounded-3xl shadow-xl flex flex-wrap justify-between items-center gap-4">
      <div>
        <div class="flex items-center gap-2.5">
          <h1 class="text-lg font-bold text-white tracking-wide">平台运营与入驻授权中枢</h1>
          <span class="bg-indigo-500/20 text-indigo-300 text-[10px] px-2.5 py-0.5 rounded-full border border-indigo-400/30 font-mono">
            角色 1 · Super Admin
          </span>
        </div>
        <div class="text-xs text-slate-400 mt-1 flex flex-wrap gap-4 font-mono">
          <span>入驻总代: <b id="stat-tenants" class="text-white">0 家</b></span>
          <span>有效会员: <b id="stat-active-tenants" class="text-emerald-400">0 家</b></span>
          <span>连接门店: <b id="stat-stores" class="text-amber-400">0 家</b></span>
          <span>全网商品: <b id="stat-products" class="text-indigo-400">0 款</b></span>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button onclick="window.openAddTenantModal()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-3.5 py-2 rounded-xl font-bold shadow transition active:scale-95">
          + 开通新总代
        </button>
        <button onclick="window.loadPlatformData()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs px-3 py-2 rounded-xl font-bold transition">
          刷新大盘
        </button>
      </div>
    </header>

    <!-- 租户会员名册 -->
    <section class="bg-slate-800 border border-slate-700 p-5 rounded-3xl shadow space-y-3">
      <div class="flex flex-wrap justify-between items-center gap-2">
        <div>
          <h2 class="text-sm font-bold text-white">入驻厂家 / 区域总代名册</h2>
          <p class="text-[11px] text-slate-400">管理租户标识、会员级别、服务期截止日与 6 位邀请码</p>
        </div>
        <input type="text" id="search-tenant" oninput="window.filterTenants(this.value)" placeholder="搜索企业名称 / 租户代码..." class="bg-slate-900 border border-slate-700 text-xs text-slate-200 px-3 py-1.5 rounded-xl outline-none focus:border-indigo-500">
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs whitespace-nowrap">
          <thead class="bg-slate-900/60 text-slate-400 font-medium border-b border-slate-700">
            <tr>
              <th class="p-3">租户代码 (Tenant ID)</th>
              <th class="p-3">企业全称</th>
              <th class="p-3">负责人 / 电话</th>
              <th class="p-3">专属邀请码</th>
              <th class="p-3">会员级别</th>
              <th class="p-3">有效期至</th>
              <th class="p-3">状态</th>
              <th class="p-3 text-right">操作</th>
            </tr>
          </thead>
          <tbody id="tenant-table-body" class="divide-y divide-slate-700/60">
            <!-- 动态渲染 -->
          </tbody>
        </table>
      </div>
    </section>

  </div>

  <!-- 开通总代弹窗 -->
  <div id="add-tenant-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-3">
    <div class="bg-slate-800 border border-slate-700 w-full max-w-md rounded-3xl p-5 space-y-3 text-slate-200 shadow-2xl">
      <div class="flex justify-between items-center pb-2 border-b border-slate-700">
        <h3 class="font-bold text-sm text-white">开通新总代 / 厂家入驻</h3>
        <button onclick="window.closeAddTenantModal()" class="text-slate-400 hover:text-white text-lg">✕</button>
      </div>

      <div class="space-y-2 text-xs">
        <div>
          <label class="block text-slate-400 mb-1">企业/总代全称 *：</label>
          <input type="text" id="new-company-name" placeholder="如：北京顺达商贸有限公司" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-1.5 outline-none focus:border-indigo-500">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-slate-400 mb-1">唯一租户代码 (大写) *：</label>
            <input type="text" id="new-tenant-id" placeholder="如：BJ_SHUNDA" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-1.5 font-mono outline-none focus:border-indigo-500">
          </div>
          <div>
            <label class="block text-slate-400 mb-1">6 位专属邀请码 *：</label>
            <input type="text" id="new-invite-code" placeholder="如：888001" maxlength="6" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-1.5 font-mono text-center outline-none focus:border-indigo-500">
          </div>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-slate-400 mb-1">负责人 *：</label>
            <input type="text" id="new-contact" placeholder="如：李经理" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-1.5 outline-none focus:border-indigo-500">
          </div>
          <div>
            <label class="block text-slate-400 mb-1">联系电话 *：</label>
            <input type="tel" id="new-phone" placeholder="11位手机号" maxlength="11" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-1.5 outline-none focus:border-indigo-500">
          </div>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-slate-400 mb-1">会员级别：</label>
            <select id="new-tier" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-1.5 outline-none text-slate-300">
              <option value="pro">专业版 (无上限)</option>
              <option value="standard">标准版 (限100店)</option>
              <option value="trial">试用版 (14天)</option>
            </select>
          </div>
          <div>
            <label class="block text-slate-400 mb-1">授权有效期：</label>
            <select id="new-period-years" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-1.5 outline-none text-slate-300">
              <option value="1">1 年</option>
              <option value="2">2 年</option>
              <option value="0.25">3 个月</option>
            </select>
          </div>
        </div>
      </div>

      <div class="flex gap-2 pt-2 border-t border-slate-700">
        <button onclick="window.submitNewTenant()" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 rounded-xl text-xs active:scale-95 transition">
          确认开通
        </button>
        <button onclick="window.closeAddTenantModal()" class="bg-slate-700 text-slate-300 font-bold px-4 py-2 rounded-xl text-xs">
          取消
        </button>
      </div>
    </div>
  </div>

  <script type="module">
    import { supabase } from './src/lib/supabase.js';

    let allTenants = [];

    window.openAddTenantModal = function() {
      document.getElementById('new-company-name').value = '';
      document.getElementById('new-tenant-id').value = '';
      document.getElementById('new-invite-code').value = Math.floor(100000 + Math.random() * 900000).toString();
      document.getElementById('new-contact').value = '';
      document.getElementById('new-phone').value = '';
      document.getElementById('add-tenant-modal').classList.remove('hidden');
    };

    window.closeAddTenantModal = function() {
      document.getElementById('add-tenant-modal').classList.add('hidden');
    };

    window.loadPlatformData = async function() {
      const { data: tenants } = await supabase.from('platform_tenant').select('*').order('id', { ascending: false });
      allTenants = tenants || [];

      document.getElementById('stat-tenants').innerText = `${allTenants.length} 家`;
      const activeCount = allTenants.filter(t => t.status === 'active').length;
      document.getElementById('stat-active-tenants').innerText = `${activeCount} 家`;

      const { count: storeCount } = await supabase.from('store').select('*', { count: 'exact', head: true });
      const { count: prodCount } = await supabase.from('product').select('*', { count: 'exact', head: true });
      document.getElementById('stat-stores').innerText = `${storeCount || 0} 家`;
      document.getElementById('stat-products').innerText = `${prodCount || 0} 款`;

      renderTenantTable(allTenants);
    };

    function renderTenantTable(list) {
      const tbody = document.getElementById('tenant-table-body');
      if (list.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" class="p-8 text-center text-slate-500">暂无入驻记录</td></tr>';
        return;
      }

      tbody.innerHTML = list.map(t => {
        const isExpired = new Date(t.expire_date) < new Date() || t.status === 'expired';
        const statusBadge = isExpired
          ? `<span class="bg-rose-500/20 text-rose-300 border border-rose-500/30 px-2 py-0.5 rounded-full text-[10px]">已到期</span>`
          : `<span class="bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 px-2 py-0.5 rounded-full text-[10px]">服务中</span>`;

        const tierBadge = t.tier === 'pro'
          ? `<span class="bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 px-2 py-0.5 rounded-full text-[10px] font-bold">专业版</span>`
          : `<span class="bg-slate-700 text-slate-300 px-2 py-0.5 rounded-full text-[10px]">标准版</span>`;

        return `
          <tr class="hover:bg-slate-800/60 transition">
            <td class="p-3 font-mono font-bold text-white">${t.tenant_id}</td>
            <td class="p-3 font-bold text-slate-200">${t.company_name}</td>
            <td class="p-3 text-slate-400 font-mono">${t.contact_name} (${t.phone})</td>
            <td class="p-3 font-mono font-bold text-amber-400">${t.invite_code}</td>
            <td class="p-3">${tierBadge}</td>
            <td class="p-3 font-mono ${isExpired ? 'text-rose-400' : 'text-slate-300'}">${t.expire_date}</td>
            <td class="p-3">${statusBadge}</td>
            <td class="p-3 text-right space-x-2">
              <button onclick="window.renewTenant('${t.tenant_id}', '${t.company_name}')" class="text-[11px] text-emerald-400 hover:underline font-bold">续期</button>
              <button onclick="window.toggleTenantStatus('${t.tenant_id}', '${t.status}')" class="text-[11px] ${t.status === 'active' ? 'text-rose-400' : 'text-indigo-400'} hover:underline font-bold">
                ${t.status === 'active' ? '冻结' : '恢复'}
              </button>
            </td>
          </tr>
        `;
      }).join('');
    }

    window.filterTenants = function(q) {
      if (!q.trim()) return renderTenantTable(allTenants);
      const filtered = allTenants.filter(t => 
        t.company_name.toLowerCase().includes(q.toLowerCase()) || 
        t.tenant_id.toLowerCase().includes(q.toLowerCase())
      );
      renderTenantTable(filtered);
    };

    window.submitNewTenant = async function() {
      const company_name = document.getElementById('new-company-name').value.trim();
      const tenant_id = document.getElementById('new-tenant-id').value.trim().toUpperCase();
      const invite_code = document.getElementById('new-invite-code').value.trim();
      const contact_name = document.getElementById('new-contact').value.trim();
      const phone = document.getElementById('new-phone').value.trim();
      const tier = document.getElementById('new-tier').value;
      const years = parseFloat(document.getElementById('new-period-years').value);

      if (!company_name || !tenant_id || !invite_code || !phone) {
        return alert('请完整填写总代企业全称、租户代码、邀请码与手机号！');
      }

      const exp = new Date();
      exp.setDate(exp.getDate() + Math.round(years * 365));
      const expire_date = exp.toISOString().split('T')[0];

      const { error } = await supabase.from('platform_tenant').insert([{
        tenant_id, company_name, contact_name, phone, invite_code, tier, status: 'active', expire_date
      }]);

      if (error) {
        alert('开通失败: ' + error.message);
      } else {
        alert(`总代【${company_name}】开通成功！\n租户代码：${tenant_id}\n邀请码：${invite_code}`);
        window.closeAddTenantModal();
        window.loadPlatformData();
      }
    };

    window.renewTenant = async function(tenant_id, company_name) {
      const addYears = prompt(`为【${company_name}】延长授权，输入延长年数：`, '1');
      if (!addYears || isNaN(addYears)) return;

      const exp = new Date();
      exp.setDate(exp.getDate() + Math.round(parseFloat(addYears) * 365));
      const newExp = exp.toISOString().split('T')[0];

      await supabase.from('platform_tenant').update({ expire_date: newExp, status: 'active' }).eq('tenant_id', tenant_id);
      alert(`已续期至 ${newExp}`);
      window.loadPlatformData();
    };

    window.toggleTenantStatus = async function(tenant_id, currentStatus) {
      const target = currentStatus === 'active' ? 'expired' : 'active';
      if (!confirm(`确认${target === 'expired' ? '冻结该总代' : '恢复该总代'}？`)) return;

      await supabase.from('platform_tenant').update({ status: target }).eq('tenant_id', tenant_id);
      window.loadPlatformData();
    };

    window.loadPlatformData();
  </script>
</body>
</html>
